# Makes the voiceover videos (AI voice + captions + game music) from marketing/voiced.json,
# saves them to marketing/voiced/, and then the Website workflow republishes Studio.
name: Make videos
on:
  push:
    branches: [main]
    paths: ['marketing/voiced.json', 'marketing/clips/**', 'marketing/music/**', 'scripts/voiceover.py']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: videos
  cancel-in-progress: false
jobs:
  render:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install the voice and video tools
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q ffmpeg espeak-ng
          pip install --quiet torch --index-url https://download.pytorch.org/whl/cpu
          pip install --quiet "kokoro>=0.9.4" soundfile
      - name: Make the videos
        run: python scripts/voiceover.py
      - name: Save them to the repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add marketing/voiced
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Voiceover videos rendered"
          git pull --rebase origin main
          git push origin HEAD:main
