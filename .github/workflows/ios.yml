# Builds the iPhone apps on GitHub's free Mac servers, one per game in the list below.
# Games with testflight: true are signed and sent to TestFlight on every push to main once the
# four APPLE_/ASC_ secrets exist (see README); they show up on your iPhone ~15-30 minutes later.
# The others (and all of them before the key is added) just check that the app compiles.
name: iPhone app
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: tidy-tides
            testflight: true
          - app: crumbstack
            testflight: false
    name: ${{ matrix.app }}
    env:
      HAS_KEY: ${{ matrix.testflight && secrets.ASC_KEY_ID != '' && secrets.ASC_ISSUER_ID != '' && secrets.ASC_KEY_P8 != '' && secrets.APPLE_TEAM_ID != '' }}
    steps:
      - uses: actions/checkout@v4
      - name: Use the newest Xcode (Apple requires Xcode 26+ for uploads)
        run: |
          X=$(ls -d /Applications/Xcode_26*.app /Applications/Xcode.app 2>/dev/null | grep -v beta | sort -V | tail -1); echo "Using $X"; sudo xcode-select -s "$X"; xcodebuild -version
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - name: Create the iPhone project
        run: node scripts/ios-app.mjs ${{ matrix.app }} && npx cap add ios && node scripts/patch-ios.mjs && npx cap sync ios
      - name: Build for the iPhone Simulator (check only)
        if: env.HAS_KEY != 'true'
        run: |
          set -o pipefail
          xcodebuild -workspace ios/App/App.xcworkspace -scheme App -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build | tail -40
      - name: Sign the app and send it to TestFlight
        if: env.HAS_KEY == 'true'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -o pipefail
          KEY="$RUNNER_TEMP/AuthKey_$ASC_KEY_ID.p8"
          printf '%s\n' "$ASC_KEY_P8" > "$KEY"
          AUTH=(-allowProvisioningUpdates -authenticationKeyPath "$KEY" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID")
          xcodebuild -workspace ios/App/App.xcworkspace -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/App.xcarchive" \
            DEVELOPMENT_TEAM="$TEAM_ID" CODE_SIGN_STYLE=Automatic TARGETED_DEVICE_FAMILY=1 \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            "${AUTH[@]}" archive > "$RUNNER_TEMP/archive.log" 2>&1 || { tail -60 "$RUNNER_TEMP/archive.log"; grep -iE "error|fail|no account|no profile|certificate" "$RUNNER_TEMP/archive.log" | grep -v "^\s*$" | sort -u | head -8 | sed 's/^/::error title=Archive::/'; exit 1; }
          tail -5 "$RUNNER_TEMP/archive.log"
          cat > "$RUNNER_TEMP/export.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>export</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/export.plist" -exportPath "$RUNNER_TEMP/out" \
            "${AUTH[@]}" > "$RUNNER_TEMP/export.log" 2>&1 || { tail -60 "$RUNNER_TEMP/export.log"; grep -iE "error|fail|no account|no profile|certificate" "$RUNNER_TEMP/export.log" | sort -u | head -8 | sed 's/^/::error title=Upload::/'; exit 1; }
          tail -5 "$RUNNER_TEMP/export.log"
          IPA=$(ls "$RUNNER_TEMP"/out/*.ipa | head -1); echo "Uploading $IPA"
          mkdir -p ~/private_keys && cp "$KEY" ~/private_keys/
          xcrun altool --upload-app --type ios -f "$IPA" --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID" > "$RUNNER_TEMP/upload.log" 2>&1 || { cat "$RUNNER_TEMP/upload.log" | tail -40; grep -iE "error|fail|could not|no suitable|bundle" "$RUNNER_TEMP/upload.log" | sort -u | head -8 | cut -c1-400 | sed 's/^/::error title=Upload::/'; exit 1; }
          tail -5 "$RUNNER_TEMP/upload.log"
          rm -f "$KEY" ~/private_keys/AuthKey_*.p8
          echo "${{ matrix.app }} build ${{ github.run_number }} sent to TestFlight."
