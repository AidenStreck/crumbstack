<title>Crumbstack</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@700;800;900&display=swap">
<style>
/* Layout: phone-shaped app. Home is a vertical level map (level 1 at the bottom, climbing up through three worlds, then endless bonus worlds that cycle the same kitchens).
   Play screen: HUD (level, goal, hearts, star meter), order ticket with the customer, then the kitchen canvas. Single deliberate candy-bright look. */
:root{
  --bg:#22174A;          /* deep plum frame */
  --bg-2:#342470;
  --butter:#FFD25E;      /* accent */
  --butter-d:#E0A421;
  --cream:#FFF8EA;       /* panels / ticket paper */
  --cream-2:#F3E6C8;
  --ink:#2A1B4F;
  --ink-2:#6E6392;
  --light:#FFFFFF;
  --muted:#C9C0EE;
  --bad:#FF5E57;
  --good:#3FCB7E;
  --ice:#7FD3FF;
  --pink:#FF6FA8;
  --display:"Lilita One","Arial Rounded MT Bold","Trebuchet MS",sans-serif;
  --body:"Nunito",ui-rounded,"Segoe UI",system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--light);font-family:var(--body);font-weight:800;overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
button{font-family:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--light);outline-offset:3px}
#app{position:relative;height:100%;max-width:480px;margin:0 auto;overflow:hidden;background:var(--bg)}
.screen{position:absolute;inset:0;display:flex;flex-direction:column}

/* ---------- Buttons ---------- */
.btn{font-family:var(--display);font-size:22px;letter-spacing:.3px;color:var(--ink);border:0;border-radius:18px;padding:13px 30px;
  background:linear-gradient(#FFE48E,var(--butter) 55%,#F7BC34);box-shadow:0 5px 0 var(--butter-d),0 8px 16px rgba(0,0,0,.25);text-shadow:0 1px 0 rgba(255,255,255,.5)}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--butter-d)}
.btn.green{background:linear-gradient(#7BE8A8,var(--good) 60%,#2BAE66);box-shadow:0 5px 0 #1F8A50,0 8px 16px rgba(0,0,0,.25);color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.2)}
.btn.green:active{box-shadow:0 1px 0 #1F8A50}
.btn.ghost{background:var(--cream-2);box-shadow:0 4px 0 #D4C39C;font-size:18px;padding:10px 20px}
.btn.ghost:active{box-shadow:0 1px 0 #D4C39C}
.iconBtn{width:40px;height:40px;border-radius:12px;border:0;background:rgba(255,255,255,.14);color:var(--light);font-family:var(--display);font-size:18px;display:grid;place-items:center}

/* ---------- Map ---------- */
.mapTop{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-inline:16px;padding-block:10px;background:linear-gradient(var(--bg),rgba(34,23,74,.0));position:absolute;top:0;left:0;right:0;z-index:3}
.logo{font-family:var(--display);font-size:28px;color:var(--butter);text-shadow:0 3px 0 #B8531F,0 6px 14px rgba(0,0,0,.35);letter-spacing:.5px;transform:rotate(-3deg)}
.pills{display:flex;gap:8px}
.pill{display:flex;align-items:center;gap:6px;background:rgba(20,12,50,.65);border-radius:999px;padding:5px 12px 5px 6px;font-family:var(--display);font-size:17px;font-variant-numeric:tabular-nums;backdrop-filter:blur(4px)}
.pill svg{width:22px;height:22px}
#mapScroll{flex:1;overflow-y:auto;overflow-x:hidden;scrollbar-width:none}
#mapScroll::-webkit-scrollbar{display:none}
#mapInner{position:relative;width:100%}
.band{position:absolute;left:0;right:0}
.band.diner{background:radial-gradient(circle at 20% 30%,rgba(255,255,255,.25) 0 6px,transparent 7px) 0 0/64px 64px, radial-gradient(circle at 70% 70%,rgba(255,255,255,.18) 0 4px,transparent 5px) 0 0/48px 48px, linear-gradient(#6FD6C8,#3FB5B0)}
.band.roof{background:radial-gradient(circle at 30% 40%,rgba(255,255,255,.22) 0 5px,transparent 6px) 0 0/56px 56px, linear-gradient(#8B6BE0,#FF7FA0 45%,#FFC46B)}
.band.night{background:radial-gradient(circle at 25% 25%,rgba(255,255,255,.7) 0 1px,transparent 2px) 0 0/37px 41px, radial-gradient(circle at 70% 60%,rgba(255,255,255,.5) 0 1px,transparent 2px) 0 0/53px 29px, linear-gradient(#0D1238,#2B2170 60%,#4A2A8A)}
.worldSign{position:absolute;left:50%;transform:translateX(-50%) rotate(-2deg);background:var(--cream);color:var(--ink);font-family:var(--display);font-size:18px;padding:8px 18px;border-radius:14px;box-shadow:0 4px 0 #D4C39C,0 10px 20px rgba(0,0,0,.25);white-space:nowrap;text-align:center;line-height:1.1}
.worldSign small{display:block;font-family:var(--body);font-weight:900;font-size:10px;letter-spacing:1.4px;text-transform:uppercase;color:var(--ink-2)}
#mapPath{position:absolute;left:0;top:0;width:100%;pointer-events:none}
.node{position:absolute;transform:translate(-50%,-50%);width:62px;height:62px;border-radius:50%;border:0;display:grid;place-items:center;font-family:var(--display);font-size:24px;color:#fff;
  background:radial-gradient(circle at 35% 30%,#FF9AC4,#FF4F8E 60%,#D92E6E);box-shadow:0 5px 0 #A21E53,0 10px 18px rgba(0,0,0,.3);text-shadow:0 2px 0 rgba(0,0,0,.25)}
.node.done{background:radial-gradient(circle at 35% 30%,#8DF0B8,#3FCB7E 60%,#26A360);box-shadow:0 5px 0 #1A7A47,0 10px 18px rgba(0,0,0,.3)}
.node.locked{background:radial-gradient(circle at 35% 30%,#C8C3DA,#9A93B5 60%,#7C7599);box-shadow:0 5px 0 #5B5578,0 8px 14px rgba(0,0,0,.25);color:#E9E6F2;cursor:default}
.node.current{width:74px;height:74px;font-size:28px;animation:bob 1.4s ease-in-out infinite}
.node.current::after{content:"";position:absolute;inset:-9px;border-radius:50%;border:4px solid rgba(255,255,255,.85);animation:ring 1.4s ease-out infinite}
.node .nstars{position:absolute;bottom:-16px;left:50%;transform:translateX(-50%);display:flex;gap:1px}
.node .nstars svg{width:17px;height:17px;filter:drop-shadow(0 1px 0 rgba(0,0,0,.35))}
.node .lock{width:22px;height:22px}
.youAreHere{position:absolute;transform:translate(-50%,-100%);pointer-events:none;animation:bob 1.4s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translate(-50%,-50%)}50%{transform:translate(-50%,-58%)}}
@keyframes ring{0%{transform:scale(.9);opacity:1}100%{transform:scale(1.25);opacity:0}}

/* ---------- Modal ---------- */
.modalWrap{position:absolute;inset:0;z-index:20;background:rgba(18,10,44,.7);display:flex;align-items:center;justify-content:center;padding:16px;backdrop-filter:blur(3px)}
.modal{background:var(--cream);color:var(--ink);border-radius:26px;width:100%;max-width:360px;padding:22px 20px 20px;display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;position:relative;box-shadow:0 8px 0 #D4C39C,0 24px 50px rgba(0,0,0,.45);animation:popIn .35s cubic-bezier(.2,1.6,.4,1)}
@keyframes popIn{from{transform:scale(.7);opacity:0}to{transform:scale(1);opacity:1}}
.ribbon{margin-top:-44px;background:linear-gradient(#FF8FBA,#FF4F8E);color:#fff;font-family:var(--display);font-size:26px;padding:10px 34px;border-radius:16px;box-shadow:0 5px 0 #A21E53;text-shadow:0 2px 0 rgba(0,0,0,.2)}
.ribbon.win{background:linear-gradient(#8DF0B8,#3FCB7E);box-shadow:0 5px 0 #1A7A47}
.ribbon.lose{background:linear-gradient(#B7B0D0,#7C7599);box-shadow:0 5px 0 #5B5578}
.modal .world{font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:var(--ink-2);font-weight:900}
.goalBox{width:100%;background:#fff;border-radius:16px;padding:12px;display:flex;align-items:center;gap:12px;text-align:left;box-shadow:inset 0 -3px 0 var(--cream-2)}
.goalBox canvas{width:56px;height:44px;flex:none}
.goalBox b{font-family:var(--display);font-weight:400;font-size:22px;display:block;line-height:1.05}
.goalBox span{font-size:13px;color:var(--ink-2)}
.tip{font-size:14px;line-height:1.4;color:var(--ink);background:#FFF1B8;border-radius:12px;padding:9px 12px;width:100%;box-sizing:border-box}
.tip b{color:#B8531F}
.starsRow{display:flex;gap:6px;justify-content:center;align-items:flex-end}
.starsRow svg{width:40px;height:40px}
.starsRow .mid svg,.starsRow svg.mid{width:54px;height:54px;margin-bottom:8px}
.starsRow.big svg{width:56px;height:56px}
.starsRow.big svg.mid{width:72px;height:72px}
.starsRow svg.pop{animation:starPop .5s cubic-bezier(.2,1.8,.4,1) both}
@keyframes starPop{from{transform:scale(0) rotate(-40deg)}to{transform:scale(1) rotate(0)}}
.thresholds{font-size:12px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.boosters{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:100%}
.booster{background:#fff;border:3px solid transparent;border-radius:16px;padding:8px 4px 6px;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--ink);box-shadow:0 3px 0 var(--cream-2)}
.booster[aria-pressed="true"]{border-color:var(--good);background:#EAFBF1}
.booster:disabled{opacity:.45;cursor:not-allowed}
.booster .bi{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-size:18px;color:#fff}
.booster b{font-family:var(--display);font-weight:400;font-size:14px;line-height:1}
.booster span{font-size:12px;color:#B8531F;display:flex;align-items:center;gap:2px;font-variant-numeric:tabular-nums}
.booster span svg{width:14px;height:14px}
.boostLabel{font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:var(--ink-2);font-weight:900;align-self:flex-start}
.closeX{position:absolute;top:10px;right:10px;width:34px;height:34px;border-radius:50%;border:0;background:var(--cream-2);color:var(--ink);font-family:var(--display);font-size:16px}
.modalBtns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;width:100%}
.bigScore{font-family:var(--display);font-size:48px;line-height:1;font-variant-numeric:tabular-nums}
.breakdown{display:grid;grid-template-columns:1fr auto;gap:4px 16px;font-size:14px;width:100%;max-width:240px;font-variant-numeric:tabular-nums;text-align:left}
.breakdown .tot{border-top:2px dashed var(--cream-2);padding-top:4px;font-family:var(--display);font-weight:400;font-size:17px}
.earned{display:flex;align-items:center;gap:6px;font-family:var(--display);font-size:22px;color:#B8531F}
.earned svg{width:26px;height:26px}

/* ---------- Play ---------- */
#play{padding-inline:12px;padding-block:8px;gap:8px;box-sizing:border-box}
.hud{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:10px}
.hudMid{display:flex;flex-direction:column;align-items:center;line-height:1}
.hudMid .lv{font-family:var(--display);font-size:20px;color:var(--butter)}
.hudMid .goal{font-size:13px;color:var(--muted);margin-top:3px;font-variant-numeric:tabular-nums}
.hudMid .goal b{color:#fff}
.hearts{display:flex;gap:2px;flex-wrap:wrap;justify-content:flex-end;max-width:110px}
.hearts svg{width:20px;height:20px}
.meter{display:grid;grid-template-columns:1fr auto;align-items:center;gap:10px}
.bar{position:relative;height:14px;border-radius:999px;background:rgba(255,255,255,.12);box-shadow:inset 0 2px 3px rgba(0,0,0,.3)}
.bar i{position:absolute;left:0;top:0;bottom:0;border-radius:999px;background:linear-gradient(90deg,#FF8FBA,var(--butter));width:0;transition:width .25s}
.bar .mk{position:absolute;top:50%;width:22px;height:22px;transform:translate(-50%,-50%)}
.bar .mk svg{width:100%;height:100%;display:block;filter:drop-shadow(0 1px 1px rgba(0,0,0,.4))}
.bar .mk:last-child{transform:translate(-80%,-50%)}
.pts{font-family:var(--display);font-size:22px;font-variant-numeric:tabular-nums;min-width:56px;text-align:right}
.timer{font-family:var(--display);font-size:16px;color:#fff;background:var(--bad);border-radius:999px;padding:2px 10px;font-variant-numeric:tabular-nums;margin-top:4px}
.ticket{background:var(--cream);color:var(--ink);border-radius:16px 16px 6px 6px;padding:9px 11px 11px;display:grid;grid-template-columns:52px 1fr;gap:4px 10px;position:relative;box-shadow:0 4px 0 rgba(0,0,0,.25)}
.ticket.vip{background:linear-gradient(135deg,#FFF3C4,#FFE08A)}
.ticket #avatar{grid-row:span 3;width:52px;height:52px;border-radius:14px;background:#F3E6C8}
.ticket.vip #avatar{background:#FFD25E}
.tTop{display:flex;justify-content:space-between;align-items:baseline;gap:8px;min-width:0}
.who{font-family:var(--display);font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vipTag{display:none;font-family:var(--display);font-size:12px;background:var(--ink);color:var(--butter);border-radius:6px;padding:2px 7px;margin-left:6px;vertical-align:2px}
.ticket.vip .vipTag{display:inline-block}
.orderNo{font-size:12px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.patience{height:8px;border-radius:4px;background:#E8DFC6;overflow:hidden;align-self:center}
.patience i{display:block;height:100%;width:100%;background:var(--good);border-radius:4px}
.recipe{display:flex;flex-wrap:wrap;gap:4px;align-items:center;min-width:0}
.recipe .step{width:40px;height:28px;border-radius:7px;background:#fff;display:grid;place-items:center;box-shadow:0 2px 0 var(--cream-2)}
.recipe .step canvas{width:36px;height:24px}
.recipe .step.done{background:#D9F5E4;box-shadow:none}
.recipe .step.done canvas{opacity:.35}
.recipe .step.next{outline:3px solid var(--pink);outline-offset:0;animation:nextPulse 1s ease-in-out infinite}
@keyframes nextPulse{50%{transform:scale(1.08)}}
.field{flex:1;min-height:0;position:relative;border-radius:18px;overflow:hidden;box-shadow:inset 0 0 0 3px rgba(255,255,255,.08)}
canvas#game{width:100%;height:100%;display:block;touch-action:none}
.badges{position:absolute;top:8px;left:8px;right:8px;display:flex;flex-wrap:wrap;gap:6px;pointer-events:none}
.badge{font-family:var(--display);font-size:13px;padding:3px 10px;border-radius:999px;background:rgba(20,12,50,.72);color:#fff;font-variant-numeric:tabular-nums}
.badge.magnet{color:#FF8F87}.badge.freeze{color:var(--ice)}.badge.streak{color:var(--butter)}
.banner{position:absolute;left:0;right:0;top:38%;text-align:center;font-family:var(--display);font-size:40px;color:#fff;text-shadow:0 4px 0 #A21E53,0 8px 20px rgba(0,0,0,.4);pointer-events:none;animation:bannerIn 1.6s ease both}
@keyframes bannerIn{0%{transform:scale(.3);opacity:0}15%{transform:scale(1.1);opacity:1}25%{transform:scale(1)}80%{opacity:1}100%{opacity:0;transform:translateY(-20px)}}
.iconBtn svg{width:22px;height:22px}
.iconBtn.dark{background:rgba(20,12,50,.65);backdrop-filter:blur(4px)}
.btn svg{width:22px;height:22px;vertical-align:-4px;margin-right:6px}

/* ---------- Home ---------- */
#home{background:linear-gradient(#6FD6C8,#3FB5B0 55%,#2C8E9A);align-items:center}
#homeBg{position:absolute;inset:0;width:100%;height:100%}
.homeTop{position:relative;z-index:1;display:flex;justify-content:flex-end;gap:8px;width:100%;box-sizing:border-box;padding-inline:16px;padding-block:12px}
.homeCenter{position:relative;z-index:1;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding-inline:16px;padding-block:0 30px;width:100%;box-sizing:border-box}
.logo.big{font-size:clamp(48px,15vw,64px);transform:rotate(-4deg);text-shadow:0 5px 0 #B8531F,0 10px 0 rgba(0,0,0,.15),0 14px 30px rgba(0,0,0,.3)}
.tagline{font-size:15px;color:#fff;background:rgba(20,12,50,.35);border-radius:999px;padding:4px 14px;letter-spacing:.3px}
#homeBurger{width:min(230px,52vw);max-height:30vh;object-fit:contain;height:auto;animation:float 3s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-10px) rotate(1.5deg)}}
.btn.big{font-size:32px;padding:14px 56px;border-radius:24px;display:flex;flex-direction:column;align-items:center;line-height:1}
.btn.big small{font-family:var(--body);font-weight:900;font-size:13px;opacity:.9;margin-top:4px;letter-spacing:.5px}
.homeRow{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:min(320px,100%)}
.homeRow .btn.ghost{padding:10px 8px;font-size:17px;white-space:nowrap}

/* ---------- Shop ---------- */
#shop{background:linear-gradient(#3A2A86,var(--bg))}
.shopTop{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:10px;padding-inline:16px;padding-block:12px}
.shopTop h2{margin:0;font-family:var(--display);font-weight:400;font-size:30px;color:var(--butter);text-align:center;text-shadow:0 3px 0 #B8531F}
.shopTop .iconBtn{font-size:28px}
.shopBody{flex:1;overflow-y:auto;padding-inline:16px;padding-block:4px 30px;display:flex;flex-direction:column;gap:12px}
.shopH{font-family:var(--display);font-size:18px;color:#fff;margin:8px 0 0;display:flex;align-items:center;gap:8px}
.shopH small{font-family:var(--body);font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--ink);background:var(--butter);border-radius:6px;padding:2px 6px}
.card{background:var(--cream);color:var(--ink);border-radius:20px;padding:12px;display:grid;grid-template-columns:52px 1fr;gap:4px 12px;align-items:center;box-shadow:0 5px 0 #D4C39C}
.card .bi{grid-row:span 2;width:52px;height:52px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-size:22px;color:#fff;position:relative}
.card .bi canvas{width:52px;height:52px}
.card h3{margin:0;font-family:var(--display);font-weight:400;font-size:19px;line-height:1.05;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.card h3 .own{font-family:var(--body);font-size:12px;color:var(--ink-2)}
.card p{margin:0;font-size:13px;color:var(--ink-2);line-height:1.3}
.card .buy{grid-column:1/-1;display:flex;gap:8px;margin-top:6px}
.buyBtn{flex:1;border:0;border-radius:14px;padding:9px 6px;font-family:var(--display);font-size:16px;color:var(--ink);background:linear-gradient(#FFE48E,#F7BC34);box-shadow:0 3px 0 var(--butter-d);display:flex;align-items:center;justify-content:center;gap:4px;font-variant-numeric:tabular-nums}
.buyBtn svg{width:18px;height:18px}
.buyBtn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--butter-d)}
.buyBtn:disabled{opacity:.45;cursor:not-allowed}
.buyBtn .q{font-family:var(--body);font-weight:900;font-size:12px;color:#8A5A00;margin-right:4px}
.card.locked{opacity:.7}
.lockNote{grid-column:1/-1;font-size:13px;color:var(--ink-2);background:var(--cream-2);border-radius:10px;padding:6px 10px;text-align:center;margin-top:6px}
.gift{grid-template-columns:52px 1fr auto}
.gift .bi{grid-row:auto}
.gift .buyBtn{flex:none;padding:10px 16px;background:linear-gradient(#7BE8A8,#2BAE66);color:#fff;box-shadow:0 3px 0 #1F8A50}
.coinGrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.coinPack{position:relative;background:var(--cream);color:var(--ink);border:0;border-radius:20px;padding:14px 8px 10px;display:flex;flex-direction:column;align-items:center;gap:6px;box-shadow:0 5px 0 #D4C39C}
.coinPack .pile{height:44px;display:flex;align-items:flex-end;justify-content:center}
.coinPack .pile svg{width:30px;height:30px;margin:0 -8px}
.coinPack b{font-family:var(--display);font-weight:400;font-size:22px;font-variant-numeric:tabular-nums}
.coinPack .price{width:100%;border-radius:12px;padding:7px;font-family:var(--display);font-size:17px;color:#fff;background:linear-gradient(#7BE8A8,#2BAE66);box-shadow:0 3px 0 #1F8A50;box-sizing:border-box}
.coinPack .flag{position:absolute;top:-8px;right:-4px;background:var(--pink);color:#fff;font-family:var(--display);font-size:12px;padding:3px 8px;border-radius:8px;transform:rotate(6deg)}
.testNote{font-size:12px;line-height:1.4;color:var(--muted);text-align:center;margin:0}

/* booster (level intro) states */
.booster{position:relative}
.booster .cnt{position:absolute;top:-6px;right:-4px;min-width:22px;height:22px;border-radius:11px;background:var(--pink);color:#fff;font-family:var(--display);font-size:13px;display:grid;place-items:center;padding:0 5px;box-sizing:border-box}
.booster.get span{color:var(--good)}
.booster.lockedB .bi{filter:grayscale(1);opacity:.5}
.newPill{display:inline-block;background:var(--pink);color:#fff;font-family:var(--display);font-size:13px;padding:2px 8px;border-radius:6px;margin-right:6px;vertical-align:1px}
.tip.new{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:center;text-align:left;background:#FFE3EF}
.tip.new canvas{width:48px;height:48px}

/* home: daily + stickers */
.homeRow .btn.ghost{position:relative}

.plateGrid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}

@media (prefers-reduced-motion:reduce){ #homeBurger,.toast{animation:none} .toggle i,.toggle i::after{transition:none} }

<script>
(() => {
const $ = id => document.getElementById(id);
const cv = $('game'), ctx = cv.getContext('2d');
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
const pick = a => a[Math.floor(Math.random()*a.length)];
const rnd = (a,b) => a + Math.random()*(b-a);
const star = on => `<svg viewBox="0 0 24 24"><use href="#${on?'i-star':'i-star-off'}"/></svg>`;
const coin = `<svg viewBox="0 0 24 24"><use href="#i-coin"/></svg>`;

// ================= SAVE =================
const SAVE_KEY = 'crumbstack-save-v2';
let save = {unlocked:1, stars:{}, best:{}, coins:120, inv:{}, gifted:{}, giftDay:''};
try { const s = JSON.parse(localStorage.getItem(SAVE_KEY)); if (s && s.unlocked) save = Object.assign(save, s); } catch(e){}
save.inv = Object.assign({magnet:0, plate:0, heart:0}, save.inv||{});
save.gifted = save.gifted || {};
// Added later (old saves get these defaults): sticker book, plate looks, daily challenge.
save.stickers = save.stickers || {};
save.plates = Object.assign({classic:true}, save.plates||{});
save.plate = save.plate || 'classic';
save.daily = Object.assign({day:'', streak:0}, save.daily||{});
save.fails = save.fails || {};   // tries lost in a row on a level (special levels ease off after a couple)
function persist(){ try { localStorage.setItem(SAVE_KEY, JSON.stringify(save)); } catch(e){} }

// ================= SOUND =================
// Everything is synthesized with Web Audio: no audio files, nothing to license.
save.sound = Object.assign({music:true, sfx:true}, save.sound||{});
const Sound = (() => {
  let ac=null, sfxBus, musicBus, timer=null, nextT=0, step=0;
  const BPM = 112, STEP = 60/BPM/2;
  const mf = m => 440*Math.pow(2,(m-69)/12);
  function ensure(){
    if(!ac){
      const AC = window.AudioContext || window.webkitAudioContext; if(!AC) return false;
      ac = new AC();
      const comp = ac.createDynamicsCompressor(); comp.connect(ac.destination);
      sfxBus = ac.createGain(); sfxBus.gain.value = .9; sfxBus.connect(comp);
      musicBus = ac.createGain(); musicBus.gain.value = .0; musicBus.connect(comp);
    }
    if(ac.state === 'suspended') ac.resume();
    return true;
  }
  function tone(freq, dur, o={}){
    const t = ac.currentTime + (o.delay||0);
    const osc = ac.createOscillator(), g = ac.createGain();
    osc.type = o.type||'triangle'; osc.frequency.setValueAtTime(freq, t);
    if(o.slide) osc.frequency.exponentialRampToValueAtTime(Math.max(30, freq*o.slide), t+dur);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(o.vol||.2, t+(o.attack||.006));
    g.gain.exponentialRampToValueAtTime(.0001, t+dur);
    osc.connect(g); g.connect(o.bus||sfxBus); osc.start(t); osc.stop(t+dur+.05);
  }
  let noiseBuf=null;
  function noise(dur, o={}){
    if(!noiseBuf){ noiseBuf = ac.createBuffer(1, ac.sampleRate*.5, ac.sampleRate); const d=noiseBuf.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1; }
    const t = (o.at!=null ? o.at : ac.currentTime) + (o.delay||0);
    const src = ac.createBufferSource(); src.buffer = noiseBuf;
    const f = ac.createBiquadFilter(); f.type = o.ft||'highpass'; f.frequency.value = o.freq||6000;
    const g = ac.createGain(); g.gain.setValueAtTime(o.vol||.1, t); g.gain.exponentialRampToValueAtTime(.0001, t+dur);
    src.connect(f); f.connect(g); g.connect(o.bus||sfxBus); src.start(t); src.stop(t+dur+.02);
  }
  const FX = {
    tap(){ tone(660,.07,{vol:.12}); },
    catch(i){ const f = mf(72 + [0,2,4,7,9,12,14,16][Math.min(i||0,7)]); tone(f,.14,{vol:.22,slide:1.3}); tone(f*2,.08,{vol:.06,type:'sine',delay:.02}); },
    wrong(){ tone(196,.28,{type:'square',vol:.1,slide:.6}); tone(147,.32,{type:'sawtooth',vol:.07,delay:.06,slide:.7}); },
    serve(){ [72,76,79,84].forEach((m,i)=>tone(mf(m),.22,{vol:.18,delay:i*.07})); noise(.25,{vol:.05,delay:.28}); },
    token(){ tone(700,.16,{type:'sine',vol:.2,slide:2}); tone(1400,.22,{type:'sine',vol:.12,delay:.09}); },
    heart(){ [76,81,88].forEach((m,i)=>tone(mf(m),.2,{type:'sine',vol:.16,delay:i*.06})); },
    fly(){ const t=ac.currentTime; const o=ac.createOscillator(), l=ac.createOscillator(), lg=ac.createGain(), g=ac.createGain();
      o.type='sawtooth'; o.frequency.value=180; l.frequency.value=30; lg.gain.value=40; l.connect(lg); lg.connect(o.frequency);
      g.gain.setValueAtTime(.08,t); g.gain.exponentialRampToValueAtTime(.0001,t+.4); o.connect(g); g.connect(sfxBus); o.start(t); l.start(t); o.stop(t+.45); l.stop(t+.45); },
    topple(){ tone(420,.45,{vol:.14,slide:.3}); noise(.3,{vol:.06,freq:1500,ft:'lowpass'}); },
    warn(){ tone(1046,.05,{type:'square',vol:.05}); tone(1046,.05,{type:'square',vol:.05,delay:.1}); },
    coin(){ tone(988,.08,{type:'square',vol:.07}); tone(1319,.3,{type:'square',vol:.07,delay:.08}); },
    star(i){ const m=[79,83,86][i]||86; tone(mf(m),.45,{type:'sine',vol:.2}); tone(mf(m+12),.3,{type:'triangle',vol:.06,delay:.05}); noise(.3,{vol:.04,freq:8000}); },
    win(){ [[72,0],[76,.12],[79,.24],[84,.36],[79,.52],[84,.64]].forEach(([m,d])=>tone(mf(m),.3,{vol:.17,delay:d})); },
    lose(){ [[67,0],[63,.2],[60,.4]].forEach(([m,d])=>tone(mf(m),.35,{vol:.14,delay:d,type:'sine'})); tone(mf(48),.6,{vol:.1,delay:.6,type:'sine'}); },
    whoosh(){ noise(.35,{vol:.07,freq:900,ft:'bandpass'}); },
    gust(){ noise(.9,{vol:.09,freq:500,ft:'bandpass'}); noise(.6,{vol:.05,freq:1400,ft:'bandpass',delay:.2}); },
    lucky(){ [79,84,88,91].forEach((m,i)=>tone(mf(m),.16,{type:'sine',vol:.16,delay:i*.05})); },
    bell(){ tone(mf(88),.5,{type:'sine',vol:.18}); tone(mf(95),.5,{type:'sine',vol:.1,delay:.12}); },
  };
  // Phone vibration: only inside the iPhone app (Capacitor Haptics plugin); ignored on the web.
  const HAP = {catch:'light', token:'light', heart:'light', wrong:'heavy', topple:'heavy', serve:'success', win:'success'};
  function buzz(kind){ try{ const hp = window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.Haptics; if(!hp) return;
    if(kind==='light') hp.impact({style:'LIGHT'}); else if(kind==='heavy') hp.notification({type:'ERROR'}); else hp.notification({type:'SUCCESS'}); }catch(e){} }
  function play(name, arg){ if(!save.sound.sfx) return; if(HAP[name]) buzz(HAP[name]); if(!ensure()) return; try{ FX[name] && FX[name](arg); }catch(e){} }

  // --- music: bouncy loop, C–Am–F–G with a two-phrase melody ---
  const CH = [[48,55,60,64],[45,52,57,60],[41,48,53,57],[43,50,55,59]];
  const _ = null;
  const MEL = [
    76,_,79,_,81,79,76,_,  72,_,74,76,_,_,72,_,  69,_,72,_,74,72,69,_,  67,_,69,71,74,_,_,_,
    76,_,79,_,84,_,81,79,  76,_,74,_,72,_,_,_,   77,_,76,74,72,_,69,_,  71,_,72,74,72,_,_,_,
  ];
  function musicStep(s, t){
    const bar = Math.floor(s/8)%4, ch = CH[bar], b = musicBus;
    if(s%8===0) tone(mf(ch[0]-12), STEP*3.5, {type:'sine', vol:.28, bus:b, attackAt:t, delay:t-ac.currentTime});
    if(s%8===4) tone(mf(ch[1]-12), STEP*3, {type:'sine', vol:.2, bus:b, delay:t-ac.currentTime});
    if(s%2===1) [ch[2],ch[3]].forEach(m=>tone(mf(m), STEP*.9, {type:'triangle', vol:.035, bus:b, delay:t-ac.currentTime}));
    if(s%2===1) noise(.04, {vol:.025, freq:9000, bus:b, at:t});
    if(s%8===4) noise(.08, {vol:.05, freq:2500, ft:'bandpass', bus:b, at:t});
    const m = MEL[s%64]; if(m) tone(mf(m), STEP*1.6, {type:'square', vol:.045, bus:b, delay:t-ac.currentTime});
  }
  function tick(){ while(nextT < ac.currentTime + .25){ musicStep(step, nextT); nextT += STEP; step = (step+1)%64; } }
  function startMusic(){
    if(!save.sound.music || !ensure() || timer) return;
    nextT = ac.currentTime + .1; step = 0;
    musicBus.gain.cancelScheduledValues(ac.currentTime); musicBus.gain.setValueAtTime(0.0001, ac.currentTime); musicBus.gain.exponentialRampToValueAtTime(.55, ac.currentTime+1.2);
    timer = setInterval(tick, 60); tick();
  }
  function stopMusic(){ if(!timer) return; clearInterval(timer); timer=null; if(ac) { musicBus.gain.cancelScheduledValues(ac.currentTime); musicBus.gain.setValueAtTime(0.0001, ac.currentTime); } }
  function unlock(){ if(ensure()) startMusic(); }
  function setMusic(on){ save.sound.music=on; persist(); on ? startMusic() : stopMusic(); }
  function setSfx(on){ save.sound.sfx=on; persist(); }
  function suspend(){ if(ac && ac.state==='running') ac.suspend(); }
  function resume(){ if(ac && ac.state==='suspended') ac.resume(); }
  return {play, unlock, setMusic, setSfx, suspend, resume};
})();
addEventListener('pointerdown', Sound.unlock, {once:true});
addEventListener('keydown', Sound.unlock, {once:true});
document.addEventListener('visibilitychange', ()=>{ document.hidden ? Sound.suspend() : Sound.resume(); });
document.addEventListener('click', e=>{ if(e.target.closest('.btn,.node,.buyBtn,.booster,.iconBtn,.coinPack,.closeX')) Sound.play('tap'); }, true);

// ================= WORLDS & LEVELS =================
const WORLDS = [
  {key:'diner', name:'Main Street Diner', from:1,  to:8,  counter:['#FF6B6B','#D94848'], trim:'#E8EEF5'},
  {key:'roof',  name:'Rooftop Grill',     from:9,  to:16, counter:['#C98A55','#9A6236'], trim:'#6B4226'},
  {key:'night', name:'Midnight Food Truck', from:17, to:24, counter:['#9FB4C8','#6E8298'], trim:'#DCE6F0'},
];
const TOTAL = 24; // hand-made levels; after these the worlds repeat forever (bonus laps)
const WSIZE = 8;
const worldCache = {};
// World for any level. Levels past TOTAL keep cycling the three kitchens as World 4, 5, 6...
function worldOf(n){
  if(n <= TOTAL) return WORLDS.find(w => n >= w.from && n <= w.to);
  const idx = Math.floor((n-1)/WSIZE);
  return worldCache[idx] || (worldCache[idx] = {...WORLDS[idx % WORLDS.length], from:idx*WSIZE+1, to:(idx+1)*WSIZE, lap:Math.floor(idx/WORLDS.length)+1});
}

// What customers can order. A dish is a bottom piece, some fillings, then a top piece.
const DISHES = {
  burger:  {name:'burger',        bottom:'bunBottom', top:'bunTop',     mids:['patty','cheese','lettuce','tomato','onion','pickle','bacon','egg','mushroom']},
  sandwich:{name:'sandwich',      bottom:'bread',     top:'bread',      mids:['cheese','lettuce','tomato','pickle','bacon','egg','mushroom']},
  pancakes:{name:'pancake stack', bottom:'pancake',   top:'pancakeTop', mids:['berries','cream']},
};
// The dishes and fillings a level can ask for (new food arrives as you climb).
function menuOf(n){
  const has = t => n >= (UNLOCK[t]||0);
  const m = {burger: DISHES.burger.mids.filter(has)};
  if(n >= UNLOCK.sandwich) m.sandwich = DISHES.sandwich.mids.filter(has);
  if(n >= UNLOCK.pancakes) m.pancakes = DISHES.pancakes.mids.slice();
  return m;
}
// `force` plays level n's difficulty as a different kind of level (used by the daily challenge).
function levelDef(n, force){
  const w = worldOf(n), mode = force || modeOf(n);
  // Past the hand-made levels, speed creeps up a little every world, then levels off so it stays beatable.
  const dn = n <= TOTAL ? n : TOTAL + Math.min(3, Math.floor((n-TOTAL-1)/WSIZE));
  const minMid = Math.min(4, 1 + Math.floor((n-1)/7));
  const maxMid = Math.min(5, 2 + Math.floor((n-1)/4));
  let goal = Math.min(force ? 5 : 8, 3 + Math.floor((n-1)/3)), timed = 0, hearts = 3;   // the daily keeps it short
  const avgLen = 2 + (minMid+maxMid)/2;
  const perOrder = avgLen*15 + 15;
  let base = goal*perOrder, cut = [.6, 1, 1.35];
  if(mode==='rush') timed = Math.round(goal * (13 + (minMid+maxMid)*2.2));
  // A helping hand so a special level can never become a wall: every 2 losses in a row adds a heart (one-heart levels) or 8 seconds (towers).
  const help = force ? 0 : Math.min(2, Math.floor((save.fails[n]||0) / 2));
  if(mode==='perfect'){ goal = Math.max(3, goal-2); hearts = 1 + help; base = goal*perOrder; cut = [.6, .9, 1.15]; }
  if(mode==='boss'){ goal = 2; base = (maxMid*2 + 10)*35 + 60; cut = [.7, 1.05, 1.35]; }
  if(mode==='frenzy'){ goal = 3; timed = 45; base = perOrder*6; cut = [.5, .8, 1.1]; }
  if(mode==='tall'){ goal = 1; timed = 40 + help*8; base = 400; cut = [.6, .85, 1]; }
  const r10 = v => Math.round(v/10)*10;
  const menu = menuOf(n);
  const pool = [...new Set(Object.keys(menu).flatMap(d => [DISHES[d].bottom, DISHES[d].top, ...menu[d], ...(d==='pancakes'?['pancake']:[])]))];
  const soft = mode==='frenzy', calm = soft || mode==='perfect';   // one-heart levels drop the flies and slow the food a touch to stay fair
  return {
    n, world:w, mode, goal, timed, hearts, minMid, maxMid, menu, pool,
    help: (mode==='perfect' || mode==='tall') ? help : 0,
    speed: (135 + dn*6 + (n>=UNLOCK.fast?25:0)) * (mode==='perfect' ? .9 : 1),
    patience: Math.max(14, 27 - Math.min(n, TOTAL)*.45),
    power: n >= UNLOCK.power, freeze: n >= UNLOCK.freeze,
    wobble: n >= UNLOCK.wobble ? (n < 12 ? .75 : 1) : 0,
    flies: n >= UNLOCK.flies && !calm ? Math.min(.15, .05 + (n-UNLOCK.flies)*.007) : 0,
    vip: n >= UNLOCK.vip && !soft && mode!=='boss' ? Math.min(.3, .15 + (n-UNLOCK.vip)*.012) : 0,
    stars: cut.map(k => r10(base*k)),
    tip: force ? null : (TIPS[n] || null),
  };
}

// ----- Daily challenge: one special level a day, the same for everyone, with a twist -----
const TWISTS = {
  tiny:  {name:'Tiny plate',     desc:'Your plate is smaller today.'},
  vip:   {name:'VIP night',      desc:'Every customer is a VIP: double pay, short patience.'},
  swarm: {name:'Fly swarm',      desc:'Flies everywhere. Don\'t catch them.'},
  windy: {name:'Windy day',      desc:'The wind never stops pushing the food around.'},
  feast: {name:'Big appetites',  desc:'Every order is one layer taller.'},
};
const TWIST_FOR = {classic:['tiny','vip','swarm','windy','feast'], rush:['tiny','vip','swarm','windy','feast'],
  tall:['tiny','swarm','windy'], frenzy:['tiny','windy','feast'], boss:['tiny','swarm','windy']};
const DAILY_FROM = 6, DAILY_COINS = 40;
const today = () => new Date().toISOString().slice(0,10);
const yesterday = () => new Date(Date.now()-864e5).toISOString().slice(0,10);
function dailyDef(day){
  day = day || today();
  let h = 2166136261; for(const ch of day){ h ^= ch.charCodeAt(0); h = Math.imul(h, 16777619); }
  const r = k => { h ^= h<<13; h ^= h>>>17; h ^= h<<5; return (h>>>0) % k; };
  const mode = ['classic','rush','tall','frenzy','boss'][r(5)];
  const twist = TWIST_FOR[mode][r(TWIST_FOR[mode].length)];
  const n = clamp(save.unlocked, DAILY_FROM, 18);   // a daily should be winnable in a try or two, so it never gets as hard as the late levels
  const L = levelDef(n, mode);
  L.daily = day; L.twist = twist; L.world = WORLDS[r(WORLDS.length)];
  if(twist==='vip') L.vip = 1;
  if(twist==='swarm') L.flies = .2;
  if(twist==='feast'){ L.minMid++; L.maxMid++; L.stars = L.stars.map(v => Math.round(v*1.15/10)*10); }
  return L;
}

function rr(c,x,y,w,h,r){c.beginPath();c.roundRect?c.roundRect(x,y,w,h,r):c.rect(x,y,w,h);}
function vg(c,y0,y1,a,b){const g=c.createLinearGradient(0,y0,0,y1);g.addColorStop(0,a);g.addColorStop(1,b);return g;}
function drawIng(c,type,cx,by,w){

function drawToken(c,kind,cx,cy,r,t){

  c.fillStyle=g; c.beginPath(); c.arc(0,0,r,0,7); c.fill();
  c.lineWidth=3; c.strokeStyle='#fff'; c.stroke();
  c.strokeStyle='#fff'; c.fillStyle='#fff'; c.lineCap='round';
  if(kind==='magnet'){
    c.lineWidth=r*.3; c.beginPath(); c.arc(0,0,r*.36,0,Math.PI); c.stroke();
    c.beginPath(); c.moveTo(-r*.36,0); c.lineTo(-r*.36,-r*.42); c.moveTo(r*.36,0); c.lineTo(r*.36,-r*.42); c.stroke();
  } else if(kind==='freeze'){
    c.lineWidth=r*.14;
    for(let i=0;i<3;i++){ c.rotate(Math.PI/3); c.beginPath(); c.moveTo(-r*.55,0); c.lineTo(r*.55,0); c.stroke();
      c.beginPath(); c.moveTo(r*.35,-r*.14); c.lineTo(r*.48,0); c.lineTo(r*.35,r*.14); c.stroke(); }

function drawFly(c,x,y,s,t){

let bgCache = null, bgKey = '';
function buildBg(world){
  const key = world.key+W+'x'+Hh+'@'+dpr;
  if(bgKey===key) return; bgKey=key;
  bgCache = document.createElement('canvas'); bgCache.width=W*dpr; bgCache.height=Hh*dpr;
  const c = bgCache.getContext('2d'); c.scale(dpr,dpr);
  const cy = plateY - 20; // counter top sits above the plate so the plate always rests on a plain surface
  if(world.key==='diner'){
    c.fillStyle=vg(c,0,cy,'#7FDCD0','#4DBDB6'); c.fillRect(0,0,W,cy);
    // window
    const wx=W*.12, ww=W*.76, wy=Hh*.1, wh=Hh*.3;
    c.fillStyle='#FFFFFF'; rr(c,wx-8,wy-8,ww+16,wh+16,18); c.fill();
    const sky=vg(c,wy,wy+wh,'#9FE3FF','#E8F9FF'); c.fillStyle=sky; rr(c,wx,wy,ww,wh,12); c.fill();
    c.fillStyle='#fff'; for(const [a,b,r] of [[.25,.35,18],[.33,.3,22],[.42,.36,16],[.7,.55,14],[.77,.5,18]]){ c.beginPath(); c.arc(wx+ww*a,wy+wh*b,r,0,7); c.fill(); }
    c.fillStyle='#8FD18A'; c.beginPath(); c.moveTo(wx,wy+wh); c.quadraticCurveTo(wx+ww*.3,wy+wh*.6,wx+ww*.55,wy+wh*.85); c.quadraticCurveTo(wx+ww*.8,wy+wh*.6,wx+ww,wy+wh*.75); c.lineTo(wx+ww,wy+wh); c.fill();
    c.fillStyle='#fff'; c.fillRect(wx+ww/2-4,wy,8,wh);
    // striped awning
    const aw=wy-8, n=8;
    for(let i=0;i<n;i++){ c.fillStyle=i%2?'#fff':'#FF6B6B'; c.beginPath(); const x0=wx-14+i*(ww+28)/n, x1=x0+(ww+28)/n; c.moveTo(x0,aw-26); c.lineTo(x1,aw-26); c.lineTo(x1,aw); c.quadraticCurveTo((x0+x1)/2,aw+14,x0,aw); c.fill(); }
    // checker wainscot
    const wy2=Math.round(Hh*.56), t=18;
    for(let j=0; wy2+j*t<cy; j++) for(let i=0; i*t<W; i++){ c.fillStyle=(i+j)%2?'#E9FBF7':'#B5E8DF'; c.fillRect(i*t,wy2+j*t,t,t); }
    c.fillStyle='#FF6B6B'; c.fillRect(0,wy2-8,W,8);
    const g=c.createRadialGradient(W/2,wy2,10,W/2,wy2,W*.8); g.addColorStop(0,'rgba(255,240,200,0)'); g.addColorStop(1,'rgba(20,30,60,.25)'); c.fillStyle=g; c.fillRect(0,wy2,W,cy-wy2);
  } else if(world.key==='roof'){
    const sky=c.createLinearGradient(0,0,0,cy); sky.addColorStop(0,'#6B55D0'); sky.addColorStop(.5,'#FF7FA0'); sky.addColorStop(1,'#FFC46B'); c.fillStyle=sky; c.fillRect(0,0,W,cy);
    const sg=c.createRadialGradient(W*.7,cy*.62,10,W*.7,cy*.62,W*.5); sg.addColorStop(0,'rgba(255,240,170,.9)'); sg.addColorStop(.2,'rgba(255,220,140,.5)'); sg.addColorStop(1,'rgba(255,200,120,0)'); c.fillStyle=sg; c.fillRect(0,0,W,cy);
    c.fillStyle='#FFF1B0'; c.beginPath(); c.arc(W*.7,cy*.62,W*.12,0,7); c.fill();
    let x=0; let seed=7; const rand=()=>{seed=(seed*9301+49297)%233280;return seed/233280;};
    while(x<W){ const bw=rand()*50+34, bh=rand()*cy*.35+cy*.15; c.fillStyle='#4A3590'; c.fillRect(x,cy-bh,bw,bh);
      c.fillStyle='rgba(255,220,120,.7)'; for(let yy=cy-bh+10;yy<cy-10;yy+=16) for(let xx=x+6;xx<x+bw-8;xx+=12) if(rand()>.55) c.fillRect(xx,yy,5,7); x+=bw+4; }
    c.fillStyle='#35266E'; c.fillRect(0,cy-26,W,26);
    // string lights
    c.strokeStyle='#2A1B4F'; c.lineWidth=1.5; c.beginPath(); c.moveTo(0,Hh*.08); c.quadraticCurveTo(W/2,Hh*.2,W,Hh*.08); c.stroke();
    for(let i=1;i<12;i++){ const tt=i/12, bx=tt*W, by=(1-tt)*(1-tt)*Hh*.08+2*(1-tt)*tt*Hh*.2+tt*tt*Hh*.08;
      const cols=['#FFD25E','#FF6FA8','#7FD3FF','#3FCB7E']; const g=c.createRadialGradient(bx,by+6,1,bx,by+6,16); g.addColorStop(0,cols[i%4]); g.addColorStop(1,'rgba(255,255,255,0)'); c.fillStyle=g; c.fillRect(bx-16,by-10,32,32);
      c.fillStyle=cols[i%4]; c.beginPath(); c.ellipse(bx,by+6,4,6,0,0,7); c.fill(); }
  } else {
    const sky=vg(c,0,cy,'#0B0F33','#3A2A86'); c.fillStyle=sky; c.fillRect(0,0,W,cy);
    let seed=3; const rand=()=>{seed=(seed*9301+49297)%233280;return seed/233280;};
    for(let i=0;i<70;i++){ c.fillStyle=`rgba(255,255,255,${rand()*.7+.2})`; c.beginPath(); c.arc(rand()*W,rand()*cy*.7,rand()*1.4+.3,0,7); c.fill(); }
    c.fillStyle='#FFF4C9'; c.beginPath(); c.arc(W*.8,Hh*.12,24,0,7); c.fill(); c.fillStyle='#0F1440'; c.beginPath(); c.arc(W*.8+10,Hh*.12-6,22,0,7); c.fill();
    // food truck side
    const ty=cy*.5; c.fillStyle='#E9EEF5'; rr(c,-10,ty,W+20,cy-ty+10,20); c.fill();
    c.fillStyle='#FF6FA8'; c.fillRect(-10,ty+18,W+20,12);
    c.fillStyle='#1B1F4A'; rr(c,W*.1,ty+44,W*.8,cy-ty-60,12); c.fill();

    c.save(); c.font=`${Math.round(W*.09)}px "Lilita One", sans-serif`; c.textAlign='center'; c.shadowColor='#FF6FA8'; c.shadowBlur=18; c.fillStyle='#FFB3D1';
    c.fillText('OPEN LATE', W/2, ty+44+(cy-ty-60)*.55); c.restore();
  }
  // counter
  const col = world.counter;
  c.fillStyle=vg(c,cy,Hh,col[0],col[1]); c.fillRect(0,cy,W,Hh-cy);
  c.fillStyle=world.trim; c.fillRect(0,cy,W,6);
  c.fillStyle='rgba(0,0,0,.12)'; c.fillRect(0,cy+6,W,4);
  if(world.key==='roof'){ c.strokeStyle='rgba(60,30,10,.25)'; c.lineWidth=2; for(let y=cy+18;y<Hh;y+=12){ c.beginPath(); c.moveTo(0,y); c.lineTo(W,y); c.stroke(); } }
}

function newOrder(){
  const L = S.L, first = S.orderNo===0;
  S.idx = 0; S.patience = 1; S.lean = 0; S.moodDrawn = -1; S.swapI = -1;
  if(L.mode==='tall'){   // no orders: anything stacks
    S.order = []; S.orderNo = 1; S.patMax = 1;
    S.cust = S.cust || Object.assign(newCustomer(false), {name:'Tower time!'});
    renderTicket(); return;
  }
  let dish = 'burger';
  if(L.mode!=='boss'){
    const r = Math.random();
    if(first && !L.daily && L.n===UNLOCK.sandwich) dish = 'sandwich';
    else if(first && !L.daily && L.n===UNLOCK.pancakes) dish = 'pancakes';
    else if(L.menu.pancakes && r < .25) dish = 'pancakes';
    else if(L.menu.sandwich && r >= .25 && r < .55) dish = 'sandwich';
  }
  const midLen = L.mode==='boss' ? L.maxMid + (first ? 2 : 4) : Math.floor(rnd(L.minMid, L.maxMid+1));
  const mid = [], from = L.menu[dish];
  for(let i=0;i<midLen;i++){
    if(dish==='pancakes'){ mid.push(i%2 ? 'pancake' : pick(from)); continue; }
    let t; do { t = pick(from); } while(mid[mid.length-1]===t); mid.push(t);
  }
  S.dish = dish; S.swapPool = from;
  S.order = [DISHES[dish].bottom, ...mid, DISHES[dish].top];
  S.orderNo++;
  const vip = Math.random() < L.vip;
  S.cust = newCustomer(vip);
  if(L.mode==='boss') Object.assign(S.cust, {name:'The Critic', critic:true, style:1, hair:'#F2F2F2', shirt:'#2A1B4F'});
  S.patMax = (L.patience + midLen*1.6) * (vip ? .72 : 1) * (L.mode==='boss' ? 1.7 : 1);
  renderTicket();
}
function renderTicket(){
  const L = S.L, tk = $('ticket');
  $('whoName').textContent = S.cust.name;
  $('orderNo').textContent = L.mode==='tall' ? '' : 'Order ' + S.orderNo;
  tk.classList.toggle('vip', !!S.cust.vip);
  tk.classList.toggle('critic', !!S.cust.critic);
  tk.classList.toggle('gold', L.mode==='frenzy');
  $('vipTag').textContent = S.cust.critic ? 'PAYS ×3' : 'VIP ×2';
  const box = $('recipe'); box.innerHTML='';
  box.classList.toggle('long', S.order.length > 7);
  if(L.mode==='tall') box.innerHTML = '<div class="free"><b>Catch anything!</b>Stack it up to the dashed line.</div>';
  S.order.forEach((t,i)=>{
    const d=document.createElement('div');
    d.className='step'+(i<S.idx?' done':'')+(i===S.idx?' next':'')+(i===S.swapI?' changed':'');
    const c=document.createElement('canvas'); c.width=72; c.height=48;
    const w=58; drawIng(c.getContext('2d'),t,36,24+H[t]*w/2,w);
    d.appendChild(c); box.appendChild(d);
  });
  // a taller or shorter ticket changes how much room the kitchen has
  const r = cv.getBoundingClientRect(); if(r.height && Math.abs(r.height - Hh) > 1) resize();
}
function renderHearts(){
  let h=''; for(let i=0;i<S.maxHearts;i++) h+=`<svg viewBox="0 0 24 24" style="fill:${i<S.hearts?'var(--bad)':'rgba(255,255,255,.18)'}"><use href="#i-heart"/></svg>`;
  $('hearts').innerHTML=h; $('hearts').setAttribute('aria-label', S.hearts+' hearts left');
}
function buildMeter(){
  const s=S.L.stars, top=s[2];
  const bar=$('bar'); bar.querySelectorAll('.mk').forEach(e=>e.remove());
  s.forEach((v,i)=>{ const m=document.createElement('div'); m.className='mk'; m.style.left=(v/top*100)+'%'; m.innerHTML=star(false); m.dataset.i=i; bar.appendChild(m); });
}
function updateHud(){
  const L = S.L;
  $('pts').textContent = S.score;
  const goal = L.mode==='tall' ? `Tower <b>${clamp(Math.round(towerFrac()*100),0,100)}%</b>`
    : L.mode==='frenzy' ? `Served <b>${S.served}</b> · need ${L.goal}`
    : `Orders <b>${S.served}</b> / ${L.goal}`;
  if($('hudGoal').innerHTML !== goal) $('hudGoal').innerHTML = goal;
  $('barFill').style.width = Math.min(100, S.score/L.stars[2]*100)+'%';
  const lit = L.stars.filter(v=>S.score>=v).length;
  if(lit !== S.starsLit){ S.starsLit = lit; $('bar').querySelectorAll('.mk').forEach(m=>{ m.innerHTML = star(+m.dataset.i < lit); }); }
  if(L.timed){ const t=Math.max(0,Math.ceil(S.timeLeft)); $('hudTimer').textContent = Math.floor(t/60)+':'+String(t%60).padStart(2,'0'); }
  const b=[];
  if(S.magnetT>0) b.push(`<span class="badge magnet">Magnet ${Math.ceil(S.magnetT)}s</span>`);
  if(S.freezeT>0) b.push(`<span class="badge freeze">Freeze ${Math.ceil(S.freezeT)}s</span>`);
  if(S.happyT>0) b.push(`<span class="badge happy">2× points ${Math.ceil(S.happyT)}s</span>`);
  if(S.windT>0) b.push(`<span class="badge wind">Wind ${S.wind>0?'→':'←'}</span>`);
  if(S.combo>1) b.push(`<span class="badge streak">${S.combo}x streak</span>`);
  const html=b.join(''); if($('badges').innerHTML!==html) $('badges').innerHTML=html;
  const pf = freeMode(L) ? S.timeLeft/L.timed : S.patience;
  const p=$('pat'); p.style.width=Math.max(0,pf*100)+'%';
  p.style.background = S.freezeT>0 ? 'var(--ice)' : pf>.5?'var(--good)':pf>.25?'var(--butter)':'var(--bad)';
  const mood = S.serveAnim ? 2 : Math.round(pf*20)/20;
  if(mood!==S.moodDrawn){ S.moodDrawn=mood; drawCustomer($('avatar').getContext('2d'), S.cust, mood); }
}
function pop(text,x,y,color,size){ S.pops.push({text,x,y,color,t:0,size:size||22}); }
function burst(x,y,colors,n,power){
  if(reduce) n = Math.ceil(n/3);
  for(let i=0;i<n;i++){ const a=rnd(0,Math.PI*2), sp=rnd(.3,1)*(power||220);
    S.parts.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-120,life:rnd(.5,1),t:0,c:pick(colors),s:rnd(2,5),r:rnd(0,6),conf:power>300}); }
}
function banner(text, small){
  const b=document.createElement('div'); b.className='banner'+(small?' small':''); b.textContent=text; $('field').appendChild(b);
  setTimeout(()=>b.remove(),1700);
}
function loseHeart(reason,x,y){
  S.hearts--; S.combo=0; S.shake = reduce?0:.35; renderHearts(); Sound.play('wrong');
  pop(reason,x,y,'#FF5E57');
  if(S.hearts<=0) finish(false, 'Out of hearts');
}

// ================= SPAWNING =================
function spawn(){
  const L=S.L, r=Math.random(), tall = L.mode==='tall', frenzy = L.mode==='frenzy';
  const powerChance = L.power ? .075 : 0;
  const w = plateW()*.9, x = w/2 + Math.random()*(W-w);
  const baseV = L.speed*unit;
  if(r < powerChance){
    let kind = S.hearts < S.maxHearts && Math.random()<.3 ? 'heart' : (L.freeze && Math.random()<.5 ? 'freeze' : 'magnet');
    if(tall && kind==='magnet') kind = L.freeze ? 'freeze' : '';   // nothing for a magnet to pull in a tower level
    if(kind){ S.items.push({kind:'token', type:kind, x, y:-24, vy:baseV*.8, state:'fall'}); return; }
  } else if(r < powerChance + L.flies){
    S.items.push({kind:'fly', x, bx:x, y:-20, vy:baseV*.7, ph:Math.random()*6, amp:rnd(30,80), state:'fall'});
    return;
  }
  // Mostly the ingredient needed now, often the one after it (so there's no dead wait between catches), sometimes anything.
  const need = S.order[S.idx], next = S.order[S.idx+1], roll = Math.random();
  const t = tall ? pick(L.pool) : roll < (frenzy?.6:.4) ? need : (next && roll < (frenzy?.82:.62)) ? next : pick(L.pool);
  S.items.push({kind:'ing', type:t, x, y:-10, vy:baseV*rnd(.85,1.15), rot:rnd(-.3,.3), vr:rnd(-1,1), state:'fall', vx:0});
}

// ================= SURPRISES =================
// Every so often something unexpected happens, so no two runs of a level play the same.
function gust(){
  const dir = S.wind ? -Math.sign(S.wind) : (Math.random()<.5 ? -1 : 1);
  S.wind = dir * rnd(55,85) * unit; S.windT = 5;
  banner('Wind gust!', true); Sound.play('gust');
}
function surprise(){
  const L = S.L, n = L.n;
  if(L.twist==='windy'){ gust(); return; }   // a windy day is windy even in Golden hour
  if(L.mode==='frenzy') return;
  const opts = [];
  if(L.mode!=='tall'){
    if(n >= UNLOCK.mystery) opts.push('mystery');
    if(n >= UNLOCK.happy && S.happyT<=0) opts.push('happy');
    if(n >= UNLOCK.swap && L.mode!=='boss' && swapSpots().length) opts.push('swap');
  }
  if(n >= UNLOCK.wind && S.windT<=0) opts.push('wind');
  if(!opts.length) return;
  const fresh = opts.filter(o => o!==S.lastEv), k = pick(fresh.length ? fresh : opts);
  S.lastEv = k;
  if(k==='wind') gust();
  if(k==='happy'){ S.happyT = 8; banner('Happy hour! 2× points', true); Sound.play('bell'); }
  if(k==='mystery'){
    const w = plateW()*.9;
    S.items.push({kind:'mystery', x: w/2 + Math.random()*(W-w), y:-24, vy:S.L.speed*unit*.75, state:'fall'});
  }
  if(k==='swap'){
    const i = pick(swapSpots());
    const t = pick(S.swapPool.filter(t => t!==S.order[i] && t!==S.order[i-1] && t!==S.order[i+1]));
    S.order[i] = t; S.swapI = i; S.patience = Math.min(1, S.patience + .15);
    renderTicket(); banner(`“Make it ${FOOD[t]}!”`, true); Sound.play('bell');
  }
}
// Fillings the customer could still change their mind about (not the one you're on, not the lid).
function swapSpots(){
  const out = [];
  for(let i=S.idx+1; i<S.order.length-1; i++)
    if(S.swapPool.includes(S.order[i]) && S.swapPool.some(t => t!==S.order[i] && t!==S.order[i-1] && t!==S.order[i+1])) out.push(i);
  return out;
}

// ================= UPDATE =================
function stackTop(){ let y=plateY; const pw=plateW()*.9; S.stack.forEach(t=>y-=H[t]*pw); return y; }
function swayOffset(i){ return S.lean * Math.pow(i,1.5) * 3.2 * (plateW()/118); }

function update(dt){
  const pw = plateW(), L = S.L;
  if(keys.left) S.targetX -= 480*dt;
  if(keys.right) S.targetX += 480*dt;
  S.targetX = clamp(S.targetX, pw/2, W-pw/2);
  S.prevPx = S.px;
  S.px += (S.targetX - S.px) * Math.min(1, dt*18);

  // wobble (very tall towers stop getting any touchier after 9 pieces)
  const v = (S.px - S.prevPx) / Math.max(dt, .001);
  const target = clamp(-v / (1100*unit+200), -1.2, 1.2) * L.wobble;
  S.lean += (target - S.lean) * Math.min(1, dt*5);
  const risk = Math.abs(S.lean) * clamp(S.stack.length-1, 0, 8) / 4.2;
  if(L.wobble && !S.serveAnim && S.stack.length > 1 && risk > .85) S.riskT += dt; else S.riskT = Math.max(0, S.riskT - dt);
  S.warnT -= dt;
  if(L.wobble && risk > .6 && S.warnT <= 0 && S.stack.length > 1){ pop('Steady!', S.px, stackTop()-30, '#FFD25E'); S.warnT = 1.2; Sound.play('warn'); }
  if(S.riskT > .2) topple();

  const frozen = S.freezeT > 0;
  S.magnetT = Math.max(0, S.magnetT - dt);
  S.freezeT = Math.max(0, S.freezeT - dt);
  S.happyT = Math.max(0, S.happyT - dt);
  S.windT = Math.max(0, S.windT - dt);
  if(L.timed && !frozen && !S.serveAnim){
    S.timeLeft -= dt;
    if(S.timeLeft<=0){ S.timeLeft = 0; if(L.mode==='frenzy' && S.served >= L.goal) finish(true); else finish(false, "Time's up"); return; }
  }

  if(S.serveAnim){
    S.serveAnim.t += dt;
    if(S.serveAnim.t > .6){
      S.serveAnim=null; S.stack=[];
      if(S.served >= L.goal && L.mode!=='frenzy'){ finish(true); return; }
      newOrder();
    }
  } else if(!frozen && !freeMode(L)){
    S.patience -= dt / S.patMax;
    if(S.patience <= 0){
      S.stack=[];
      loseHeart(S.cust.name+' left!', W/2, Hh*.3);
      if(!running) return;
      newOrder();
    }
  }
  if(!S.serveAnim){ S.evT -= dt; if(S.evT<=0){ surprise(); S.evT = L.twist==='windy' ? 6 : rnd(11,17); } }

  const fall = frozen ? .45 : 1;
  S.spawnT -= dt * fall;
  if(S.spawnT<=0){ spawn(); S.spawnT = Math.max(.5, 1.05 - L.n*.018) * rnd(.8,1.2) * (L.mode==='frenzy' ? .5 : 1); }

  const top = stackTop();
  for(const it of S.items){
    const prev = it.y;
    if(it.state==='fall'){
      it.y += it.vy*dt*fall;
      if(S.windT>0){ const dx = S.wind*dt*fall; if(it.kind==='fly') it.bx = clamp(it.bx+dx, 12, W-12); else it.x = clamp(it.x+dx, 14, W-14); }
      if(it.kind==='ing'){
        it.rot += it.vr*dt*.3;
        if(S.magnetT>0 && it.type===S.order[S.idx] && it.y > Hh*.2) it.x += (S.px - it.x) * Math.min(1, dt*4);
      }
      if(it.kind==='fly') it.x = clamp(it.bx + Math.sin(clock*3.2 + it.ph)*it.amp, 12, W-12);
      const catchY = it.kind==='ing' ? top : top - 14;
      if(!S.serveAnim && prev < catchY && it.y >= catchY && Math.abs(it.x - S.px) < pw*.52){
        if(!catchItem(it, top)) return;
      }
      if(it.y > Hh+40) it.dead = true;
    } else {
      it.vy += 900*unit*dt; it.y += it.vy*dt; it.x += it.vx*dt; it.rot = (it.rot||0) + (it.vr||0)*dt;
      if(it.y > Hh+60) it.dead = true;
    }
  }
  S.items = S.items.filter(i=>!i.dead);
  if(S.shake>0) S.shake -= dt;
  updateHud();
}
function updateFx(dt){
  if(!S) return;
  S.pops.forEach(p=>p.t+=dt); S.pops = S.pops.filter(p=>p.t<1);
  for(const p of S.parts){ p.t+=dt; p.vy += (p.conf?260:700)*dt; p.x+=p.vx*dt; p.y+=p.vy*dt; p.vx*=p.conf?.98:1; p.r+=dt*6; }
  S.parts = S.parts.filter(p=>p.t<p.life*(p.conf?2.2:1));
}

function catchItem(it, top){
  const L = S.L, x2 = S.happyT>0 ? 2 : 1;
  if(it.kind==='token'){
    it.dead = true;
    burst(S.px, top-10, TOKEN[it.type], 14); Sound.play(it.type==='heart'?'heart':'token');
    if(it.type==='magnet'){ S.magnetT = 7; pop('Magnet!', S.px, top-30, '#FF8F87'); }
    if(it.type==='freeze'){ S.freezeT = 5; pop('Freeze!', S.px, top-30, '#A6E4FF'); }
    if(it.type==='heart'){ S.hearts = Math.min(S.maxHearts, S.hearts+1); renderHearts(); pop('+1 heart', S.px, top-30, '#FF9AC4'); }
    return true;
  }
  if(it.kind==='fly'){
    it.dead = true; burst(S.px, top-10, ['#1A1428','#3A7F4A'], 10); Sound.play('fly');
    loseHeart('Yuck, a fly!', S.px, top-30);
    return running;
  }
  if(it.kind==='mystery'){   // counts as whatever the ticket needs next
    it.dead = true; burst(S.px, top-10, TOKEN.mystery, 18); Sound.play('lucky'); award('mystery');
    if(S.idx >= S.order.length) return true;
    S.stack.push(S.order[S.idx]); S.idx++;
    S.score += 25*x2; pop('Lucky! +'+25*x2, S.px, top-30, '#FFE98A', 24);
    if(S.idx >= S.order.length) serve(); else renderTicket();
    return true;
  }
  if(L.mode==='tall'){
    Sound.play('catch', Math.min(7, S.stack.length)); it.dead = true; S.stack.push(it.type); S.pieces++;
    S.score += 10; pop('+10', S.px, top-20, '#FFD25E', 18);
    burst(S.px, top, [CRUMB[it.type],'#FFFFFF'], 8, 160);
    if(towerFrac() >= 1){ S.served = 1; finish(true); return false; }
    return true;
  }
  if(it.type === S.order[S.idx]){
    Sound.play('catch', Math.min(7, S.idx)); it.dead = true; S.stack.push(it.type); S.idx++;
    S.score += 5*x2; pop('+'+5*x2, S.px, top-20, '#FFD25E', 18);
    burst(S.px, top, [CRUMB[it.type],'#FFFFFF'], 8, 160);
    if(S.idx >= S.order.length) serve(); else renderTicket();
    return true;
  }
  it.state='bounce'; it.vy = -260*unit; it.vx = (it.x<S.px?-1:1)*160; it.vr = 8;
  if(L.mode==='frenzy'){ S.combo = 0; Sound.play('wrong'); pop('Oops!', S.px, top-24, '#FF5E57'); return true; }   // no hearts to lose in Golden hour
  loseHeart('Wrong!', S.px, top-24);
  return running;
}
function topple(){
  const t = S.stack.pop(); if(S.L.mode!=='tall') S.idx--;
  const dir = S.lean > 0 ? 1 : -1;
  S.items.push({kind:'ing', type:t, x:S.px + swayOffset(S.stack.length+1), y:stackTop(), vy:-200*unit, vx:dir*220, rot:0, vr:dir*9, state:'bounce'});
  S.lean *= .3; S.riskT = 0; S.combo = 0; S.shake = reduce?0:.2;
  pop('Toppled!', S.px, stackTop()-30, '#FF5E57'); Sound.play('topple');
  renderTicket();
}
function serve(){
  const L = S.L, tip = Math.round(S.patience*20);
  S.combo++;
  let bonus = S.order.length*10 + tip + (S.combo>1 ? S.combo*5 : 0);
  if(S.cust.vip) bonus *= 2;
  if(S.cust.critic) bonus *= 3;
  if(S.happyT>0) bonus *= 2;
  S.score += bonus; S.served++;
  if(L.mode==='frenzy') S.bonusCoins += 3;
  pop((S.cust.critic?'Exquisite! +':S.cust.vip?'VIP! +':'Yum! +')+bonus, S.px, stackTop()-40, '#7BE8A8', 26);
  if(L.mode==='frenzy') pop('+3 coins', S.px, stackTop()-70, '#FFD25E', 20);
  burst(S.px, stackTop(), ['#FFD25E','#FF6FA8','#7FD3FF','#3FCB7E','#FFFFFF'], 30, 360);
  S.serveAnim = {t:0, x:S.px}; Sound.play('serve'); setTimeout(()=>Sound.play('whoosh'),250);
  S.items.forEach(i=>{ if(i.state==='fall' && i.kind==='ing'){ i.state='bounce'; i.vy=-120*unit; i.vx=rnd(-100,100); i.vr=4; }});
  new Set(S.order).forEach(t => award('f_'+t));
  if(S.cust.vip) award('vip');
  if(S.combo >= 5) award('streak5');
  renderTicket(); updateHud();
}

// ================= FINISH =================
function finish(won, reason){
  if(S.over) return; S.over = true; running = false;
  const L = S.L, n = L.n;
  if(!won){
    if(!L.daily){ save.fails[n] = (save.fails[n]||0) + 1; persist(); }
    Sound.play('lose'); setTimeout(()=>openModal(loseHtml(L, reason)), 500);
    return;
  }
  if(!L.daily) delete save.fails[n];
  const heartBonus = L.mode==='frenzy' ? 0 : S.hearts*50;
  const timeBonus = L.timed && L.mode!=='frenzy' ? Math.floor(S.timeLeft) * (L.mode==='tall' ? 5 : 3) : 0;
  const base = S.score; S.score += heartBonus + timeBonus; updateHud();
  const stars = Math.max(1, L.stars.filter(v=>S.score>=v).length);
  let coins = Math.round(S.score/10) + S.bonusCoins, firstToday = false;
  if(L.daily){
    // The daily pays a fixed prize once a day (replays are just for fun), plus a little more for each day in a row.
    firstToday = save.daily.day !== L.daily;
    if(firstToday){
      save.daily.streak = save.daily.day === yesterday() ? save.daily.streak + 1 : 1;
      save.daily.day = L.daily;
      coins = DAILY_COINS + Math.min(save.daily.streak, 7)*5;
    } else coins = 0;
    award('daily1'); if(save.daily.streak >= 3) award('daily3'); if(save.daily.streak >= 7) award('daily7');
  } else {
    save.stars[n] = Math.max(save.stars[n]||0, stars);
    save.best[n] = Math.max(save.best[n]||0, S.score);
    save.unlocked = Math.max(save.unlocked, n+1);
  }
  save.coins += coins;
  if(L.mode==='tall') award('tower');
  if(L.mode==='perfect') award('perfect');
  if(L.mode==='boss') award('critic');
  if(L.mode==='frenzy' && S.served >= 6) award('golden');
  if(Object.values(save.stars).reduce((a,b)=>a+b,0) >= 30) award('stars30');
  persist();
  for(let i=0;i<4;i++) setTimeout(()=>burst(rnd(W*.2,W*.8), rnd(Hh*.2,Hh*.5), ['#FFD25E','#FF6FA8','#7FD3FF','#3FCB7E','#FFFFFF'], 30, 420), i*180);
  banner(L.mode==='tall' ? 'Sky-high!' : L.mode==='frenzy' ? "Time's up!" : 'Order complete!'); Sound.play('win');
  setTimeout(()=>{ openModal(winHtml(L, stars, base, heartBonus, timeBonus, coins, firstToday)); for(let i=0;i<stars;i++) setTimeout(()=>Sound.play('star',i), 150+i*300); setTimeout(()=>Sound.play('coin'), 250+stars*300); }, 1300);
}
function winHtml(L, stars, base, hb, tb, coins, firstToday){
  const n = L.n, last = n===TOTAL && !L.daily;
  const what = L.mode==='tall' ? `Tower pieces (${S.pieces})` : `Orders served (${S.served})`;
  return `<div class="ribbon win">${L.daily ? 'Daily cleared' : 'Level '+n+' cleared'}</div>
    <div class="starsRow big">${[0,1,2].map(i=>`<svg viewBox="0 0 24 24" class="${i<stars?'pop':''} ${i===1?'mid':''}" style="animation-delay:${.15+i*.3}s"><use href="#${i<stars?'i-star':'i-star-off'}"/></svg>`).join('')}</div>
    <div class="bigScore">${S.score}</div>
    <div class="breakdown"><span>${what}</span><span>${base}</span>
      ${L.mode==='frenzy'?'':`<span>Hearts left × 50</span><span>${hb}</span>`}
      ${tb||L.mode==='rush'||L.mode==='tall'?`<span>Time left × ${L.mode==='tall'?5:3}</span><span>${tb}</span>`:''}
      <span class="tot">Total</span><span class="tot">${S.score}</span></div>
    ${L.daily && !firstToday ? '<div class="thresholds">You already collected today\'s prize. Come back tomorrow for a new challenge.</div>'
      : `<div class="earned">${coin}+${coins}</div>${L.daily ? `<div class="thresholds">${save.daily.streak} day${save.daily.streak>1?'s':''} in a row. Come back tomorrow to keep it going.</div>` : S.bonusCoins ? `<div class="thresholds">Includes ${S.bonusCoins} Golden hour bonus coins</div>` : ''}`}

// ================= DRAW =================
function draw(){
  if(!S || $('play').hidden) return;
  ctx.save();
  ctx.clearRect(0,0,W,Hh);
  if(S.shake>0) ctx.translate(rnd(-5,5)*S.shake*2, rnd(-3,3)*S.shake*2);
  if(bgCache) ctx.drawImage(bgCache, 0,0, W, Hh);
  if(S.L.mode==='frenzy'){ ctx.fillStyle='rgba(255,210,94,.16)'; ctx.fillRect(0,0,W,Hh); }
  if(S.freezeT>0){ ctx.fillStyle='rgba(143,216,255,.16)'; ctx.fillRect(0,0,W,Hh); }
  const pw = plateW();
  if(S.L.mode==='tall'){   // the line the tower has to reach
    const gy = plateY - S.tallH;
    ctx.strokeStyle='rgba(30,16,60,.5)'; ctx.lineWidth=6; ctx.setLineDash([14,10]); ctx.beginPath(); ctx.moveTo(0,gy+2); ctx.lineTo(W,gy+2); ctx.stroke();
    ctx.strokeStyle='#FFD25E'; ctx.lineWidth=4; ctx.beginPath(); ctx.moveTo(0,gy); ctx.lineTo(W,gy); ctx.stroke(); ctx.setLineDash([]);
    ctx.font='16px "Lilita One", sans-serif'; ctx.textAlign='left'; ctx.lineJoin='round';
    ctx.strokeStyle='rgba(30,16,60,.85)'; ctx.lineWidth=4; ctx.strokeText('GOAL', 8, gy-7); ctx.fillStyle='#FFD25E'; ctx.fillText('GOAL', 8, gy-7);
  }
  if(S.windT>0 && !reduce){   // wind streaks
    const d = Math.sign(S.wind), span = W+80;
    ctx.strokeStyle='rgba(255,255,255,.45)'; ctx.lineWidth=2; ctx.lineCap='round';
    for(let i=0;i<7;i++){ const yy = Hh*(.07+i*.11), xx = (((clock*230*d + i*97) % span) + span) % span - 40;
      ctx.beginPath(); ctx.moveTo(xx,yy); ctx.lineTo(xx-d*36,yy); ctx.stroke(); }
  }

  for(const it of S.items){
    if(it.kind==='token'){ drawToken(ctx,it.type,it.x,it.y,pw*.17,clock); continue; }
    if(it.kind==='mystery'){ drawToken(ctx,'mystery',it.x,it.y,pw*.19,clock); continue; }
    if(it.kind==='fly'){ drawFly(ctx,it.x,it.y,pw*.22,clock); continue; }
    ctx.save(); ctx.translate(it.x, it.y); ctx.rotate(it.rot||0);
    if(it.type===S.order[S.idx] && it.state==='fall'){ ctx.shadowColor='rgba(255,240,150,.95)'; ctx.shadowBlur=18; }
    drawIng(ctx,it.type,0,0,pw*.9);
    ctx.restore();
  }
  if(S.magnetT>0 && !S.serveAnim){
    ctx.strokeStyle='rgba(255,120,110,.45)'; ctx.lineWidth=3; ctx.setLineDash([6,10]); ctx.lineDashOffset=-clock*40;
    ctx.beginPath(); ctx.moveTo(S.px, stackTop()-10); ctx.lineTo(S.px, 0); ctx.stroke(); ctx.setLineDash([]);
  }

  let px = S.px, off = 0;
  if(S.serveAnim){ const k=S.serveAnim.t/.6; off = -k*k*Hh*.95; px = S.serveAnim.x; }
  ctx.save(); ctx.translate(0, off);
  // soft spotlight + shadow so the plate reads on every background
  const spot=ctx.createRadialGradient(px,plateY+4,4,px,plateY+4,pw*.9); spot.addColorStop(0,'rgba(255,255,230,.45)'); spot.addColorStop(1,'rgba(255,255,230,0)');
  ctx.fillStyle=spot; ctx.fillRect(px-pw, plateY-pw*.5, pw*2, pw);
  drawPlate(ctx, px, plateY, pw, plateLook());
  let y = plateY;
  const danger = S.riskT > 0;
  S.stack.forEach((t,i)=>{
    const wob = (reduce?0:Math.sin(clock*4 + i)*i*.5) + (S.serveAnim?0:swayOffset(i));
    const jit = danger && !reduce ? rnd(-1.5,1.5) : 0;
    drawIng(ctx,t,px+wob+jit,y,pw*.9); y -= H[t]*pw*.9;
  });
  ctx.restore();

  for(const p of S.parts){
    ctx.globalAlpha = clamp(1 - p.t/(p.life*(p.conf?2.2:1)),0,1);
    ctx.fillStyle=p.c; ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.r);
    if(p.conf) ctx.fillRect(-p.s,-p.s*.5,p.s*2,p.s); else { ctx.beginPath(); ctx.arc(0,0,p.s*.8,0,7); ctx.fill(); }
    ctx.restore();
  }
  ctx.globalAlpha=1;
  ctx.textAlign='center';
  for(const p of S.pops){
    const k = p.t<.15 ? .6+p.t/.15*.4 : 1;
    ctx.font = `${Math.round(p.size*k)}px "Lilita One", sans-serif`;
    ctx.globalAlpha = 1 - Math.max(0,(p.t-.5)*2); ctx.fillStyle = p.color;
    ctx.strokeStyle='rgba(30,16,60,.85)'; ctx.lineWidth=5; ctx.lineJoin='round';
    ctx.strokeText(p.text, p.x, p.y - p.t*44); ctx.fillText(p.text, p.x, p.y - p.t*44);
  }
  ctx.globalAlpha=1;
  ctx.restore();
}
function loop(t){
  const dt = Math.min(.05, (t-last)/1000 || 0); last = t;
  clock += dt;
  if(running) update(dt);
  updateFx(dt);
  if(screen==='home') drawHome(dt);
  draw();
  requestAnimationFrame(loop);
}

const BOOSTERS = [
  {k:'magnet', name:'Magnet',      desc:'Start the level with a 10-second magnet.',  unlock:UNLOCK.power, price:[30,80],  col:'linear-gradient(#FF8F87,#E8392F)', token:'magnet'},
  {k:'plate',  name:'Big Plate',   desc:'A 22% wider plate for the whole level.',    unlock:UNLOCK.wobble, price:[40,100], col:'linear-gradient(#8DF0B8,#26A360)', token:'plate'},
  {k:'heart',  name:'Extra Heart', desc:'Start the level with 4 hearts instead of 3.', unlock:UNLOCK.freeze, price:[50,130], col:'linear-gradient(#FF9AC4,#E23C7E)', token:'heart'},
];
// small icon for a booster, drawn into a canvas
function boosterIcon(b, size){
  const c=document.createElement('canvas'); c.width=size*2; c.height=size*2; const g=c.getContext('2d');
  if(b.token==='plate'){
    const r=size; g.fillStyle='#fff'; g.beginPath(); g.ellipse(r,r*1.25,r*.85,r*.22,0,0,7); g.fill(); g.strokeStyle='#2A1B4F'; g.lineWidth=3; g.stroke();
    drawIng(g,'patty',r,r*1.18,r*1.2); drawIng(g,'bunTop',r,r*1.18-H.patty*r*1.2,r*1.2);
    g.strokeStyle='#fff'; g.lineWidth=4; g.lineCap='round';
    g.beginPath(); g.moveTo(r*.1,r*.45); g.lineTo(r*.35,r*.3); g.moveTo(r*.1,r*.45); g.lineTo(r*.35,r*.6); g.moveTo(r*1.9,r*.45); g.lineTo(r*1.65,r*.3); g.moveTo(r*1.9,r*.45); g.lineTo(r*1.65,r*.6); g.stroke();
  } else drawToken(g,b.token,size,size,size*.78,0);
  return c;
}
let chosen = {};
function tipIcon(kind){
  const c=document.createElement('canvas'); c.width=96; c.height=96; const g=c.getContext('2d');
  if(kind==='magnet'||kind==='freeze') drawToken(g,kind,48,48,34,0);
  else if(kind==='fly') drawFly(g,48,52,44,0);
  else if(kind==='vip') drawCustomer(g,{skin:'#E9B48A',hair:'#2B1B12',shirt:'#8A6BE0',style:1,vip:true},.8);
  else if(kind==='wobble'){ let y=86; ['bunBottom','patty','cheese','lettuce','bunTop'].forEach((t,i)=>{ drawIng(g,t,40+i*i*1.6,y,62); y-=H[t]*62; }); }
  else if(kind==='timer'){ g.fillStyle='#FF5E57'; g.beginPath(); g.arc(48,52,34,0,7); g.fill(); g.fillStyle='#fff'; g.beginPath(); g.arc(48,52,27,0,7); g.fill();
    g.strokeStyle='#2A1B4F'; g.lineWidth=5; g.lineCap='round'; g.beginPath(); g.moveTo(48,52); g.lineTo(48,34); g.moveTo(48,52); g.lineTo(60,58); g.stroke(); g.fillStyle='#FF5E57'; g.fillRect(42,8,12,10); }
  else if(kind.startsWith('food:')){ const t=kind.slice(5), w=84; drawIng(g,t,48,48+H[t]*w/2,w); }
  else if(kind==='perfect') drawToken(g,'heart',48,48,34,0);
  else if(kind==='frenzy'){ const gr=g.createLinearGradient(0,14,0,82); gr.addColorStop(0,'#FFE98A'); gr.addColorStop(1,'#F0A000');
    g.fillStyle=gr; g.beginPath(); g.arc(48,48,34,0,7); g.fill(); g.lineWidth=4; g.strokeStyle='#B87400'; g.stroke();
    g.strokeStyle='#FFF3B0'; g.lineWidth=3; g.beginPath(); g.arc(48,48,23,0,7); g.stroke();
    g.strokeStyle='#B87400'; g.lineWidth=7; g.lineCap='round'; g.beginPath(); g.moveTo(48,36); g.lineTo(48,60); g.stroke(); }
  else if(kind==='boss') drawCustomer(g,{skin:'#F7D2B0',hair:'#F2F2F2',shirt:'#2A1B4F',style:1,critic:true},.5);
  else if(kind==='tall'){ let y=94; ['bunBottom','patty','cheese','tomato','patty','lettuce','bunTop'].forEach(t=>{ drawIng(g,t,48,y,50); y-=H[t]*50; });
    g.strokeStyle='#FFB400'; g.lineWidth=3; g.setLineDash([6,5]); g.beginPath(); g.moveTo(4,y-3); g.lineTo(92,y-3); g.stroke(); g.setLineDash([]); }
  else if(kind==='twist'){ g.fillStyle='#FF6FA8'; g.beginPath(); g.arc(48,48,34,0,7); g.fill(); g.lineWidth=4; g.strokeStyle='#fff'; g.stroke();
    g.font='48px "Lilita One", sans-serif'; g.textAlign='center'; g.textBaseline='middle'; g.fillStyle='#fff'; g.fillText('!',48,51); }
  else if(kind==='fast'){ drawIng(g,'tomato',48,54,70); g.strokeStyle='#7FD3FF'; g.lineWidth=4; g.lineCap='round'; for(const x of [26,48,70]){ g.beginPath(); g.moveTo(x,10); g.lineTo(x,36); g.stroke(); } }
  return c;
}
let introL = null;   // the level whose intro card is open
function openLevel(n){ openIntro(levelDef(n)); }
function openIntro(L){
  chosen = {}; introL = L;
  const n = L.n, m = MODES[L.mode], mmss = t => Math.floor(t/60)+':'+String(t%60).padStart(2,'0');
  const best = L.daily ? 0 : save.best[n]||0, st = L.daily ? 0 : save.stars[n]||0;
  const goalTxt = L.mode==='rush' ? `Serve ${L.goal} orders in ${mmss(L.timed)}`
    : L.mode==='perfect' ? `Serve ${L.goal} orders, no mistakes`
    : L.mode==='tall' ? `Stack up to the line in ${mmss(L.timed)}`
    : L.mode==='frenzy' ? `Serve all you can in ${mmss(L.timed)}`
    : L.mode==='boss' ? 'Serve 2 giant towers'
    : `Serve ${L.goal} orders`;
  const sub = L.mode==='frenzy' ? `Serve ${L.goal} to pass · no hearts to lose` : `${L.hearts} heart${L.hearts>1?'s':''}`;
  // A level's own tip wins; otherwise special levels explain themselves. The daily adds its twist.
  const tip = L.tip || (m.desc ? {text:m.desc} : null);
  const tw = L.twist ? TWISTS[L.twist] : null;
  const helpTxt = L.help ? (L.mode==='tall' ? `Tough one. Here's <b>${L.help*8} extra seconds</b> on the house.` : `Tough one. Here's <b>${L.help} extra heart${L.help>1?'s':''}</b> on the house.`) : '';
  const claimed = L.daily && save.daily.day === L.daily;
  openModal(`<button class="closeX" data-act="close" aria-label="Close">✕</button>
    <div class="ribbon">${L.daily ? 'Daily challenge' : 'Level '+n}</div>
    <div class="world">${L.world.name}${m.name ? ` <span class="modeTag">${m.name}</span>` : ''}</div>
    ${L.daily ? '' : `<div class="starsRow">${star(st>0)}<svg viewBox="0 0 24 24" class="mid"><use href="#${st>1?'i-star':'i-star-off'}"/></svg>${star(st>2)}</div>`}
    <div class="goalBox"><canvas id="goalIcon" width="112" height="88"></canvas><div><b>${goalTxt}</b><span>${sub}${best?` · Best ${best}`:''}</span></div></div>
    ${tip?`<div class="tip ${tip.icon?'new':''}" id="tipBox">${tip.icon?'<span id="tipIco"></span>':''}<div>${tip.isNew?'<span class="newPill">NEW</span>':''}${tip.text}</div></div>`:''}
    ${helpTxt?`<div class="newStick">${helpTxt}</div>`:''}
    ${tw?`<div class="tip new"><span id="twIco"></span><div><span class="newPill">TODAY</span><b>${tw.name}.</b> ${tw.desc}</div></div>`:''}
    ${L.daily ? `<div class="thresholds">${claimed ? 'Prize collected today. You can still replay for fun.' : `Prize: ${DAILY_COINS + Math.min((save.daily.day===yesterday()?save.daily.streak:0)+1,7)*5} coins${save.daily.day===yesterday() ? ` · ${save.daily.streak} day streak` : ''}`}</div>`
      : `<div class="thresholds">Stars at ${L.stars.join(' · ')} points</div>`}
    <div class="boostLabel">Boosters</div>
    <div class="boosters">${BOOSTERS.map(b=>boosterBtn(b)).join('')}</div>
    <div class="modalBtns"><button class="btn green" data-act="${L.daily?'playdaily':'play'}" data-n="${n}" style="width:100%">Play</button></div>`);
  const gc = $('goalIcon').getContext('2d');
  if(L.mode==='tall'){ let y=86; ['bunBottom','patty','cheese','tomato','patty','lettuce','bunTop'].forEach(t=>{ drawIng(gc,t,56,y,58); y-=H[t]*58; }); }
  else { let y=80; ['bunBottom','patty','cheese','lettuce','bunTop'].forEach(t=>{ drawIng(gc,t,56,y,80); y-=H[t]*80; }); }
  if(tip && tip.icon) $('tipIco').replaceWith(tipIcon(tip.icon));
  if(tw) $('twIco').replaceWith(tipIcon('twist'));
  $('modal').querySelectorAll('.booster .bi').forEach(el=>{ const b=BOOSTERS.find(x=>x.k===el.dataset.k); el.appendChild(boosterIcon(b,20)); el.firstChild.style.cssText='width:40px;height:40px'; });
}
function boosterBtn(b){
  const locked = save.unlocked < b.unlock, own = save.inv[b.k], on = !!chosen[b.k];
  // a magnet has nothing to pull in a tower level, so don't let one be wasted
  if(!locked && b.k==='magnet' && introL && introL.mode==='tall') return `<button class="booster lockedB" disabled><div class="bi" data-k="${b.k}" style="background:${b.col}"></div><b>${b.name}</b><span style="color:var(--ink-2)">No use here</span></button>`;
  if(locked) return `<button class="booster lockedB" disabled><div class="bi" data-k="${b.k}" style="background:${b.col}"></div><b>${b.name}</b><span style="color:var(--ink-2)">Level ${b.unlock}</span></button>`;
  if(!own) return `<button class="booster get" data-act="shop"><div class="bi" data-k="${b.k}" style="background:${b.col}"></div><b>${b.name}</b><span>Get more</span></button>`;
  return `<button class="booster" data-boost="${b.k}" aria-pressed="${on}"><span class="cnt">${own}</span><div class="bi" data-k="${b.k}" style="background:${b.col}"></div><b>${b.name}</b><span style="color:${on?'var(--good)':'var(--ink-2)'}">${on?'Selected':'Tap to use'}</span></button>`;
}
function refreshBoosters(){
  $('modal').querySelectorAll('[data-boost]').forEach(el=>{
    const on = !!chosen[el.dataset.boost];
    el.setAttribute('aria-pressed', on);
    const s = el.querySelector('span:last-child'); s.textContent = on?'Selected':'Tap to use'; s.style.color = on?'var(--good)':'var(--ink-2)';
  });
}
$('modal').addEventListener('click', e=>{
  const sk = e.target.closest('[data-stick]');
  if(sk){ const s = STICKERS[+sk.dataset.stick], got = save.stickers[s.k];
    $('modal').querySelectorAll('.stick').forEach(el => el.setAttribute('aria-pressed', el===sk));
    $('stickInfo').innerHTML = got ? `<b>${s.name}</b> · collected. ${s.how}` : `<b>How to get it:</b> ${s.how}`; return; }
  const bst = e.target.closest('[data-boost]');
  if(bst){ const k=bst.dataset.boost; if(chosen[k]) delete chosen[k]; else chosen[k]=true; refreshBoosters(); return; }
  const a = e.target.closest('[data-act]'); if(!a) return;
  const act=a.dataset.act, n=+a.dataset.n;
  if(act==='close'){ closeModal(); }
  if(act==='play'){
    Object.keys(chosen).forEach(k=>{ save.inv[k] = Math.max(0, save.inv[k]-1); });
    persist(); startLevel(n, {...chosen});
  }
  if(act==='playdaily'){
    Object.keys(chosen).forEach(k=>{ save.inv[k] = Math.max(0, save.inv[k]-1); });
    persist(); begin(introL && introL.daily ? introL : dailyDef(), {...chosen});
  }
  if(act==='home'){ running=false; S=null; closeModal(); showHome(); }
  if(act==='daily'){ S=null; closeModal(); showHome(); openDaily(); }
  if(act==='shop'){ closeModal(); openShop(); }
  if(act==='music'||act==='sfx'){ const on = a.getAttribute('aria-pressed')!=='true'; a.setAttribute('aria-pressed', on); act==='music' ? Sound.setMusic(on) : Sound.setSfx(on); if(on) Sound.play('tap'); }
  if(act==='testcoins'){ const amt=+a.dataset.amt; save.coins += amt; persist(); refreshWallet(); Sound.play('coin'); closeModal(); toast(`+${amt} test coins`); renderShop(); }
  if(act==='map'||act==='quit'){ const daily = S && S.L.daily; running=false; S=null; closeModal(); daily ? showHome() : showMap(); }
  if(act==='next'||act==='open'){ S=null; closeModal(); if(!showMap()) openLevel(n); }
  if(act==='resume'){ closeModal(); running=true; last=performance.now(); }
});
$('modalWrap').addEventListener('click', e=>{ if(e.target===$('modalWrap') && $('modal').querySelector('[data-act="close"]')) closeModal(); });

// ================= MAP =================
function showMap(){
  showScreen('map');
  const inner=$('mapInner'), gap=104, pad=150, END=mapEnd();
  const worlds=[]; for(let n=1;n<=END;n+=WSIZE) worlds.push(worldOf(n));
  const Hm = pad*2 + (END-1)*gap; inner.style.height = Hm+'px';
  const yOf = n => Hm - pad - (n-1)*gap;
  const xOf = n => 50 + 27*Math.sin((n-1)*1.05);
  let html='';
  worlds.forEach((w,i)=>{
    const top = i===worlds.length-1 ? 0 : yOf(w.to) - gap/2;
    const bottom = i===0 ? Hm : yOf(w.from) + gap/2;
    html += `<div class="band ${w.key}" style="top:${top}px;height:${bottom-top}px"></div>`;
  });
  // path
  let d=`M ${xOf(1)} ${yOf(1)}`;
  for(let n=2;n<=END;n++){ const my=(yOf(n-1)+yOf(n))/2; d+=` C ${xOf(n-1)} ${my}, ${xOf(n)} ${my}, ${xOf(n)} ${yOf(n)}`; }
  html += `<svg id="mapPath" viewBox="0 0 100 ${Hm}" preserveAspectRatio="none" style="height:${Hm}px">
    <path d="${d}" fill="none" stroke="rgba(0,0,0,.18)" stroke-width="22" stroke-linecap="round" vector-effect="non-scaling-stroke" transform="translate(0 4)"/>
    <path d="${d}" fill="none" stroke="#FFF8EA" stroke-width="18" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
    <path d="${d}" fill="none" stroke="#F3D9A8" stroke-width="4" stroke-dasharray="2 12" stroke-linecap="round" vector-effect="non-scaling-stroke"/></svg>`;
  worlds.forEach((w,i)=>{ html += `<div class="worldSign" style="top:${yOf(w.from)+gap*.42}px"><small>World ${i+1}${w.lap?' · Bonus':''}</small>${w.name}</div>`; });
  const cur = save.unlocked;
  for(let n=1;n<=END;n++){
    const st = save.stars[n]||0, locked = n>cur, done = st>0;
    const cls = locked?'locked':(n===cur && !done)?'current':done?'done':'current';
    const md = MODES[modeOf(n)];
    html += `<button class="node ${cls}" data-level="${n}" style="left:${xOf(n)}%;top:${yOf(n)}px" ${locked?'aria-disabled="true"':''} aria-label="Level ${n}${md.name?', '+md.name:''}${locked?', locked':done?', '+st+' stars':''}">
      ${md.tag?`<span class="ntag">${md.tag}</span>`:''}
      ${locked?'<svg class="lock" viewBox="0 0 24 24"><use href="#i-lock"/></svg>':n}
      ${done?`<span class="nstars">${[0,1,2].map(i=>star(i<st)).join('')}</span>`:''}</button>`;
  }
  inner.innerHTML = html;
  const sc=$('mapScroll');
  requestAnimationFrame(()=>{ sc.scrollTop = yOf(cur) - sc.clientHeight*.55; });
  const before = $('modalWrap').hidden;
  checkUnlockGifts();
  return before && !$('modalWrap').hidden; // true if a gift popup opened
}
$('mapInner').addEventListener('click', e=>{
  const b=e.target.closest('.node'); if(!b) return;
  const n=+b.dataset.level; if(n>save.unlocked) return;
  openLevel(n);
});

addEventListener('resize', ()=>{ if(screen==='home') sizeHome(); });
// Screenshot hook for App Store images: only active when the page is opened with #shots.
if (location.hash === '#shots') window.__cs = {
  get S(){ return S; }, get W(){ return W; }, get H(){ return Hh; }, get plateY(){ return plateY; },
  start: startLevel, stop(){ running = false; }, showMap, showHome, openLevel, finish, burst, pop,
  renderTicket, updateHud, renderHearts, newCustomer, closeModal,
  heights: H, levelDef, dailyDef, begin, surprise, award, openDaily, get save(){ return save; },
};
showHome();
requestAnimationFrame(loop);
})();
</script>
