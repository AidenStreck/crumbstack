<title>Sunsprout</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800&display=swap">
<style>
/* Sunsprout: a calm light puzzle. Portrait screens: home, garden modes, level grid, puzzle, my garden.
   Soft garden palette: cream paper, leaf green, sun yellow, terracotta pots. */
:root{
  --paper:#FFF8EC; --card:#FFFDF7; --ink:#2E3B2F; --ink-2:#5E6B5A; --ink-3:#8A9585; --leaf:#4CAF6A; --leaf-d:#2E8A4C; --sun:#FFC83D; --sun-d:#E0A21A;
  --pot:#D9774E; --line:#E9DFC9; --sky:#EAF7E1; --accent:#6FBF5E; --accent-d:#3E8E3A;
  --display:"Fredoka","Arial Rounded MT Bold","Trebuchet MS",sans-serif; --body:"Nunito",system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:linear-gradient(180deg,#F4FBEF 0%,var(--sky) 55%,#DDEFD2 100%);font-family:var(--body);color:var(--ink);overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
button{font-family:var(--display);color:inherit;cursor:pointer;border:0;background:none;padding:0}
button:focus-visible{outline:3px solid var(--ink);outline-offset:3px;border-radius:12px}
.screen{position:fixed;inset:0;display:flex;flex-direction:column;padding:calc(10px + env(safe-area-inset-top,0px)) 16px calc(12px + env(safe-area-inset-bottom,0px));max-width:560px;margin:0 auto;animation:scr .28s ease-out}
.screen[hidden]{display:none}
@keyframes scr{from{opacity:0;transform:translateY(10px)}}
/* shared */
.btn{font-weight:600;font-size:20px;border-radius:18px;padding:13px 22px;background:var(--leaf);color:#fff;box-shadow:0 5px 0 var(--leaf-d),0 10px 22px rgba(46,138,76,.18);display:flex;align-items:center;justify-content:center;gap:10px;width:100%;transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--leaf-d)}
.btn.sun{background:var(--sun);color:#4A3A10;box-shadow:0 5px 0 var(--sun-d),0 10px 22px rgba(224,162,26,.2)}
.btn.soft{background:var(--card);color:var(--ink);box-shadow:0 4px 0 var(--line),0 8px 18px rgba(0,0,0,.05)}
.btn.locked{background:#EEE7D8;color:var(--ink-3);box-shadow:0 4px 0 #DDD3BE}
.btn .sub{font-family:var(--body);font-size:12.5px;font-weight:800;opacity:.85;display:block;line-height:1.1}
.btn .txt{display:flex;flex-direction:column;align-items:flex-start;line-height:1.1;flex:1;text-align:left}
.btn svg{width:26px;height:26px;flex:none}
.iconBtn{width:44px;height:44px;border-radius:14px;background:var(--card);box-shadow:0 3px 0 var(--line);display:grid;place-items:center;position:relative;flex:none}
.iconBtn svg{width:22px;height:22px}
.bar{display:flex;align-items:center;gap:10px;min-height:48px;margin-bottom:6px}
.bar h2{flex:1;margin:0;font-family:var(--display);font-weight:600;font-size:20px;line-height:1.1;text-align:center}
.bar h2 small{display:block;font-family:var(--body);font-size:11.5px;color:var(--ink-2);font-weight:800;letter-spacing:.6px;text-transform:uppercase;margin-top:2px}
.spacer{width:44px;flex:none}
.scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:4px 2px 24px;margin:0 -2px}
.leaves{display:inline-flex;gap:2px}
.leaves i{width:10px;height:10px;border-radius:0 100% 0 100%;background:#DCCFB5;display:block}
.leaves i.on{background:var(--leaf)}
/* home */
#home{align-items:center;justify-content:center;gap:10px;text-align:center}
#homeArt{width:250px;height:200px;margin-bottom:-6px}
.logo{font-family:var(--display);font-weight:700;font-size:clamp(46px,14vw,62px);line-height:.95;color:var(--leaf-d);letter-spacing:-.5px;text-shadow:0 3px 0 rgba(46,138,76,.12)}
.logo span{color:var(--sun-d)}
.tag{font-size:15px;color:var(--ink-2);font-weight:700;margin:2px 0 10px}
.homeBtns{display:flex;flex-direction:column;gap:12px;width:100%;max-width:330px}
.homeRow{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.corner{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));right:16px}
/* garden modes */
.modes{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mode{position:relative;background:var(--card);border-radius:22px;padding:12px 12px 14px;text-align:left;box-shadow:0 4px 0 var(--line),0 10px 22px rgba(0,0,0,.05);display:flex;flex-direction:column;gap:4px;overflow:hidden}
.mode .art{width:100%;aspect-ratio:1.35;border-radius:14px;display:block}
.mode b{font-family:var(--display);font-size:22px;font-weight:600;line-height:1}
.mode span{font-size:12.5px;font-weight:800;color:var(--ink-2)}
.meter{height:7px;border-radius:9px;background:#EEE6D4;overflow:hidden;margin-top:4px}
.meter i{display:block;height:100%;border-radius:9px}
.mode.locked .art{filter:grayscale(.9) opacity(.55)}
.mode .lock{position:absolute;left:12px;right:12px;top:12px;aspect-ratio:1.35;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:10px;text-align:center;font-weight:800;font-size:12.5px;line-height:1.25;color:var(--ink);background:rgba(255,253,247,.7)}
.mode .lock svg{width:22px;height:22px}
.tray.many .piece{width:46px;height:46px;border-radius:13px}.tray.many .piece canvas{width:38px;height:38px}.tray.many{gap:7px}
.mode.soon{border:2px dashed var(--line);background:transparent;box-shadow:none;justify-content:center;align-items:center;text-align:center;min-height:180px;color:var(--ink-3)}
.intro{font-size:14px;font-weight:700;color:var(--ink-2);margin:0 0 12px;text-align:center}
/* level grid */
.lvls{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.lv{aspect-ratio:1;border-radius:18px;background:var(--card);box-shadow:0 3px 0 var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:18px;font-weight:600}
.lv .leaves i{width:8px;height:8px}
.lv.done{background:#fff}
.lv.next{background:var(--sun);color:#4A3A10;box-shadow:0 3px 0 var(--sun-d);animation:bob 1.4s ease-in-out infinite}
.lv:disabled{opacity:.38;cursor:default}
.lv.chal{background:linear-gradient(160deg,#FFF3C4,#FFD86A);box-shadow:0 3px 0 #D9A520;color:#6A4A00;position:relative}
.lv.chal:after{content:'★';position:absolute;top:3px;right:6px;font-size:12px;color:#C8860A}
.lv.chal.done{background:linear-gradient(160deg,#FFE58A,#FFC23D)}
.lv.chal.next{animation:none}
.lv .lockI{width:14px;height:14px;opacity:.6}
@keyframes bob{50%{transform:translateY(-3px)}}
.tierLabel{grid-column:1/-1;font-size:12px;font-weight:800;letter-spacing:.6px;text-transform:uppercase;color:var(--ink-3);margin:6px 2px -2px}
/* game */
.hud{display:flex;justify-content:center;gap:8px;margin-bottom:4px;flex-wrap:wrap}
.chip{background:var(--card);border-radius:999px;padding:5px 12px;font-size:13.5px;font-weight:800;color:var(--ink-2);box-shadow:0 2px 0 var(--line);display:flex;align-items:center;gap:6px}
.chip b{color:var(--ink)}
.chip.good{background:#E5F6E6;color:var(--leaf-d)}
#boardWrap{flex:1;position:relative;min-height:0}
#board{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
.tray{display:flex;gap:10px;justify-content:center;align-items:center;min-height:70px;background:rgba(255,253,247,.85);border-radius:20px;padding:7px 10px;box-shadow:0 3px 0 var(--line);margin-top:6px;overflow-x:auto}
.tray[hidden]{display:none}
.tray .label{font-family:var(--display);font-size:13px;color:var(--ink-2);font-weight:600;flex:none}
.piece{width:54px;height:54px;border-radius:16px;background:#fff;box-shadow:0 3px 0 var(--line);display:grid;place-items:center;touch-action:none;flex:none}
.piece.sel{box-shadow:0 0 0 3px var(--sun),0 3px 0 var(--line)}
.piece canvas{width:44px;height:44px;pointer-events:none}
.piece.pile{position:relative;width:62px;height:62px;box-shadow:0 3px 0 var(--line),4px -4px 0 -1px #fff,4px -4px 0 0 var(--line)}
.piece .count{position:absolute;right:-6px;top:-8px;background:var(--sun);color:#4A3A10;font-style:normal;font-family:var(--display);font-weight:600;font-size:14px;border-radius:10px;padding:1px 7px;box-shadow:0 0 0 2px #fff}
.actions{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-top:8px}
.act{background:var(--card);border-radius:16px;box-shadow:0 3px 0 var(--line);padding:9px 6px;display:flex;align-items:center;justify-content:center;gap:7px;font-size:16px;font-weight:600;position:relative}
.act svg{width:20px;height:20px}
.act:disabled{opacity:.4}
.act .n{background:var(--sun);color:#4A3A10;border-radius:9px;font-size:12px;padding:1px 7px;font-family:var(--body);font-weight:800}
.tip{position:fixed;left:50%;transform:translateX(-50%);top:calc(118px + env(safe-area-inset-top,0px));z-index:5;background:var(--ink);color:#fff;border-radius:16px;padding:10px 16px;font-size:15px;font-weight:700;max-width:min(330px,calc(100vw - 32px));text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.25);animation:pop .3s cubic-bezier(.2,1.6,.4,1);pointer-events:none;line-height:1.35}
.tip b{color:var(--sun)}
@keyframes pop{from{transform:translateX(-50%) scale(.7);opacity:0}}
/* modal */
.modalWrap{position:fixed;inset:0;z-index:9;background:rgba(30,45,30,.45);display:flex;align-items:center;justify-content:center;padding:16px;animation:fade .2s}
@keyframes fade{from{opacity:0}}
.modal{background:var(--paper);border-radius:28px;width:100%;max-width:350px;padding:22px 20px 20px;display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;box-shadow:0 8px 0 var(--line),0 24px 50px rgba(0,0,0,.3);animation:mpop .35s cubic-bezier(.2,1.6,.4,1);position:relative}
@keyframes mpop{from{transform:scale(.8);opacity:0}}
.modal h2{margin:0;font-family:var(--display);font-size:30px;font-weight:700;color:var(--leaf-d)}
.modal p{margin:0;font-size:15.5px;color:var(--ink-2);font-weight:700;line-height:1.4}
.modal canvas.flower{width:140px;height:120px}
.bigLeaves{display:flex;gap:10px;margin:-2px 0 2px}
.bigLeaves i{width:30px;height:30px;border-radius:0 100% 0 100%;background:#E3D8C1;transform:scale(.6);transition:transform .35s cubic-bezier(.2,1.8,.4,1),background .2s}
.bigLeaves i.on{background:var(--leaf);transform:scale(1)}
.stats{display:flex;gap:10px;width:100%}
.stats div{flex:1;background:#fff;border-radius:14px;padding:8px;box-shadow:0 2px 0 var(--line);font-size:12px;font-weight:800;color:var(--ink-3);text-transform:uppercase;letter-spacing:.5px}
.stats b{display:block;font-family:var(--display);font-size:22px;color:var(--ink);letter-spacing:0;font-weight:600}
.btnRow{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%}
.closeX{position:absolute;top:12px;right:12px;width:36px;height:36px;border-radius:12px;background:#EFE6D2;font-weight:700}
.setRow{display:flex;justify-content:space-between;align-items:center;width:100%;background:#fff;border-radius:14px;padding:10px 12px;box-shadow:0 2px 0 var(--line);font-weight:800}
.toggle{width:52px;height:30px;border-radius:15px;background:#DCCFB5;position:relative;transition:background .2s}
.toggle::after{content:'';position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:left .2s}
.toggle[aria-checked=true]{background:var(--leaf)}.toggle[aria-checked=true]::after{left:25px}
/* my garden */
#gardenScroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;margin:0 -16px;padding:0 16px}
#gardenArt{width:100%;display:block}
.toast{position:fixed;left:50%;top:calc(64px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:10;background:var(--ink);color:#fff;font-weight:700;padding:9px 18px;border-radius:999px;font-size:15px;white-space:nowrap;animation:pop .3s;pointer-events:none;max-width:calc(100vw - 32px);overflow:hidden;text-overflow:ellipsis}
.proto{position:fixed;right:10px;bottom:calc(2px + env(safe-area-inset-bottom,0px));font-size:9px;letter-spacing:1px;color:rgba(46,59,47,.35);font-weight:800;pointer-events:none;z-index:1}
@media (prefers-reduced-motion:reduce){.screen,.lv.next,.modal,.tip,.toast,.modalWrap{animation:none}}
</style>

<div class="screen" id="home">
  <canvas id="homeArt" width="500" height="400" aria-hidden="true"></canvas>
  <div class="logo">Sun<span>sprout</span></div>
  <p class="tag">Bend the sunlight. Wake up the garden.</p>
  <div class="homeBtns">
    <button class="btn" id="playBtn" type="button"><svg viewBox="0 0 24 24"><path d="M8 5.5v13l10.5-6.5z" fill="#fff"/></svg><span class="txt">Continue<span class="sub" id="playSub"></span></span></button>
    <button class="btn soft" id="modesBtn" type="button"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="8" height="8" rx="2.5" fill="#6FBF5E"/><rect x="13" y="3" width="8" height="8" rx="2.5" fill="#F2B33D"/><rect x="3" y="13" width="8" height="8" rx="2.5" fill="#E0784A"/><rect x="13" y="13" width="8" height="8" rx="2.5" fill="#6FA8DC"/></svg><span class="txt">Puzzle gardens<span class="sub" id="modesSub"></span></span></button>
    <button class="btn sun" id="dailyBtn" type="button"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="5" fill="#fff"/><g stroke="#fff" stroke-width="2.2" stroke-linecap="round"><path d="M12 2.5v2.5M12 19v2.5M2.5 12H5M19 12h2.5M5.3 5.3l1.8 1.8M16.9 16.9l1.8 1.8M5.3 18.7l1.8-1.8M16.9 7.1l1.8-1.8"/></g></svg><span class="txt">Daily puzzle<span class="sub" id="dailySub"></span></span></button>
    <button class="btn soft" id="gardenBtn" type="button"><svg viewBox="0 0 24 24"><path d="M12 21v-8" stroke="#3E9E5C" stroke-width="2.2" stroke-linecap="round"/><path d="M12 14c-4 0-6-3-6-6 3 0 6 2 6 6zM12 12c0-4 3-6 6-6 0 3-2 6-6 6z" fill="#4CAF6A"/><circle cx="12" cy="7" r="3" fill="#FF8FB1"/></svg><span class="txt">My garden<span class="sub" id="gardenSub2"></span></span></button>
  </div>
  <div class="corner"><button class="iconBtn" id="setBtn" type="button" aria-label="Settings"><svg viewBox="0 0 24 24"><path d="M12 8.5a3.5 3.5 0 1 0 0 7 3.5 3.5 0 0 0 0-7z" fill="none" stroke="currentColor" stroke-width="2"/><path d="M19.4 13.5l1.6 1.2-1.8 3.1-1.9-.7a7.6 7.6 0 0 1-1.9 1.1l-.3 2h-3.6l-.3-2a7.6 7.6 0 0 1-1.9-1.1l-1.9.7L3 14.7l1.6-1.2a7.4 7.4 0 0 1 0-2.9L3 9.4l1.8-3.1 1.9.7a7.6 7.6 0 0 1 1.9-1.1l.3-2h3.6l.3 2a7.6 7.6 0 0 1 1.9 1.1l1.9-.7 1.8 3.1-1.6 1.2a7.4 7.4 0 0 1 0 2.9z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg></button></div>
</div>

<div class="screen" id="modes" hidden>
  <div class="bar"><button class="iconBtn" data-go="home" type="button" aria-label="Back"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button><h2>Puzzle gardens<small id="modesTotal"></small></h2><span class="spacer"></span></div>
  <div class="scroll"><p class="intro">Each garden is a different way to bend the light. Pick one!</p><div class="modes" id="modeGrid"></div></div>
</div>

<div class="screen" id="levels" hidden>
  <div class="bar"><button class="iconBtn" data-go="modes" type="button" aria-label="Back"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button><h2 id="lvHead">Levels</h2><span class="spacer"></span></div>
  <div class="scroll"><div class="lvls" id="lvGrid"></div></div>
</div>

<div class="screen" id="game" hidden>
  <div class="bar">
    <button class="iconBtn" id="backBtn" type="button" aria-label="Back to levels"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    <h2 id="lvTitle">Level</h2><span class="spacer"></span>
  </div>
  <div class="hud"><span class="chip" id="potChip"></span><span class="chip" id="moveChip"></span></div>
  <div id="boardWrap"><canvas id="board" aria-label="Puzzle board"></canvas></div>
  <div class="tray" id="tray" hidden></div>
  <div class="actions">
    <button class="act" id="undoBtn" type="button"><svg viewBox="0 0 24 24"><path d="M9 7L4 12l5 5M4.5 12H15a5 5 0 0 1 0 10h-2" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/></svg>Undo</button>
    <button class="act" id="resetBtn" type="button"><svg viewBox="0 0 24 24"><path d="M5 12a7 7 0 1 0 2.2-5.1M5 4v4h4" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/></svg>Restart</button>
    <button class="act" id="hintBtn" type="button"><svg viewBox="0 0 24 24"><path d="M12 3a6 6 0 0 0-3.5 10.9V16h7v-2.1A6 6 0 0 0 12 3z" fill="#FFC83D" stroke="#B88A12" stroke-width="1.4"/><rect x="9" y="17.5" width="6" height="2.5" rx="1" fill="#B88A12"/></svg>Hint<span class="n" id="hintN">3</span></button>
  </div>
</div>

<div class="screen" id="garden" hidden>
  <div class="bar"><button class="iconBtn" data-go="home" type="button" aria-label="Back"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button><h2>My garden<small id="gardenSub"></small></h2><span class="spacer"></span></div>
  <div id="gardenScroll"><canvas id="gardenArt" aria-label="Your garden: a plant for every puzzle you solved"></canvas></div>
</div>

<script>
(() => {
const $ = id => document.getElementById(id);
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

// ================= PUZZLE ENGINE =================
// The board is a grid. Suns shine a beam in one direction. Mirrors ("/" = o 0, "\" = o 1) turn it,
// crystals split it in two, coloured glass tints it, rocks block it. A seed pot drinks every beam that
// reaches it and needs exactly the number shown, in its own colour. Too much (or the wrong colour) wilts it.
const DX = [1, 0, -1, 0], DY = [0, 1, 0, -1];          // 0 right, 1 down, 2 left, 3 up
const MIR = [[3, 2, 1, 0], [1, 0, 3, 2]];              // new direction after a mirror, by orientation
function rng(seed){ let s = (seed >>> 0) || 1; return () => { s ^= s << 13; s >>>= 0; s ^= s >>> 17; s ^= s << 5; s >>>= 0; return s / 4294967296; }; }
function hashStr(str){ let h = 2166136261; for (const ch of str) { h ^= ch.charCodeAt(0); h = Math.imul(h, 16777619); } return h >>> 0; }

function simulate(b){
  const hits = new Map(), segs = [], seen = new Set(), q = [], twin = portalTwins(b.g);
  b.g.forEach((p, i) => { if (p && p.t === 'sun') q.push({ x: i % b.w, y: (i / b.w) | 0, d: p.d, c: 'w' }); });
  let guard = 0;
  while (q.length && guard++ < 300) {
    let { x, y, d, c } = q.shift(); let pts = [[x, y]], end = 'edge';
    for (let step = 0; step < 400; step++) {
      const nx = x + DX[d], ny = y + DY[d];
      if (nx < 0 || ny < 0 || nx >= b.w || ny >= b.h) { pts.push([x + DX[d] * .5, y + DY[d] * .5]); end = 'edge'; break; }
      x = nx; y = ny;
      const key = (y * b.w + x) * 16 + d * 4 + 'wrby'.indexOf(c); if (seen.has(key)) { pts.push([x, y]); end = 'loop'; break; } seen.add(key);
      const p = b.g[y * b.w + x];
      if (!p) continue;
      if (p.t === 'mirror') { pts.push([x, y]); d = MIR[p.o][d]; continue; }
      if (p.t === 'portal') { pts.push([x, y]); segs.push({ pts, c, end: 'portal' }); const j = twin[y * b.w + x]; x = j % b.w; y = (j / b.w) | 0; pts = [[x, y]]; continue; }
      if (p.t === 'filter') { if (c !== p.c) { pts.push([x, y]); segs.push({ pts, c, end: 'filter' }); pts = [[x, y]]; c = p.c; } continue; }
      if (p.t === 'split') { pts.push([x, y]); q.push({ x, y, d: (d + 1) % 4, c }, { x, y, d: (d + 3) % 4, c }); end = 'split'; break; }
      if (p.t === 'seed') { pts.push([x, y]); const i = y * b.w + x; if (!hits.has(i)) hits.set(i, []); hits.get(i).push(c); end = 'seed'; break; }
      pts.push([x - DX[d] * .5, y - DY[d] * .5]); end = 'block'; break;   // rock or sun
    }
    segs.push({ pts, c, end });
  }
  return { hits, segs };
