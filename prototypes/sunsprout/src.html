<title>Sunsprout</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800&display=swap">
<style>
/* Sunsprout: a calm light puzzle. Portrait, one screen at a time: home, level map, puzzle, garden.
   Soft garden palette: cream paper, leaf green, sun yellow, terracotta pots. */
:root{
  --paper:#FFF8EC; --paper-2:#F5EBD8; --ink:#2E3B2F; --ink-2:#5E6B5A; --leaf:#4CAF6A; --leaf-d:#2E8A4C; --sun:#FFC83D; --sun-d:#E0A21A;
  --pot:#D9774E; --pot-d:#B25A35; --line:#E6D9BF; --sky:#EAF7E1;
  --display:"Fredoka","Arial Rounded MT Bold","Trebuchet MS",sans-serif; --body:"Nunito",system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--sky);font-family:var(--body);color:var(--ink);overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;transition:background .4s}
button{font-family:var(--display);color:inherit;cursor:pointer;border:0}
button:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
.screen{position:fixed;inset:0;display:flex;flex-direction:column;padding:calc(12px + env(safe-area-inset-top,0px)) 16px calc(14px + env(safe-area-inset-bottom,0px))}
.screen[hidden]{display:none}
/* home */
#home{align-items:center;justify-content:center;gap:14px;text-align:center}
#homeArt{width:220px;height:200px}
.logo{font-family:var(--display);font-weight:700;font-size:clamp(46px,14vw,64px);line-height:.95;color:var(--leaf-d);letter-spacing:-.5px}
.logo span{color:var(--sun-d)}
.tag{font-size:16px;color:var(--ink-2);font-weight:700;max-width:28ch;line-height:1.35;margin:0}
.btn{font-weight:700;font-size:21px;border-radius:18px;padding:13px 28px;background:var(--leaf);color:#fff;box-shadow:0 5px 0 var(--leaf-d);min-width:230px;display:flex;align-items:center;justify-content:center;gap:10px}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--leaf-d)}
.btn.sun{background:var(--sun);color:#4A3A10;box-shadow:0 5px 0 var(--sun-d)}
.btn.soft{background:#fff;color:var(--ink);box-shadow:0 5px 0 var(--line)}
.btn small{font-family:var(--body);font-size:13px;font-weight:800;opacity:.85}
.row{display:flex;gap:10px;align-items:center}
.iconBtn{width:44px;height:44px;border-radius:50%;background:#fff;box-shadow:0 3px 0 var(--line);display:grid;place-items:center;position:relative;flex:none}
.iconBtn svg{width:22px;height:22px}
.iconBtn .n{position:absolute;right:-4px;top:-4px;min-width:19px;height:19px;border-radius:10px;background:var(--sun);color:#4A3A10;font-size:11px;font-weight:700;display:grid;place-items:center;padding:0 4px;box-shadow:0 0 0 2px #fff}
.homeCorner{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));right:16px}
/* top bar */
.bar{display:flex;align-items:center;gap:10px;min-height:48px}
.bar h2{flex:1;margin:0;font-family:var(--display);font-weight:600;font-size:19px;line-height:1.1;text-align:center}
.bar h2 small{display:block;font-family:var(--body);font-size:12px;color:var(--ink-2);font-weight:800;letter-spacing:.5px;text-transform:uppercase}
/* level map */
.scroll{flex:1;overflow-y:auto;padding:4px 2px 20px;-webkit-overflow-scrolling:touch}
.world{background:rgba(255,255,255,.75);border-radius:22px;padding:14px 14px 16px;margin:12px 0;box-shadow:0 4px 0 rgba(0,0,0,.06)}
.world h3{margin:0;font-family:var(--display);font-size:20px;font-weight:600;display:flex;align-items:center;gap:8px}
.world h3 i{width:14px;height:14px;border-radius:50%;display:inline-block}
.world p{margin:2px 0 10px;color:var(--ink-2);font-size:14px;font-weight:700}
.lvls{display:grid;grid-template-columns:repeat(5,1fr);gap:9px}
.lv{aspect-ratio:1;border-radius:50%;font-size:17px;font-weight:600;background:#fff;box-shadow:0 3px 0 var(--line);display:grid;place-items:center;position:relative}
.lv.done{background:var(--leaf);color:#fff;box-shadow:0 3px 0 var(--leaf-d)}
.lv.next{background:var(--sun);color:#4A3A10;box-shadow:0 3px 0 var(--sun-d);animation:bob 1.4s ease-in-out infinite}
.lv:disabled{opacity:.4;cursor:default}
@keyframes bob{50%{transform:translateY(-3px)}}
/* game */
#boardWrap{flex:1;position:relative;min-height:0}
#board{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
.status{text-align:center;font-weight:800;font-size:14px;color:var(--ink-2);min-height:20px;margin:4px 0}
.tray{display:flex;gap:10px;justify-content:center;align-items:center;min-height:74px;background:rgba(255,255,255,.7);border-radius:20px;padding:8px 10px;box-shadow:0 3px 0 rgba(0,0,0,.05)}
.tray[hidden]{display:none}
.tray .label{font-family:var(--display);font-size:13px;color:var(--ink-2);font-weight:600;writing-mode:initial;margin-right:2px}
.piece{width:56px;height:56px;border-radius:16px;background:#fff;box-shadow:0 3px 0 var(--line);display:grid;place-items:center;touch-action:none;padding:0}
.piece.sel{box-shadow:0 0 0 3px var(--sun),0 3px 0 var(--line)}
.piece canvas{width:46px;height:46px;pointer-events:none}
.tip{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(100px + env(safe-area-inset-bottom,0px));z-index:5;background:var(--ink);color:#fff;border-radius:16px;padding:10px 16px;font-size:15px;font-weight:700;max-width:min(330px,calc(100vw - 32px));text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.25);animation:pop .3s cubic-bezier(.2,1.6,.4,1);pointer-events:none;line-height:1.35}
.tip b{color:var(--sun)}
@keyframes pop{from{transform:translateX(-50%) scale(.7);opacity:0}}
/* modal */
.modalWrap{position:fixed;inset:0;z-index:9;background:rgba(30,45,30,.45);display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:var(--paper);border-radius:26px;width:100%;max-width:350px;padding:22px 20px;display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;box-shadow:0 8px 0 var(--line),0 24px 50px rgba(0,0,0,.3);animation:mpop .35s cubic-bezier(.2,1.6,.4,1)}
@keyframes mpop{from{transform:scale(.75);opacity:0}}
.modal h2{margin:0;font-family:var(--display);font-size:30px;font-weight:700;color:var(--leaf-d)}
.modal p{margin:0;font-size:16px;color:var(--ink-2);font-weight:700;line-height:1.4}
.modal canvas{width:150px;height:130px}
/* garden */
#gardenArt{flex:1;width:100%;min-height:0}
.toast{position:fixed;left:50%;top:calc(70px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:10;background:var(--ink);color:#fff;font-weight:700;padding:9px 18px;border-radius:999px;font-size:15px;white-space:nowrap;animation:pop .3s;pointer-events:none}
.proto{position:fixed;right:10px;bottom:calc(4px + env(safe-area-inset-bottom,0px));font-size:10px;letter-spacing:1px;color:rgba(46,59,47,.45);font-weight:800;pointer-events:none}
@media (prefers-reduced-motion:reduce){.lv.next,.modal,.tip,.toast{animation:none}}
</style>

<div class="screen" id="home">
  <canvas id="homeArt" width="440" height="400" aria-hidden="true"></canvas>
  <div class="logo">Sun<span>sprout</span></div>
  <p class="tag">Bend the sunlight. Wake up the garden.</p>
  <button class="btn" id="playBtn" type="button">Play<small id="playSub"></small></button>
  <button class="btn sun" id="dailyBtn" type="button">Daily puzzle<small id="dailySub"></small></button>
  <div class="row"><button class="btn soft" id="gardenBtn" type="button" style="min-width:110px">Garden</button><button class="btn soft" id="levelsBtn" type="button" style="min-width:110px">Levels</button></div>
  <div class="homeCorner"><button class="iconBtn" id="muteBtn" type="button" aria-label="Sound on"><svg viewBox="0 0 24 24"><path d="M4 9.5h3.5L12.5 5v14l-5-4.5H4z" fill="currentColor"/><path id="waves" d="M15.5 9a4 4 0 010 6M18 6.5a7.5 7.5 0 010 11" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button></div>
</div>

<div class="screen" id="map" hidden>
  <div class="bar"><button class="iconBtn" data-go="home" type="button" aria-label="Back"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button><h2>Levels<small id="mapSub"></small></h2><span style="width:44px"></span></div>
  <div class="scroll" id="worlds"></div>
</div>

<div class="screen" id="game" hidden>
  <div class="bar">
    <button class="iconBtn" id="backBtn" type="button" aria-label="Back to levels"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    <h2 id="lvTitle">Level</h2>
    <button class="iconBtn" id="resetBtn" type="button" aria-label="Start over"><svg viewBox="0 0 24 24"><path d="M5 12a7 7 0 1 0 2.2-5.1M5 4v4h4" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    <button class="iconBtn" id="hintBtn" type="button" aria-label="Hint"><svg viewBox="0 0 24 24"><path d="M12 3a6 6 0 0 0-3.5 10.9V16h7v-2.1A6 6 0 0 0 12 3z" fill="#FFC83D" stroke="#B88A12" stroke-width="1.4"/><rect x="9" y="17.5" width="6" height="2.5" rx="1" fill="#B88A12"/></svg><i class="n" id="hintN">3</i></button>
  </div>
  <div class="status" id="status"></div>
  <div id="boardWrap"><canvas id="board" aria-label="Puzzle board"></canvas></div>
  <div class="tray" id="tray" hidden></div>
</div>

<div class="screen" id="garden" hidden>
  <div class="bar"><button class="iconBtn" data-go="home" type="button" aria-label="Back"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button><h2>My garden<small id="gardenSub"></small></h2><span style="width:44px"></span></div>
  <canvas id="gardenArt" aria-label="Your garden"></canvas>
</div>
<div class="proto">PROTOTYPE</div>

<script>
(() => {
const $ = id => document.getElementById(id);
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

// ================= PUZZLE ENGINE =================
// The board is a grid. Suns shine a beam in one direction. Mirrors ("/" = o 0, "\" = o 1) turn it,
// crystals split it in two, coloured glass tints it, rocks block it. A seed pot drinks every beam that
// reaches it and needs exactly the number shown, in its own colour. Too much (or the wrong colour) wilts it.
const DX = [1, 0, -1, 0], DY = [0, 1, 0, -1];          // 0 right, 1 down, 2 left, 3 up
const MIR = [[3, 2, 1, 0], [1, 0, 3, 2]];              // new direction after a mirror, by orientation
function rng(seed){ let s = (seed >>> 0) || 1; return () => { s ^= s << 13; s >>>= 0; s ^= s >>> 17; s ^= s << 5; s >>>= 0; return s / 4294967296; }; }
function hashStr(str){ let h = 2166136261; for (const ch of str) { h ^= ch.charCodeAt(0); h = Math.imul(h, 16777619); } return h >>> 0; }

function simulate(b){
  const hits = new Map(), segs = [], seen = new Set(), q = [];
  b.g.forEach((p, i) => { if (p && p.t === 'sun') q.push({ x: i % b.w, y: (i / b.w) | 0, d: p.d, c: 'w' }); });
  let guard = 0;
  while (q.length && guard++ < 300) {
    let { x, y, d, c } = q.shift(); let pts = [[x, y]], end = 'edge';
    for (let step = 0; step < 400; step++) {
      const nx = x + DX[d], ny = y + DY[d];
      if (nx < 0 || ny < 0 || nx >= b.w || ny >= b.h) { pts.push([x + DX[d] * .5, y + DY[d] * .5]); end = 'edge'; break; }
      x = nx; y = ny;
      const key = (y * b.w + x) * 16 + d * 4 + 'wrby'.indexOf(c); if (seen.has(key)) { pts.push([x, y]); end = 'loop'; break; } seen.add(key);
      const p = b.g[y * b.w + x];
      if (!p) continue;
      if (p.t === 'mirror') { pts.push([x, y]); d = MIR[p.o][d]; continue; }
      if (p.t === 'filter') { if (c !== p.c) { pts.push([x, y]); segs.push({ pts, c, end: 'filter' }); pts = [[x, y]]; c = p.c; } continue; }
      if (p.t === 'split') { pts.push([x, y]); q.push({ x, y, d: (d + 1) % 4, c }, { x, y, d: (d + 3) % 4, c }); end = 'split'; break; }
      if (p.t === 'seed') { pts.push([x, y]); const i = y * b.w + x; if (!hits.has(i)) hits.set(i, []); hits.get(i).push(c); end = 'seed'; break; }
      pts.push([x - DX[d] * .5, y - DY[d] * .5]); end = 'block'; break;   // rock or sun
    }
    segs.push({ pts, c, end });
  }
  return { hits, segs };
}
function judge(b, sim){
  let solved = true, seeds = 0; const st = new Map();
  b.g.forEach((p, i) => { if (!p || p.t !== 'seed') return; seeds++;
    const h = sim.hits.get(i) || [], good = h.filter(c => c === p.c).length, bad = h.length - good;
    const s = bad > 0 || good > p.need ? 'wilt' : good === p.need ? 'happy' : 'thirsty';
    st.set(i, { s, good, bad }); if (s !== 'happy') solved = false; });
  return { solved: solved && seeds > 0, st };
}
const cloneBoard = b => ({ w: b.w, h: b.h, g: b.g.map(p => p && { ...p }), tray: (b.tray || []).map(p => ({ ...p })) });

// ---------- Level generator: build a working garden first, then take it apart ----------
function tryGen(spec, r){
  const { w, h } = spec, g = Array(w * h).fill(null), used = new Uint8Array(w * h);
  const ri = (a, b) => a + Math.floor(r() * (b - a + 1)), inb = (x, y) => x >= 0 && y >= 0 && x < w && y < h, I = (x, y) => y * w + x;
  const cols = (spec.colors || []).slice(); let filtersLeft = spec.filters || 0, splitsLeft = spec.splits || 0;
  const pathMirrors = [];
  function endSeed(x, y, d, col){
    // sometimes aim at a seed that's already there, so it needs two beams
    if (spec.merge && r() < spec.merge) { let cx = x, cy = y; for (let k = 0; k < 8; k++) { cx += DX[d]; cy += DY[d]; if (!inb(cx, cy)) break; const p = g[I(cx, cy)]; if (p) { if (p.t === 'seed' && p.c === col) { for (let m = 1; m < k + 1; m++) used[I(x + DX[d] * m, y + DY[d] * m)] = 1; return true; } break; } } }
    if (used[I(x, y)] || g[I(x, y)]) return false;
    g[I(x, y)] = { t: 'seed', need: 0, c: col }; used[I(x, y)] = 1; return true;
  }
  function walk(x, y, d, turns, col, depth){
    if (depth > 12) return false;
    let run = ri(1, Math.max(1, Math.floor((d % 2 ? h : w) * .6)));
    for (let steps = 1; ; steps++) {
      const nx = x + DX[d], ny = y + DY[d];
      if (!inb(nx, ny)) return false;
      const np = g[I(nx, ny)];
      if (np) { if (np.t === 'seed' && np.c === col && turns === 0) return true; return false; }
      x = nx; y = ny;
      const blockedAhead = !inb(x + DX[d], y + DY[d]) || !!g[I(x + DX[d], y + DY[d])];
      if ((steps >= run || blockedAhead) && !used[I(x, y)]) {
        if (filtersLeft > 0 && cols.length && col === 'w' && r() < .5 && !blockedAhead) { g[I(x, y)] = { t: 'filter', c: col = cols.shift() }; used[I(x, y)] = 1; filtersLeft--; run = steps + ri(1, 3); continue; }
        if (splitsLeft > 0 && turns > 0 && r() < .55) {
          const a = (d + 1) % 4, b2 = (d + 3) % 4;
          if (inb(x + DX[a], y + DY[a]) && inb(x + DX[b2], y + DY[b2])) { splitsLeft--; g[I(x, y)] = { t: 'split' }; used[I(x, y)] = 1;
            const t1 = Math.max(0, Math.ceil((turns - 1) / 2)), t2 = Math.max(0, turns - 1 - t1);
            return walk(x, y, a, t1, col, depth + 1) && walk(x, y, b2, t2, col, depth + 1); }
        }
        if (turns > 0) {
          const opts = [(d + 1) % 4, (d + 3) % 4].sort(() => r() - .5).filter(nd => inb(x + DX[nd], y + DY[nd]) && !g[I(x + DX[nd], y + DY[nd])]);
          if (opts.length) { const nd = opts[0], o = MIR[0][d] === nd ? 0 : 1; const m = { t: 'mirror', o }; g[I(x, y)] = m; used[I(x, y)] = 1; pathMirrors.push(m); return walk(x, y, nd, turns - 1, col, depth + 1); }
          if (blockedAhead) return false;
          continue;
        }
        return endSeed(x, y, d, col);
      }
      if (blockedAhead) return false;
      used[I(x, y)] = 1;
    }
  }
  // suns on the edge, shining inward
  for (let s = 0; s < spec.suns; s++) {
    let ok = false;
    for (let t = 0; t < 30 && !ok; t++) {
      const side = ri(0, 3); let x, y, d;
      if (side === 0) { x = 0; y = ri(0, h - 1); d = 0; } else if (side === 1) { x = w - 1; y = ri(0, h - 1); d = 2; } else if (side === 2) { x = ri(0, w - 1); y = 0; d = 1; } else { x = ri(0, w - 1); y = h - 1; d = 3; }
      if (g[I(x, y)] || used[I(x, y)] || !inb(x + DX[d], y + DY[d]) || g[I(x + DX[d], y + DY[d])]) continue;
      g[I(x, y)] = { t: 'sun', d }; used[I(x, y)] = 1; ok = walk(x, y, d, ri(spec.turns[0], spec.turns[1]), 'w', 0);
      if (!ok) return null;
    }
    if (!ok) return null;
  }
  if (filtersLeft > 0 && (spec.filters || 0) > 0 && filtersLeft === spec.filters) return null;   // colour levels must use colour
  if (splitsLeft === spec.splits && spec.splits > 0) return null;
  // the finished garden must work: every beam lands in a seed, every seed gets light
  const sol = { w, h, g, tray: [] }, sim = simulate(sol);
  if (sim.segs.some(s => s.end !== 'seed' && s.end !== 'split' && s.end !== 'filter')) return null;
  let seeds = 0; g.forEach((p, i) => { if (p && p.t === 'seed') { const hh = sim.hits.get(i) || []; if (!hh.length || hh.some(c => c !== p.c)) seeds = -99; p.need = hh.length; seeds++; } });
  if (seeds < 1 || !judge(sol, sim).solved) return null;
  if (spec.needTwo && !g.some(p => p && p.t === 'seed' && p.need >= 2)) return null;
  if (pathMirrors.length < (spec.minMirrors || 1)) return null;
  // decoys on cells no beam uses
  const free = () => { const f = []; for (let i = 0; i < w * h; i++) if (!g[i] && !used[i]) f.push(i); return f; };
  for (let k = 0; k < (spec.rocks || 0); k++) { const f = free(); if (f.length) g[f[ri(0, f.length - 1)]] = { t: 'rock' }; }
  const decoys = [];
  for (let k = 0; k < (spec.decoys || 0); k++) { const f = free(); if (f.length) { const m = { t: 'mirror', o: ri(0, 1), decoy: true }; g[f[ri(0, f.length - 1)]] = m; decoys.push(m); } }
  if (!judge(sol, simulate(sol)).solved) return null;
  return makePuzzle(sol, pathMirrors, decoys, spec, r);
}
function makePuzzle(sol, pathMirrors, decoys, spec, r){
  const nFixed = Math.floor(pathMirrors.length * (spec.fixedFrac || 0));
  const order = pathMirrors.slice().sort(() => r() - .5), fixed = new Set(order.slice(0, nFixed));
  pathMirrors.forEach(m => { m.sol = m.o; if (fixed.has(m)) m.fixed = true; });
  decoys.forEach(m => { m.sol = m.o; m.fixed = true; });   // decoys never turn: they just catch stray light
  const b = cloneBoard(sol);
  const idx = []; b.g.forEach((p, i) => { if (p && p.t === 'mirror') idx.push(i); });
  if (spec.mode === 'place') {
    // take the moving mirrors off the board: they go in the basket
    const moving = idx.filter(i => !b.g[i].fixed && !b.g[i].decoy);
    if (!moving.length) return null;
    b.solution = moving.map(i => ({ i, o: b.g[i].o }));
    b.tray = moving.map(i => ({ t: 'mirror', o: Math.floor(r() * 2), movable: true }));
    moving.forEach(i => { b.g[i] = null; });
    b.g.forEach(p => { if (p && p.t === 'mirror') p.fixed = true; });     // everything left on the board stays put
    b.mode = 'place';
    if (judge(b, simulate(b)).solved) return null;
    return b;
  }
  // rotate mode: find every orientation that works, then scramble far from them
  const rot = idx.filter(i => !b.g[i].fixed);
  if (rot.length > 15 || rot.length < 1) return null;
  const sols = [];
  for (let mask = 0; mask < (1 << rot.length); mask++) {
    rot.forEach((i, k) => { b.g[i].o = (mask >> k) & 1; });
    if (judge(b, simulate(b)).solved) { sols.push(mask); if (sols.length > (spec.maxSol || 2)) return null; }
  }
  if (!sols.length) return null;
  let best = null, bestD = -1;
  for (let t = 0; t < 40; t++) {
    const m = Math.floor(r() * (1 << rot.length)); let dmin = 99;
    for (const s of sols) { let x = m ^ s, c = 0; while (x) { c += x & 1; x >>= 1; } dmin = Math.min(dmin, c); }
    if (dmin > bestD) { bestD = dmin; best = m; }
  }
  if (bestD < (spec.minFlips || 1)) return null;
  rot.forEach((i, k) => { b.g[i].o = (best >> k) & 1; b.g[i].sol = (sols[0] >> k) & 1; });
  b.mode = 'rotate'; b.par = bestD;
  return b;
