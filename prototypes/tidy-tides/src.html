<title>Tidy Tides</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap">
<style>
/* Layout: full-screen top-down coast that scrolls sideways through three areas (Sunny Beach, Old Pier,
   Lighthouse Cove). HUD floats on top: coins, area health, gift / wardrobe / sound; goal card bottom-left;
   bottom sheets for upgrades; spotlight tutorial. Single deliberate sunny look. */
:root{
  --sea:#2FB8C9; --sea-deep:#1C7F9A; --sand:#F4D9A0; --coral:#FF7A6B; --coral-d:#D9544A;
  --ink:#16324A; --ink-2:#4F6B80; --paper:#FFF8EC; --line:#E8DCC4; --leaf:#4CC38A; --gold:#FFC83D; --gold-d:#D99A12;
  --display:"Fredoka","Arial Rounded MT Bold","Trebuchet MS",sans-serif;
  color-scheme:light;
}
html,body{height:100%;margin:0}
body{background:#1C7F9A;font-family:var(--display);overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;color:var(--ink)}
button{font-family:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
#game{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.hud{position:fixed;left:0;right:0;top:0;padding:calc(8px + env(safe-area-inset-top,0px)) 10px 0;display:flex;gap:7px;align-items:center;pointer-events:none;z-index:2;max-width:560px;margin:0 auto}
.pill{pointer-events:auto;display:flex;align-items:center;gap:5px;background:rgba(255,255,255,.94);border-radius:999px;padding:5px 10px 5px 5px;font-weight:700;font-size:18px;box-shadow:0 3px 0 rgba(22,50,74,.18);font-variant-numeric:tabular-nums;flex:none}
.coin{width:24px;height:24px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#FFE58A,var(--gold) 55%,var(--gold-d));box-shadow:inset 0 0 0 2px rgba(150,95,0,.35);flex:none;display:inline-block}
.coin.sm{width:16px;height:16px;vertical-align:-3px}
.health{background:rgba(255,255,255,.94);border-radius:14px;padding:4px 9px 5px;box-shadow:0 3px 0 rgba(22,50,74,.18);min-width:0;flex:1}
.health .row{display:flex;justify-content:space-between;gap:6px;font-size:12px;font-weight:600;color:var(--ink-2);white-space:nowrap}
.health .row b{color:var(--ink)}
.health .bar{height:7px;background:#E2EEF2;border-radius:999px;margin-top:3px;overflow:hidden}
.health .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#8BD3A5,var(--leaf));border-radius:999px;transition:width .4s}
.health .next{font-size:10.5px;line-height:13px;min-height:13px;color:var(--ink-2);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.side{display:flex;gap:5px;flex:none;pointer-events:auto}
.iconBtn{position:relative;width:34px;height:34px;border-radius:50%;border:0;background:rgba(255,255,255,.94);box-shadow:0 3px 0 rgba(22,50,74,.18);display:grid;place-items:center;padding:0}
.iconBtn svg{width:20px;height:20px}
.iconBtn .cnt{position:absolute;bottom:-4px;right:-5px;min-width:17px;height:15px;padding:0 3px;box-sizing:border-box;border-radius:8px;background:var(--ink);color:#fff;font-size:10px;font-weight:700;font-style:normal;display:grid;place-items:center;box-shadow:0 0 0 2px #fff}
.star{display:inline-block;width:22px;height:22px;background:var(--gold);clip-path:polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%);flex:none}
.star.sm{width:16px;height:16px;vertical-align:-3px}
.modal .amt .star{width:38px;height:38px}
.modal .list{width:100%;max-height:52vh;text-align:left}
.keep{display:grid;grid-template-columns:1fr 1fr;gap:8px;width:100%;text-align:left}
.keep div{background:#fff;border-radius:12px;padding:8px 10px;font-size:13px;line-height:1.35;color:var(--ink-2);font-weight:500;box-shadow:0 2px 0 var(--line)}
.keep b{display:block;color:var(--ink);font-size:13px;margin-bottom:2px}
.twist{background:#FFF1C2;border-radius:12px;padding:8px 10px;width:100%;box-sizing:border-box}
.oneway{background:#FFE6E2;border-radius:12px;padding:8px 10px;width:100%;box-sizing:border-box;color:#8A2E26!important}.oneway b{color:#B23A30}
.btn.ghost{background:none;box-shadow:none;color:var(--ink-2);font-size:17px;padding:6px 20px}
.buy.stars{background:linear-gradient(#FFF3B8,#FFD65A)}
.coastTag{color:#FFE58A;font-weight:700;font-size:16px;letter-spacing:.5px}
.iconBtn .dot{position:absolute;top:1px;right:1px;width:11px;height:11px;border-radius:50%;background:var(--coral);box-shadow:0 0 0 2px #fff}
.goal{position:fixed;left:10px;right:10px;top:calc(var(--hudb,60px) + 6px);z-index:2;max-width:540px;margin:0 auto;box-sizing:border-box;background:rgba(255,255,255,.93);border-radius:13px;padding:6px 10px 7px;box-shadow:0 3px 0 rgba(22,50,74,.18);display:grid;grid-template-columns:auto 1fr auto;gap:3px 7px;align-items:center;min-height:40px}
.goal small{font-size:10px;letter-spacing:.8px;text-transform:uppercase;color:#fff;background:var(--ink-2);border-radius:6px;padding:1px 5px;font-weight:600}
.goal b{font-size:14px;line-height:1.15;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.goal .rw{display:flex;align-items:center;gap:3px;font-weight:700;font-size:13.5px;color:#8A5A00;white-space:nowrap}
.goal .gbar{grid-column:1/-1;height:6px;background:#EDE5D3;border-radius:999px;overflow:hidden}
.goal .gbar i{display:block;height:100%;background:var(--gold);border-radius:999px;transition:width .3s}
.goal button{grid-column:1/-1;border:0;border-radius:10px;padding:5px;font-weight:700;font-size:15px;color:#fff;background:linear-gradient(#7BE8A8,#2BAE66);box-shadow:0 3px 0 #1F8A50;animation:pulse 1s ease-in-out infinite;display:flex;align-items:center;justify-content:center;gap:5px}
@keyframes pulse{50%{transform:scale(1.04)}}
.toast{position:fixed;left:50%;top:calc(var(--hudb,60px) + 58px);transform:translateX(-50%);z-index:6;background:var(--ink);color:#fff;font-weight:600;font-size:17px;padding:9px 18px;border-radius:999px;box-shadow:0 8px 20px rgba(0,0,0,.25);white-space:nowrap;pointer-events:none;animation:pop .35s cubic-bezier(.2,1.6,.4,1);max-width:calc(100vw - 32px);overflow:hidden;text-overflow:ellipsis}
@keyframes pop{from{transform:translateX(-50%) scale(.6);opacity:0}to{transform:translateX(-50%) scale(1);opacity:1}}
.overlay{position:fixed;inset:0;z-index:8;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center;padding:24px;background:linear-gradient(rgba(28,127,154,.55),rgba(22,50,74,.78))}
.logo{font-weight:700;font-size:clamp(52px,16vw,76px);line-height:.9;color:#fff;text-shadow:0 5px 0 var(--sea-deep),0 12px 30px rgba(0,0,0,.3);transform:rotate(-3deg)}
.logo span{display:block;color:var(--gold)}
.tag{color:#fff;font-size:18px;font-weight:500;max-width:28ch;line-height:1.3}
.btn{font-family:var(--display);font-weight:700;font-size:22px;border:0;border-radius:18px;padding:12px 34px;color:#fff;background:linear-gradient(#FF9A8C,var(--coral) 60%,var(--coral-d));box-shadow:0 5px 0 #A83A33,0 10px 20px rgba(0,0,0,.2)}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 #A83A33}
.btn.green{background:linear-gradient(#7BE8A8,#2BAE66);box-shadow:0 5px 0 #1F8A50}
.btn.big{font-size:28px;padding:14px 50px}
.modalWrap{position:fixed;inset:0;z-index:9;background:rgba(10,35,55,.55);display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:var(--paper);border-radius:24px;width:100%;max-width:360px;padding:20px;display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;box-shadow:0 8px 0 var(--line),0 24px 50px rgba(0,0,0,.4);animation:mpop .3s cubic-bezier(.2,1.6,.4,1);position:relative}
@keyframes mpop{from{transform:scale(.75);opacity:0}}
.modal h2{margin:0;font-size:26px;font-weight:700;line-height:1.1}
.modal p{margin:0;font-size:15px;line-height:1.4;color:var(--ink-2);font-weight:500}
.modal .amt{display:flex;align-items:center;gap:8px;font-size:40px;font-weight:700;color:#8A5A00}
.modal .amt .coin{width:36px;height:36px}
.closeX{position:absolute;top:10px;right:10px;width:34px;height:34px;border-radius:50%;border:0;background:#EFE4CE;font-weight:700;font-size:16px}
.streak{display:flex;gap:5px}
.streak span{width:30px;height:30px;border-radius:9px;background:#EFE4CE;display:grid;place-items:center;font-weight:700;font-size:13px;color:var(--ink-2)}
.streak span.on{background:var(--gold);color:var(--ink)}
.hats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:100%}
.hat{border:2px solid transparent;background:#fff;border-radius:14px;padding:6px 4px 8px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;font-weight:600;box-shadow:0 3px 0 var(--line)}
.hat canvas{width:64px;height:56px}
.hat.on{border-color:var(--leaf);background:#EAFBF1}
.hat.locked{opacity:.55}
.hat span{font-size:11px;color:var(--ink-2);font-weight:600;display:flex;align-items:center;gap:3px}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:7;max-height:62vh;background:var(--paper);border-radius:22px 22px 0 0;box-shadow:0 -10px 30px rgba(0,0,0,.25);padding:14px 14px calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:10px;animation:up .25s ease-out;max-width:520px;margin:0 auto}
@keyframes up{from{transform:translateY(40%);opacity:0}}
.sheet header{display:flex;align-items:center;justify-content:space-between;gap:10px}
.sheet h3{margin:0;font-size:20px;font-weight:700}
.sheet h3 small{display:block;font-size:12px;font-weight:600;color:var(--ink-2)}
.list{overflow-y:auto;display:flex;flex-direction:column;gap:8px;padding-bottom:4px}
.up{display:grid;grid-template-columns:44px 1fr auto;gap:2px 10px;align-items:center;background:#fff;border-radius:14px;padding:8px 10px;box-shadow:0 3px 0 var(--line)}
.up canvas{grid-row:span 2;width:44px;height:44px}
.up b{font-size:15px;font-weight:600;line-height:1.1}
.up.rush{background:linear-gradient(#FFF6D6,#FFE9A8);box-shadow:0 3px 0 #E8C66A}
.btn.ad{background:linear-gradient(#FFD86A,#F5B72E 60%,#D99A12);box-shadow:0 5px 0 #A8740A,0 10px 20px rgba(0,0,0,.2);color:#4A3200;margin-top:8px}
.btn.ad:before,.buy.ad:before{content:'▶';display:inline-block;margin-right:6px;font-size:.8em;transform:translateY(-1px)}
.buy.ad{background:#F5B72E;color:#4A3200}
.adNote{font-size:12px;opacity:.7;margin-top:6px}
.adShade{position:fixed;inset:0;z-index:50;background:rgba(10,20,30,.92);color:#fff;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:600}
.up span{font-size:12px;color:var(--ink-2);font-weight:500;line-height:1.25}
.up .lv{display:flex;gap:3px;margin-top:2px}
.up .lv i{width:9px;height:9px;border-radius:3px;background:#E6DCC8}
.up .lv i.on{background:var(--leaf)}
.buy{grid-row:span 2;border:0;border-radius:12px;padding:8px 10px;min-width:74px;font-weight:700;font-size:15px;display:flex;align-items:center;justify-content:center;gap:4px;background:linear-gradient(#FFE48E,#F7BC34);box-shadow:0 3px 0 var(--gold-d);font-variant-numeric:tabular-nums}
.up.hl{box-shadow:0 0 0 3px var(--coral),0 3px 0 var(--line);background:#FFF1EE;position:relative}
.up.hl::before{content:'GOAL';position:absolute;top:-8px;left:10px;background:var(--coral);color:#fff;font-size:10px;font-weight:700;letter-spacing:.8px;padding:1px 7px;border-radius:6px}
.up.hl .buy:not(:disabled){animation:pulse 1s ease-in-out infinite}
.buy:disabled{opacity:.45;cursor:not-allowed}
.buy.max{background:#E6DCC8;box-shadow:none;color:var(--ink-2)}
.tip{position:fixed;z-index:8;max-width:260px;background:#fff;border-radius:16px;padding:12px 14px;box-shadow:0 10px 30px rgba(0,0,0,.3);font-size:16px;font-weight:500;line-height:1.35;color:var(--ink);pointer-events:auto}
.tip b{font-weight:700}
.tip .tnext{margin-top:8px;border:0;border-radius:10px;padding:7px 14px;font-weight:700;font-size:15px;color:#fff;background:var(--coral);box-shadow:0 3px 0 #A83A33}
.tip .step{display:block;font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--ink-2);font-weight:600;margin-bottom:3px}
.tip .skip{float:right;border:0;background:none;font-size:12px;color:var(--ink-2);font-weight:600;padding:0 0 4px 8px}
.jtabs{display:flex;gap:4px;width:100%;background:#EFE4CE;border-radius:12px;padding:3px;box-sizing:border-box}
.jtabs button{flex:1;border:0;background:none;border-radius:9px;padding:6px 2px;font-weight:600;font-size:13.5px;color:var(--ink-2)}
.jtabs button[aria-selected=true]{background:#fff;color:var(--ink);box-shadow:0 2px 0 var(--line)}
.jbody{width:100%;max-height:52vh;overflow-y:auto;display:flex;flex-direction:column;gap:8px;text-align:left;padding:2px}
.jnote{font-size:13px!important;text-align:left}
.task{display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center;background:#fff;border-radius:12px;padding:8px 10px;box-shadow:0 2px 0 var(--line)}
.task b{font-size:14px;font-weight:600}
.task .tbar{grid-column:1;height:7px;background:#EDE5D3;border-radius:999px;overflow:hidden}
.task .tbar i{display:block;height:100%;background:var(--leaf);border-radius:999px}
.task .tprog{grid-column:1;font-size:11.5px;color:var(--ink-2);font-weight:600}
.task .buy{grid-column:2;grid-row:1/span 3}
.task.claimed{opacity:.6}.task.bonus{background:#FFF7DA}
.page{background:#fff;border-radius:12px;padding:8px;box-shadow:0 2px 0 var(--line)}
.phead{display:flex;justify-content:space-between;gap:8px;align-items:baseline;margin-bottom:6px}.phead b{font-size:14px}.phead span{font-size:11.5px;color:var(--ink-2);font-weight:600}
.stickers{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.sticker{display:flex;flex-direction:column;align-items:center;gap:2px;background:#F4FBFC;border-radius:10px;padding:4px 2px 6px;font-size:11px;font-weight:600;text-align:center;line-height:1.1}
.sticker canvas{width:48px;height:48px}.sticker.missing{background:#F3EEE4;color:var(--ink-2)}.sticker.rare:not(.missing){background:#FFF3C4;box-shadow:inset 0 0 0 2px var(--gold)}
.dbtns{grid-row:span 2;display:flex;flex-direction:column;gap:4px}.dbtns .buy{grid-row:auto;min-width:88px;padding:6px 8px;font-size:14px}
.stickerPop{position:fixed;left:12px;bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:6;display:flex;align-items:center;gap:8px;background:#fff;border-radius:16px;padding:6px 14px 6px 6px;box-shadow:0 8px 24px rgba(0,0,0,.25),inset 0 0 0 2px var(--gold);font-weight:700;font-size:16px;animation:pop2 .4s cubic-bezier(.2,1.6,.4,1)}
.stickerPop canvas{width:44px;height:44px}.stickerPop small{display:block;font-size:11px;color:#8A5A00;letter-spacing:.5px;text-transform:uppercase}
@keyframes pop2{from{transform:scale(.6);opacity:0}}
.eventBar{position:fixed;left:50%;transform:translateX(-50%);top:calc(var(--hudb,60px) + 54px);z-index:3;background:var(--ink);color:#fff;border-radius:14px;padding:7px 14px 11px;font-size:14px;font-weight:500;white-space:nowrap;overflow:hidden;box-shadow:0 6px 16px rgba(0,0,0,.25);pointer-events:none}
.eventBar b{color:var(--gold)}.eventBar i{position:absolute;left:0;bottom:0;height:4px;background:var(--gold)}
.placebar{position:fixed;left:10px;right:10px;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:6;max-width:420px;margin:0 auto;display:flex;align-items:center;gap:8px;background:#fff;border-radius:16px;padding:8px 8px 8px 14px;box-shadow:0 8px 24px rgba(0,0,0,.3);font-size:14px;font-weight:500}
.placebar span{flex:1}.placebar .btn{font-size:17px;padding:8px 16px}
.proto{position:fixed;bottom:calc(6px + env(safe-area-inset-bottom,0px));right:12px;font-size:11px;font-weight:600;color:rgba(255,255,255,.8);z-index:1;pointer-events:none;letter-spacing:.5px}
@media (prefers-reduced-motion:reduce){.toast,.modal,.sheet,.goal button{animation:none}.health .bar i,.goal .gbar i{transition:none}}
</style>

<canvas id="game" aria-label="Tidy Tides coast"></canvas>
<div class="hud">
  <div class="pill" id="coinPill" aria-label="Coins"><span class="coin"></span><span id="coins">0</span></div>
  <div class="health" id="healthBox"><div class="row"><span id="areaName">Sunny Beach</span><b id="hp">0%</b></div><div class="bar"><i id="hpBar"></i></div><div class="next" id="next"></div></div>
  <div class="side">
    <button class="iconBtn" id="mute" aria-label="Sound on"><svg viewBox="0 0 24 24"><path d="M4 9.5h3.5L12.5 5v14l-5-4.5H4z" fill="currentColor"/><path id="waves" d="M15.5 9a4 4 0 010 6M18 6.5a7.5 7.5 0 010 11" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>
    <button class="iconBtn" id="giftBtn" aria-label="Daily gift"><svg viewBox="0 0 24 24"><rect x="3.5" y="9" width="17" height="11.5" rx="2" fill="#FF7A6B"/><rect x="2.5" y="6.5" width="19" height="4" rx="1.5" fill="#FF9A8C"/><rect x="10.8" y="6.5" width="2.4" height="14" fill="#FFC83D"/><path d="M12 6.5c-2-4-6-3-4.5-.5M12 6.5c2-4 6-3 4.5-.5" fill="none" stroke="#FFC83D" stroke-width="2" stroke-linecap="round"/></svg><i class="dot" id="giftDot" hidden></i></button>
    <button class="iconBtn" id="starBtn" aria-label="Sea Stars" hidden><svg viewBox="0 0 24 24"><path d="M12 2.5l2.8 6.1 6.7.7-5 4.5 1.4 6.6L12 17l-5.9 3.4 1.4-6.6-5-4.5 6.7-.7z" fill="#FFC83D" stroke="#D99A12" stroke-width="1.2" stroke-linejoin="round"/></svg><i class="cnt" id="starCnt">0</i></button>
    <button class="iconBtn" id="journalBtn" aria-label="Journal: daily tasks, album, decor, hats"><svg viewBox="0 0 24 24"><rect x="4" y="3" width="15" height="18" rx="2.5" fill="#35C6D8"/><rect x="4" y="3" width="4" height="18" rx="1.5" fill="#1C7F9A"/><path d="M11 8h5M11 11.5h5" stroke="#fff" stroke-width="1.8" stroke-linecap="round"/><path d="M12.5 15.5c1-1.4 3-1.4 4 0-1 1.4-3 1.4-4 0z" fill="#FFC83D"/></svg><i class="dot" id="journalDot" hidden></i></button>
  </div>
</div>

<div class="goal" id="goal" hidden></div>
<div class="proto">PROTOTYPE</div>
<div class="overlay" id="title">
  <div class="logo">Tidy<span>Tides</span></div>
  <div class="coastTag" id="coastTag" hidden></div>
  <div class="tag">Clean the coast. Build a business. Bring it back to life.</div>
  <button class="btn big" id="play">Play</button>
</div>

<script>
(() => {
const $ = id => document.getElementById(id);
const cv = $('game'), ctx = cv.getContext('2d');
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const rnd = (a,b) => a + Math.random()*(b-a), clamp = (v,a,b) => Math.max(a, Math.min(b, v));
const pick = a => a[Math.floor(Math.random()*a.length)];
const dist = (a,b,x,y) => Math.hypot(a-x, b-y);
const fmt = n => n >= 10000 ? (n/1000).toFixed(n >= 100000 ? 0 : 1) + 'k' : String(Math.floor(n));

// ================= DATA =================
const AW = 400; // each area is 400 units wide
const KEY = 'tidytides-save-v2';
let stored = null; try { stored = JSON.parse(localStorage.getItem(KEY)); } catch(e){}

// ---- Coasts ----
// Each coast is a fresh map: 3 areas, 9 machines, its own trash, goods, helper animals, wildlife and hats.
// Finishing a coast lets you "set sail" to the next one: coins and buildings start fresh, but Sea Stars,
// perks and hats are kept (like moving to a new city in Eatventure). Prices are the same on every coast.
// After the last hand-made coast the game keeps going with "tours" of earlier coasts, each with a twist.
// To add a coast: add an entry here (same shape), draw its new items in drawItem, then bump nothing else.
// Machine: [id, name, input, output, colour, shape]. Shapes: kiln, loom, press, bench, booth, dome.
const COASTS = [
  { id:'sunny', name:'Sunny Coast', blurb:'Sandy beaches, an old pier and a lighthouse.',
    sand:['#CBB995','#F6DDA4'], seaTop:['#3F5F63','#1C7F9A'], seaLow:['#6E8F86','#46CFDD'], tree:'palm', grass:'#7DB36A', decor:['', 'pier', 'lighthouse'],
    collector:{ kind:'crab', name:'Hermit crab', plural:'hermit crabs' }, carrier:{ kind:'pelican', name:'Pelican courier', short:'pelican', plural:'pelicans' },
    big:{ col:'#7FA7C6', w:14, h:5 }, turtle:'#3F7B4F',
    wild:[['seagulls return','The seagulls are back!'], ['a sea turtle nests','A sea turtle came to nest!'], ['the water clears','The water is clearing up!'], ['starfish return','Starfish everywhere!'], ['dolphins','Dolphins! This spot is healed!']],

  const w = reduce ? 0 : Math.sin(S.t * 14 + k.seed) * (k.moving ? 1.6 : .2);

    c.strokeStyle = '#3E4A40'; c.lineWidth = 3; c.lineCap = 'round'; c.beginPath(); c.moveTo(-6, 3); c.quadraticCurveTo(-14, 6 + w, -18, 1); c.stroke();
    c.fillStyle = '#3E4A40'; [[-5, 7 + w], [5, 7 - w], [-5, -2 - w], [5, -2 + w]].forEach(([a, b]) => { c.beginPath(); c.ellipse(a, b, 3, 1.6, 0, 0, 7); c.fill(); });
    c.fillStyle = '#56645A'; c.beginPath(); c.ellipse(0, 2, 8, 5, 0, 0, 7); c.fill(); c.beginPath(); c.ellipse(8, 0, 4.5, 3.5, 0, 0, 7); c.fill();
    c.fillStyle = '#E4606D'; for (let i = -5; i < 6; i += 2.5) { c.beginPath(); c.moveTo(i - 1, -2); c.lineTo(i, -5); c.lineTo(i + 1, -2); c.fill(); }

// ================= STATE =================
const S = {
  t:0, player:{ x:200, y:0, face:1, stack:[], bob:0 },
  trash:{}, crabs:[], pelicans:[], tourists:[], fx:[], pops:[], coinsFly:[], flies:[], steps:[], smoke:[],
  spawnT:{}, touristT:{}, dropT:0, stockT:0, payT:0, dwell:0, payKey:null, stepT:0, stepAlt:1, lean:0, lastWater:0,

AREAS.forEach(a => { S.trash[a.id] = []; S.spawnT[a.id] = 0; S.touristT[a.id] = 1 + a.i; });
function mst(m){ const st = A(m.area.id).st; return st[m.id] || (st[m.id] = { in:0, out:0, t:0 }); }
function mlv(m){ return A(m.area.id).mlv[m.id] || 0; }
function mtime(m){ return 1.1 * Math.pow(.78, mlv(m)) / (1 + .08 * perk('machines')); }
function mcap(m){ return 20 + mlv(m) * 10; }
function built(m){ return !!A(m.area.id).built[m.id]; }
function cap(){ return 6 + save.bag * 3; }
function speed(){ return 125 + save.shoes * 16; }
function health(a){ return Math.min(1, A(a.id).recycled / 100); }
function dispCap(a){ return 12 + A(a.id).display * 8; }
function dispCount(a){ return Object.values(A(a.id).disp).reduce((s, n) => s + n, 0); }
function unlockedEnd(){ return unlockedCount() * AW; }
function nextLocked(){ return AREAS.find(a => !A(a.id).unlocked); }
function reqMet(r){
  const a = AREAS.find(x => x.id === r.area), st = A(r.area);
  if (r.t === 'health') return health(a) * 100 >= r.pct;
  if (r.t === 'allBuilt') return a.machines.every(built);
  if (r.t === 'hire') return st[r.k] >= r.n;
  if (r.t === 'mlvAll') return a.machines.every(m => built(m) && mlv(m) >= r.lv);

}
function reqsMet(a){ return (REQS[a.id] || []).every(reqMet); }
function waterline(){ const k = (Math.sin(S.t * 2 * Math.PI / 40) + 1) / 2; return L.seaLow + (L.seaHigh - L.seaLow) * k; }
function builtOutputs(a){ return (a ? a.machines : MACHINES).filter(built).map(m => m.output); }
const bargain = () => twist('bargain') ? .7 : 1;
function areaUpCost(a, u){ const lv = A(a.id)[u.k]; return lv < u.max ? Math.round(u.base[lv] * a.mult * bargain()) : null; }
function machUpCost(m){ const lv = mlv(m); return lv < MACH_UP.length ? Math.round(MACH_UP[lv] * m.area.mult * bargain()) : null; }
function salePrice(it, a){ return Math.round(PRICE[it] * (1 + .1 * perk('income')) * (twist('golden') ? 1.5 : 1) * (1 + (a ? decorBonus(a) : 0))); }
// Sea Stars for setting sail now: 10, plus up to 30 more for healing every area, plus a bonus on later tours
function starsMax(){ return 40 + 5 * (COAST.tour - 1); }
function starsNow(){ return 10 + 5 * (COAST.tour - 1) + Math.floor(AREAS.reduce((s, a) => s + health(a) * 100, 0) / 10); }
// Pacing gates: upgrades open up as the coast does, so nobody can max everything on the first beach.
const GLOBAL_GATE = { bag:[2,4,6], shoes:[1,2,4] };   // highest level you can buy with 1, 2, 3 areas open
function globalLocked(u){ return save[u.k] < u.max && save[u.k] >= GLOBAL_GATE[u.k][unlockedCount() - 1]; }

function areaLocked(a, u){ const lv = A(a.id)[u.k]; return lv < u.max && builtIn(a) < lv + 1 + (3 - u.max); }   // helpers & counters grow with the machines built there

// ================= SOUND =================
let ac = null, waveGain = null;
function audio(){
  if (ac || save.muted) return;
  const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
  ac = new AC();
  const buf = ac.createBuffer(1, ac.sampleRate * 2, ac.sampleRate), d = buf.getChannelData(0);
  for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  const src = ac.createBufferSource(); src.buffer = buf; src.loop = true;
  const f = ac.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 520;
  waveGain = ac.createGain(); waveGain.gain.value = 0;
  src.connect(f); f.connect(waveGain); waveGain.connect(ac.destination); src.start();
}
function blip(freq, dur, type, vol, delay){
  if (!ac || save.muted) return;
  const t = ac.currentTime + (delay || 0), o = ac.createOscillator(), g = ac.createGain();
  o.type = type || 'triangle'; o.frequency.setValueAtTime(freq, t);
  g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(vol || .12, t + .01); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
  o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t + dur + .05);
}
const SFX = {
  pick(n){ blip(700 + Math.min(n, 12) * 40, .08, 'triangle', .1); },
  drop(){ blip(420, .07, 'sine', .1); },
  sell(){ blip(988, .07, 'square', .05); blip(1319, .16, 'square', .05, .07); },
  build(){ [523,659,784,1047].forEach((f,i) => blip(f, .18, 'triangle', .1, i * .07)); },
  pay(){ blip(1200, .03, 'square', .03); },
  milestone(){ [659,784,988,1319].forEach((f,i) => blip(f, .35, 'sine', .12, i * .12)); },
  claim(){ [784,988,1175,1568].forEach((f,i) => blip(f, .22, 'triangle', .11, i * .06)); },
  tap(){ blip(600, .05, 'triangle', .08); },
};

// ================= HELPERS =================
let toastT = 0;

// ================= HELPERS (crabs & pelicans) =================
function ensureHelpers(){
  for (const a of AREAS) {
    const st = A(a.id);
    while (S.crabs.filter(k => k.area === a).length < st.crabs) S.crabs.push({ area: a, x: a.x + rnd(60, 340), y: L.inY - 30, carry: [], target: null, seed: Math.random() * 9, moving: false, home: { x: a.x + rnd(60, 340), y: L.inY - 24 } });
    while (S.pelicans.filter(k => k.area === a).length < st.pelicans) S.pelicans.push({ area: a, x: a.x + 200, y: L.machY, carry: [], seed: Math.random() * 9, goal: null });
  }
}

// ================= PADS =================
function pads(){
  const list = [];
  for (const a of AREAS) {
    const st = A(a.id);
    if (!st.unlocked) continue;
    a.machines.forEach((m, i) => {
      if (built(m)) return;
      const prevBuilt = i === 0 || built(a.machines[i - 1]);
      const show = a.i === 0 && i === 1 ? Object.values(save.stats.sold).reduce((s, n) => s + n, 0) >= 1 : prevBuilt;
      if (show) list.push({ key: 'm:' + m.id, x: m.x, y: L.machY, cost: m.cost * (a.i === 0 ? 1 : 1), label: m.name, icon: m.output, kind: 'machine', m });
    });
  }
  const nl = nextLocked();
  if (nl) { const prev = AREAS[nl.i - 1]; if (prev.machines.filter(built).length >= 2)
    list.push({ key: 'a:' + nl.id, x: nl.x + 58, y: (L.machY + L.row0) / 2, cost: nl.cost, label: 'Restore\n' + nl.name, kind: 'area', area: nl, locked: !reqsMet(nl) }); }
  // the whole coast is open: a dock appears at the far end to sail on
  const last = AREAS[AREAS.length - 1];
  if (!nl) list.push({ key: 'sail', x: last.x + 335, y: L.row1 - 6, cost: starsNow(), label: 'Set sail', kind: 'sail' });
  return list;
}
function complete(pad){
  if (pad.kind === 'machine') { A(pad.m.area.id).built[pad.m.id] = true; toast(`${pad.m.name} built!`); onBuilt(pad.m); }
  if (pad.kind === 'area') {
    const st = A(pad.area.id); st.unlocked = true; st.built[pad.area.machines[0].id] = true;
    toast(`Welcome to ${pad.area.name}!`); SFX.milestone();
    for (let i = 0; i < 5; i++) spawnOne(pad.area, true);
    onBuilt(pad.area.machines[0], true);
  }
  delete save.pads[pad.key];
  SFX.build(); sparkle(pad.x, pad.y, ['#FFC83D','#FF7A6B','#35C6D8','#fff'], 28); persist();
}

// ================= WORLD =================
function spawnOne(a, near){
  const wl = waterline(), types = builtOutputs(a).length ? a.machines.filter(built).map(m => m.input) : [];
  if (!types.length) return;
  S.trash[a.id].push({ type: pick(types), x: a.x + rnd(20, AW - 20), y: near ? rnd(wl + 20, L.trashMax) : clamp(wl + rnd(6, 60), wl + 6, L.trashMax), rot: rnd(-1, 1), claimed: null });
}
function spawnTrash(dt){
  const wl = waterline(), receding = wl < S.lastWater; S.lastWater = wl;
  for (const a of AREAS) {
    const st = A(a.id); if (!st.unlocked) continue;
    S.spawnT[a.id] -= dt * (S.storm ? 1.8 : 1) * (twist('tides') ? 2 : 1);
    const max = 10 + st.crabs * 3 + (S.storm ? 6 : 0);
    if (S.spawnT[a.id] <= 0 && S.trash[a.id].length < max) { S.spawnT[a.id] = receding ? rnd(.5, 1) : rnd(1.6, 2.6); spawnOne(a); }
  }
}
function recycle(m){
  const st = A(m.area.id); st.recycled++; bump('rec'); save.stats.rec[m.input] = (save.stats.rec[m.input] || 0) + 1;
  sparkle(m.x, L.machY - 20, ['#8BD3A5', '#fff', m.col], 6);
  const ms = MILESTONES.find(x => x.at === st.recycled);
  if (ms) { toast(m.area.i ? `${m.area.name}: ${ms.text}` : ms.text); SFX.milestone(); setTimeout(() => albumMilestone(MILESTONES.indexOf(ms)), 700); }
}

function update(dt){
  S.t += dt;
  const p = S.player, wl = waterline();
  // movement
  let mx = 0, my = 0;
  if (joy.on && !S.modal) { const dx = joy.x - joy.ox, dy = joy.y - joy.oy, m = Math.hypot(dx, dy); if (m > 6) { mx = dx / Math.max(m, 40); my = dy / Math.max(m, 40); } }
  if (keys['arrowleft'] || keys['a']) mx -= 1; if (keys['arrowright'] || keys['d']) mx += 1;
  if (keys['arrowup'] || keys['w']) my -= 1; if (keys['arrowdown'] || keys['s']) my += 1;
  const mm = Math.hypot(mx, my); if (mm > 1) { mx /= mm; my /= mm; }
  const nl = nextLocked(), maxX = nl ? unlockedEnd() + 100 : AW * AREAS.length - 14;
  p.x = clamp(p.x + mx * speed() * dt, 14, maxX);
  p.y = clamp(p.y + my * speed() * dt, wl + 12, L.playerMaxY);
  if (mm > .1) { p.bob += dt * 14; if (Math.abs(mx) > .2) p.face = mx > 0 ? 1 : -1;
    S.stepT -= dt; if (S.stepT <= 0 && p.y < L.sellY - 20) { S.stepT = .16; S.stepAlt *= -1; S.steps.push({ x: p.x + S.stepAlt * 4, y: p.y + 10, t: 0, a: Math.atan2(my, mx) }); if (S.steps.length > 70) S.steps.shift(); } }
  S.lean += ((-mx * speed() / 125) - S.lean) * Math.min(1, dt * 6);
  const here = areaAt(p.x);

  spawnTrash(dt);
  // pick up trash
  for (const a of AREAS) for (const tr of S.trash[a.id]) {
    if (tr.dead || p.stack.length >= cap() || tr.y < wl + 4) continue;
    if (dist(p.x, p.y, tr.x, tr.y) < 20) { tr.dead = true; if (tr.claimed) tr.claimed.target = null; fly(tr.type, tr.x, tr.y, p.x, stackTopY()); p.stack.push(tr.type); SFX.pick(p.stack.length); if (S.cleanup) S.cleanup.got++; }
  }
  for (const a of AREAS) S.trash[a.id] = S.trash[a.id].filter(t => !t.dead);

  // machines
  S.dropT -= dt;
  for (const m of MACHINES) {
    if (!built(m)) continue;
    const st = mst(m);
    if (S.dropT <= 0 && dist(p.x, p.y, m.x, L.inY) < 26 && st.in < mcap(m) && takeTopOf(p.stack, i => i === m.input)) { fly(m.input, p.x, stackTopY(), m.x, L.inY - 4); st.in++; S.dropT = .09; SFX.drop(); }
    if (S.dropT <= 0 && dist(p.x, p.y, m.x, L.outY) < 26 && st.out > 0 && p.stack.length < cap()) { fly(m.output, m.x, L.outY - 6, p.x, stackTopY()); st.out--; p.stack.push(m.output); S.dropT = .09; SFX.pick(p.stack.length); }
    if (st.in > 0 && st.out < mcap(m)) {
      st.t += dt;
      if (st.t >= mtime(m)) { st.t = 0; st.in--; st.out++; fly(m.output, m.x, L.machY + 8, m.x, L.outY - 4, .3); recycle(m); }
      st.smokeT = (st.smokeT || 0) - dt;
      if (st.smokeT <= 0 && (m.shape === 'kiln' || m.shape === 'press' || m.shape === 'booth')) { st.smokeT = .32; S.smoke.push({ x: m.x + (m.shape === 'kiln' ? 17 : 0), y: L.machY - (m.shape === 'kiln' ? 50 : 34), t: 0, col: m.shape === 'booth' ? m.col : null }); }
    } else st.t = 0;
  }

  // stock the counter: stand on the sell mat and your goods go on display
  S.stockT -= dt;
  const matA = areaAt(p.x);
  if (A(matA.id).unlocked && Math.abs(p.x - (matA.x + 200)) < 56 && p.y > L.sellY - 20 && S.stockT <= 0 && dispCount(matA) < dispCap(matA)) {
    const it = takeTopOf(p.stack, i => PRICE[i]);
    if (it) { const d = A(matA.id).disp; d[it] = (d[it] || 0) + 1; S.stockT = .07; fly(it, p.x, stackTopY(), matA.x + 150 + Math.random() * 100, L.counterY - 12); SFX.drop(); }
  }

  // pay into pads by standing on them

    const w = pad.kind === 'machine' ? 30 : 46;

      if (S.payKey !== pad.key) { S.payKey = pad.key; S.dwell = 0; }
      S.dwell += dt;
      const paid = save.pads[pad.key] || 0;
      if (pad.kind === 'sail') { if (S.dwell > .5 && !S.sailAsked && !S.modal) { S.sailAsked = true; openSail(); } continue; }
      if (pad.locked) { if (S.dwell > .35 && S.lockMsg !== pad.key) { S.lockMsg = pad.key; toast('Finish the checklist on the sign first'); } continue; }
      if (S.dwell > .35 && S.payT <= 0 && save.coins > 0 && paid < pad.cost) {
        const step = Math.min(save.coins, pad.cost - paid, Math.max(1, Math.ceil(pad.cost / 30)));
        save.coins -= step; save.pads[pad.key] = paid + step; S.payT = .05; SFX.pay();

      }
    }
  }
  if (!onPad) { S.payKey = null; S.lockMsg = null; S.sailAsked = false; }

  // Crew & Upgrades boards
  let onBoard = null;
  for (const a of AREAS) if (A(a.id).unlocked && Math.abs(p.x - (a.x + 44)) < 30 && Math.abs(p.y - (L.row0 + 10)) < 26) onBoard = a;
  if (onBoard && S.boardDismissed !== onBoard.id) { S.boardDwell += dt; if (S.boardDwell > .3 && S.boardOpen !== onBoard.id) openBoard(onBoard); }
  else { S.boardDwell = 0; if (S.boardOpen && (!onBoard || onBoard.id !== S.boardOpen)) closeBoard(); if (!onBoard) S.boardDismissed = null; }

    const st = A(a.id); if (!st.unlocked) continue;
    const maxQ = 3 + st.umbrella, line = S.tourists.filter(t => t.area === a && !t.leaving);
    S.touristT[a.id] -= dt;
    const outs = builtOutputs(a), all = builtOutputs();
    if (S.touristT[a.id] <= 0 && line.length < maxQ && all.length) {

      // tourists mostly ask for what's on the counter, so the line keeps moving

// ================= GOALS =================
function goalAt(i){
  if (i < GOALS.length) return GOALS[i];
  return { t:'sail', r:0, text:`Set sail to ${NEXT_COAST.name}` };
}
function statFor(g){
  if (g.t === 'recycle') return save.stats.rec[g.item] || 0;
  if (g.t === 'sell') return save.stats.sold[g.item] || 0;
  if (g.t === 'earn') return save.stats.earned;
  if (g.t === 'recycleAny') return AREAS.reduce((s, a) => s + A(a.id).recycled, 0);
  return 0;
}
function goalProgress(g){
  if (save.goalBase == null) save.goalBase = statFor(g);
  switch (g.t) {
    case 'recycle': case 'sell': case 'earn': case 'recycleAny': return [Math.min(g.n, statFor(g) - save.goalBase), g.n];
    case 'build': return [built(MBY[g.id]) ? 1 : 0, 1];
    case 'global': return [Math.min(g.lv, save[g.k]), g.lv];
    case 'hire': return [Math.min(g.n, A(g.area)[g.k]), g.n];
    case 'mlv': return [Math.min(g.lv, mlv(MBY[g.id])), g.lv];
    case 'health': return [Math.min(g.pct, Math.round(health(AREAS.find(a => a.id === g.area)) * 100)), g.pct];
    case 'area': return [A(g.id).unlocked ? 1 : 0, 1];
    case 'sail': return [0, 1];
  }
  return [0, 1];
}
function claimGoal(){
  const g = goalAt(save.goal), [c, n] = goalProgress(g); if (c < n) return;
  save.coins += g.r; save.stats.earned += 0;
  if (g.hat) { save.hats[g.hat] = true; setTimeout(() => toast(`New hat unlocked: ${HATS.find(h => h.id === g.hat).name}!`), 900); }
  save.goal++; save.goalBase = null; SFX.claim();
  const r = $('goal').getBoundingClientRect(); sparkle(camX + (r.left + r.width / 2) / scale, (r.top) / scale, ['#FFC83D', '#FF7A6B', '#4CC38A', '#fff'], 24);
  pop('+' + g.r, camX + (r.left + 60) / scale, r.top / scale, '#FFC83D');
  persist(); renderGoal(true);
}
function goalTarget(){
  if (!save.tutDone) return null;
  const g = goalAt(save.goal);
  if (g.t === 'build') { const pd = pads().find(x => x.key === 'm:' + g.id); return pd ? { x: pd.x, y: pd.y - 30 } : null; }
  if (g.t === 'sail') { const pd = pads().find(x => x.key === 'sail'); return pd ? { x: pd.x, y: pd.y - 36 } : null; }
  if (g.t === 'area') { const pd = pads().find(x => x.key === 'a:' + g.id); return pd ? { x: pd.x, y: pd.y - 36 } : null; }
  if (g.t === 'hire' || g.t === 'mlv' || g.t === 'global') { const a = g.area ? AREAS.find(x => x.id === g.area) : (g.id ? MBY[g.id].area : areaAt(S.player.x)); if (!A(a.id).unlocked) return null; const [c, n] = goalProgress(g); return c < n ? { x: a.x + 44, y: L.row0 - 44 } : null; }
  return null;
}
