<title>Tidy Tides</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap">
<style>
/* Layout: full-screen top-down coast that scrolls sideways through three areas (Sunny Beach, Old Pier,
   Lighthouse Cove). HUD floats on top: coins, area health, gift / wardrobe / sound; goal card bottom-left;
   bottom sheets for upgrades; spotlight tutorial. Single deliberate sunny look. */
:root{
  --sea:#2FB8C9; --sea-deep:#1C7F9A; --sand:#F4D9A0; --coral:#FF7A6B; --coral-d:#D9544A;
  --ink:#16324A; --ink-2:#4F6B80; --paper:#FFF8EC; --line:#E8DCC4; --leaf:#4CC38A; --gold:#FFC83D; --gold-d:#D99A12;
  --display:"Fredoka","Arial Rounded MT Bold","Trebuchet MS",sans-serif;
  color-scheme:light;
}
html,body{height:100%;margin:0}
body{background:#1C7F9A;font-family:var(--display);overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;color:var(--ink)}
button{font-family:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
#game{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.hud{position:fixed;left:0;right:0;top:0;padding:calc(10px + env(safe-area-inset-top,0px)) 60px 0 12px;display:flex;gap:10px;align-items:flex-start;pointer-events:none;z-index:2}
.pill{pointer-events:auto;display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.94);border-radius:999px;padding:5px 12px 5px 6px;font-weight:700;font-size:20px;box-shadow:0 3px 0 rgba(22,50,74,.18);font-variant-numeric:tabular-nums;flex:none}
.coin{width:24px;height:24px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#FFE58A,var(--gold) 55%,var(--gold-d));box-shadow:inset 0 0 0 2px rgba(150,95,0,.35);flex:none;display:inline-block}
.coin.sm{width:16px;height:16px;vertical-align:-3px}
.health{background:rgba(255,255,255,.94);border-radius:16px;padding:6px 10px 7px;box-shadow:0 3px 0 rgba(22,50,74,.18);min-width:0;flex:1;max-width:320px}
.health .row{display:flex;justify-content:space-between;gap:8px;font-size:12.5px;font-weight:600;color:var(--ink-2);white-space:nowrap}
.health .row b{color:var(--ink)}
.health .bar{height:9px;background:#E2EEF2;border-radius:999px;margin-top:4px;overflow:hidden}
.health .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#8BD3A5,var(--leaf));border-radius:999px;transition:width .4s}
.health .next{font-size:11.5px;color:var(--ink-2);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.side{position:fixed;right:12px;top:calc(10px + env(safe-area-inset-top,0px));display:flex;flex-direction:column;gap:8px;z-index:2}
.iconBtn{position:relative;width:40px;height:40px;border-radius:50%;border:0;background:rgba(255,255,255,.94);box-shadow:0 3px 0 rgba(22,50,74,.18);display:grid;place-items:center;padding:0}
.iconBtn svg{width:22px;height:22px}
.iconBtn .dot{position:absolute;top:1px;right:1px;width:11px;height:11px;border-radius:50%;background:var(--coral);box-shadow:0 0 0 2px #fff}
.goal{position:fixed;left:12px;top:calc(66px + env(safe-area-inset-top,0px));z-index:2;width:min(270px,calc(100vw - 80px));box-sizing:border-box;background:rgba(255,255,255,.95);border-radius:16px;padding:9px 11px 10px;box-shadow:0 4px 0 rgba(22,50,74,.2);display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center}
.goal small{grid-column:1/-1;font-size:10.5px;letter-spacing:1px;text-transform:uppercase;color:var(--ink-2);font-weight:600}
.goal b{font-size:15px;line-height:1.15;font-weight:600}
.goal .rw{display:flex;align-items:center;gap:4px;font-weight:700;font-size:14px;color:#8A5A00;white-space:nowrap}
.goal .gbar{grid-column:1/-1;height:7px;background:#EDE5D3;border-radius:999px;overflow:hidden}
.goal .gbar i{display:block;height:100%;background:var(--gold);border-radius:999px;transition:width .3s}
.goal button{grid-column:1/-1;border:0;border-radius:12px;padding:7px;font-weight:700;font-size:16px;color:#fff;background:linear-gradient(#7BE8A8,#2BAE66);box-shadow:0 3px 0 #1F8A50;animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.04)}}
.toast{position:fixed;left:50%;top:calc(150px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:6;background:var(--ink);color:#fff;font-weight:600;font-size:17px;padding:9px 18px;border-radius:999px;box-shadow:0 8px 20px rgba(0,0,0,.25);white-space:nowrap;pointer-events:none;animation:pop .35s cubic-bezier(.2,1.6,.4,1);max-width:calc(100vw - 32px);overflow:hidden;text-overflow:ellipsis}
@keyframes pop{from{transform:translateX(-50%) scale(.6);opacity:0}to{transform:translateX(-50%) scale(1);opacity:1}}
.overlay{position:fixed;inset:0;z-index:8;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center;padding:24px;background:linear-gradient(rgba(28,127,154,.55),rgba(22,50,74,.78))}
.logo{font-weight:700;font-size:clamp(52px,16vw,76px);line-height:.9;color:#fff;text-shadow:0 5px 0 var(--sea-deep),0 12px 30px rgba(0,0,0,.3);transform:rotate(-3deg)}
.logo span{display:block;color:var(--gold)}
.tag{color:#fff;font-size:18px;font-weight:500;max-width:28ch;line-height:1.3}
.btn{font-family:var(--display);font-weight:700;font-size:22px;border:0;border-radius:18px;padding:12px 34px;color:#fff;background:linear-gradient(#FF9A8C,var(--coral) 60%,var(--coral-d));box-shadow:0 5px 0 #A83A33,0 10px 20px rgba(0,0,0,.2)}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 #A83A33}
.btn.green{background:linear-gradient(#7BE8A8,#2BAE66);box-shadow:0 5px 0 #1F8A50}
.btn.big{font-size:28px;padding:14px 50px}
.modalWrap{position:fixed;inset:0;z-index:9;background:rgba(10,35,55,.55);display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:var(--paper);border-radius:24px;width:100%;max-width:360px;padding:20px;display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;box-shadow:0 8px 0 var(--line),0 24px 50px rgba(0,0,0,.4);animation:mpop .3s cubic-bezier(.2,1.6,.4,1);position:relative}
@keyframes mpop{from{transform:scale(.75);opacity:0}}
.modal h2{margin:0;font-size:26px;font-weight:700;line-height:1.1}
.modal p{margin:0;font-size:15px;line-height:1.4;color:var(--ink-2);font-weight:500}
.modal .amt{display:flex;align-items:center;gap:8px;font-size:40px;font-weight:700;color:#8A5A00}
.modal .amt .coin{width:36px;height:36px}
.closeX{position:absolute;top:10px;right:10px;width:34px;height:34px;border-radius:50%;border:0;background:#EFE4CE;font-weight:700;font-size:16px}
.streak{display:flex;gap:5px}
.streak span{width:30px;height:30px;border-radius:9px;background:#EFE4CE;display:grid;place-items:center;font-weight:700;font-size:13px;color:var(--ink-2)}
.streak span.on{background:var(--gold);color:var(--ink)}
.hats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:100%}
.hat{border:2px solid transparent;background:#fff;border-radius:14px;padding:6px 4px 8px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;font-weight:600;box-shadow:0 3px 0 var(--line)}
.hat canvas{width:64px;height:56px}
.hat.on{border-color:var(--leaf);background:#EAFBF1}
.hat.locked{opacity:.55}
.hat span{font-size:11px;color:var(--ink-2);font-weight:600;display:flex;align-items:center;gap:3px}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:7;max-height:62vh;background:var(--paper);border-radius:22px 22px 0 0;box-shadow:0 -10px 30px rgba(0,0,0,.25);padding:14px 14px calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:10px;animation:up .25s ease-out;max-width:520px;margin:0 auto}
@keyframes up{from{transform:translateY(40%);opacity:0}}
.sheet header{display:flex;align-items:center;justify-content:space-between;gap:10px}
.sheet h3{margin:0;font-size:20px;font-weight:700}
.sheet h3 small{display:block;font-size:12px;font-weight:600;color:var(--ink-2)}
.list{overflow-y:auto;display:flex;flex-direction:column;gap:8px;padding-bottom:4px}
.up{display:grid;grid-template-columns:44px 1fr auto;gap:2px 10px;align-items:center;background:#fff;border-radius:14px;padding:8px 10px;box-shadow:0 3px 0 var(--line)}
.up canvas{grid-row:span 2;width:44px;height:44px}
.up b{font-size:15px;font-weight:600;line-height:1.1}
.up span{font-size:12px;color:var(--ink-2);font-weight:500;line-height:1.25}
.up .lv{display:flex;gap:3px;margin-top:2px}
.up .lv i{width:9px;height:9px;border-radius:3px;background:#E6DCC8}
.up .lv i.on{background:var(--leaf)}
.buy{grid-row:span 2;border:0;border-radius:12px;padding:8px 10px;min-width:74px;font-weight:700;font-size:15px;display:flex;align-items:center;justify-content:center;gap:4px;background:linear-gradient(#FFE48E,#F7BC34);box-shadow:0 3px 0 var(--gold-d);font-variant-numeric:tabular-nums}
.buy:disabled{opacity:.45;cursor:not-allowed}
.buy.max{background:#E6DCC8;box-shadow:none;color:var(--ink-2)}
.tip{position:fixed;z-index:8;max-width:260px;background:#fff;border-radius:16px;padding:12px 14px;box-shadow:0 10px 30px rgba(0,0,0,.3);font-size:16px;font-weight:500;line-height:1.35;color:var(--ink);pointer-events:auto}
.tip b{font-weight:700}
.tip .tnext{margin-top:8px;border:0;border-radius:10px;padding:7px 14px;font-weight:700;font-size:15px;color:#fff;background:var(--coral);box-shadow:0 3px 0 #A83A33}
.tip .step{display:block;font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--ink-2);font-weight:600;margin-bottom:3px}
.tip .skip{float:right;border:0;background:none;font-size:12px;color:var(--ink-2);font-weight:600;padding:0 0 4px 8px}
.proto{position:fixed;bottom:calc(6px + env(safe-area-inset-bottom,0px));right:12px;font-size:11px;font-weight:600;color:rgba(255,255,255,.8);z-index:1;pointer-events:none;letter-spacing:.5px}
@media (prefers-reduced-motion:reduce){.toast,.modal,.sheet,.goal button{animation:none}.health .bar i,.goal .gbar i{transition:none}}
</style>

<canvas id="game" aria-label="Tidy Tides coast"></canvas>
<div class="hud">
  <div class="pill" id="coinPill" aria-label="Coins"><span class="coin"></span><span id="coins">0</span></div>
  <div class="health" id="healthBox"><div class="row"><span id="areaName">Sunny Beach</span><b id="hp">0%</b></div><div class="bar"><i id="hpBar"></i></div><div class="next" id="next"></div></div>
</div>
<div class="side">
  <button class="iconBtn" id="mute" aria-label="Sound on"><svg viewBox="0 0 24 24"><path d="M4 9.5h3.5L12.5 5v14l-5-4.5H4z" fill="currentColor"/><path id="waves" d="M15.5 9a4 4 0 010 6M18 6.5a7.5 7.5 0 010 11" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>
  <button class="iconBtn" id="giftBtn" aria-label="Daily gift"><svg viewBox="0 0 24 24"><rect x="3.5" y="9" width="17" height="11.5" rx="2" fill="#FF7A6B"/><rect x="2.5" y="6.5" width="19" height="4" rx="1.5" fill="#FF9A8C"/><rect x="10.8" y="6.5" width="2.4" height="14" fill="#FFC83D"/><path d="M12 6.5c-2-4-6-3-4.5-.5M12 6.5c2-4 6-3 4.5-.5" fill="none" stroke="#FFC83D" stroke-width="2" stroke-linecap="round"/></svg><i class="dot" id="giftDot" hidden></i></button>
  <button class="iconBtn" id="wardBtn" aria-label="Wardrobe"><svg viewBox="0 0 24 24"><ellipse cx="12" cy="15" rx="10" ry="3.2" fill="#FFC83D"/><path d="M6.5 15c0-5 2.5-8 5.5-8s5.5 3 5.5 8z" fill="#FFC83D"/><rect x="6.6" y="12.2" width="10.8" height="2" fill="#FF7A6B"/></svg></button>
</div>
<div class="goal" id="goal" hidden></div>
<div class="proto">PROTOTYPE</div>
<div class="overlay" id="title">
  <div class="logo">Tidy<span>Tides</span></div>
  <div class="tag">Clean the coast. Build a business. Bring it back to life.</div>
  <button class="btn big" id="play">Play</button>
</div>

<script>
(() => {
const $ = id => document.getElementById(id);
const cv = $('game'), ctx = cv.getContext('2d');
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const rnd = (a,b) => a + Math.random()*(b-a), clamp = (v,a,b) => Math.max(a, Math.min(b, v));
const pick = a => a[Math.floor(Math.random()*a.length)];
const dist = (a,b,x,y) => Math.hypot(a-x, b-y);
const fmt = n => n >= 10000 ? (n/1000).toFixed(n >= 100000 ? 0 : 1) + 'k' : String(Math.floor(n));

// ================= DATA =================
const AW = 400; // each area is 400 units wide
const AREAS = [
  { id:'beach', name:'Sunny Beach', cost:0, mult:1, stall:'TIDY TIDES',
    machines:[
      { id:'kiln',  name:'Sea-Glass Kiln', input:'bottle', output:'beads',    cost:0,   col:'#35C6D8', shape:'kiln',  dx:75 },
      { id:'loom',  name:'Rope Loom',      input:'rope',   output:'bracelet', cost:25,  col:'#F2A65A', shape:'loom',  dx:200 },
      { id:'press', name:'Can Press',      input:'can',    output:'boat',     cost:100, col:'#E4606D', shape:'press', dx:325 } ] },
  { id:'pier', name:'Old Pier', cost:300, mult:3, stall:'PIER MARKET',
    machines:[
      { id:'mender',   name:'Net Mender',     input:'net',  output:'hammock',   cost:0,   col:'#2FA39A', shape:'loom',  dx:75 },
      { id:'workshop', name:'Driftwood Shop', input:'wood', output:'birdhouse', cost:200, col:'#B97A44', shape:'bench', dx:200 },
      { id:'painter',  name:'Buoy Painter',   input:'buoy', output:'lantern',   cost:450, col:'#8E7CF0', shape:'booth', dx:325 } ] },
  { id:'cove', name:'Lighthouse Cove', cost:1600, mult:9, stall:'COVE BOUTIQUE',
    machines:[
      { id:'stitcher',  name:'Sandal Stitcher',  input:'sandal', output:'keychain',  cost:0,    col:'#FF9AC4', shape:'press', dx:75 },
      { id:'terrarium', name:'Terrarium Studio', input:'jar',    output:'terrarium', cost:900, col:'#4CC38A', shape:'dome',  dx:200 },
      { id:'planter',   name:'Tire Planter',     input:'tire',   output:'planter',   cost:1800, col:'#6B7B86', shape:'bench', dx:325 } ] },
];
AREAS.forEach((a, i) => { a.i = i; a.x = i * AW; a.machines.forEach(m => { m.area = a; m.x = a.x + m.dx; }); });
const MACHINES = AREAS.flatMap(a => a.machines);
const MBY = Object.fromEntries(MACHINES.map(m => [m.id, m]));
const PRICE = { beads:4, bracelet:7, boat:12, hammock:16, birdhouse:24, lantern:36, keychain:45, terrarium:70, planter:100 };
const LABEL = { beads:'Sea-glass beads', bracelet:'Rope bracelets', boat:'Tin toy boats', hammock:'Hammocks', birdhouse:'Birdhouses', lantern:'Buoy lanterns', keychain:'Flip-flop keychains', terrarium:'Terrariums', planter:'Tire planters',
  bottle:'bottles', rope:'rope', can:'cans', net:'nets', wood:'driftwood', buoy:'buoys', sandal:'flip-flops', jar:'jars', tire:'tires' };
const MILESTONES = [
  { at:5,   text:'The seagulls are back!', short:'seagulls return' },
  { at:15,  text:'A sea turtle came to nest!', short:'a sea turtle nests' },
  { at:35,  text:'The water is clearing up!', short:'the water clears' },
  { at:60,  text:'Starfish everywhere!', short:'starfish return' },
  { at:100, text:'Dolphins! This spot is healed!', short:'dolphins' },
];
// Upgrades on each area's Crew & Upgrades board. Costs scale with the area.
const AREA_UPS = [
  { k:'crabs',    name:'Hermit crab',    desc:'Collects trash and fills baskets.',          base:[50,120,240],     max:3 },
  { k:'pelicans', name:'Pelican courier',desc:'Carries finished goods to the counter.',     base:[140,380],        max:2 },
  { k:'display',  name:'Bigger counter', desc:'Holds 8 more goods for sale.',               base:[60,150,350],     max:3 },
  { k:'umbrella', name:'Beach umbrellas',desc:'More tourists, arriving faster.',            base:[180,500],        max:2 },
];
const GLOBAL_UPS = [
  { k:'bag',   name:'Bigger bag', desc:'Carry 3 more items.',  costs:[30,80,160,320,640,1200], max:6 },
  { k:'shoes', name:'Flip-flops', desc:'Walk faster.',         costs:[45,110,260,600],         max:4 },
];
const MACH_UP = [40, 100, 220, 450]; // x area multiplier
const HATS = [
  { id:'sun',     name:'Sun hat',      how:'free' },
  { id:'captain', name:'Captain cap',  how:'goal', note:'Restore the Old Pier' },
  { id:'pirate',  name:'Pirate hat',   how:'buy', cost:500 },
  { id:'snorkel', name:'Snorkel',      how:'goal', note:'Restore Lighthouse Cove' },
  { id:'flower',  name:'Flower crown', how:'goal', note:'Fully heal Sunny Beach' },
  { id:'crown',   name:'Crown',        how:'buy', cost:5000 },
];
const GOALS = [
  { t:'recycle', item:'bottle', n:5, r:15 },
  { t:'sell', item:'beads', n:6, r:20 },
  { t:'build', id:'loom', r:25 },
  { t:'global', k:'bag', lv:1, r:30, text:'Get a bigger bag' },
  { t:'sell', item:'bracelet', n:8, r:40 },
  { t:'hire', area:'beach', k:'crabs', n:1, r:40, text:'Hire a hermit crab' },
  { t:'mlv', id:'kiln', lv:1, r:50, text:'Upgrade the Sea-Glass Kiln' },
  { t:'build', id:'press', r:60 },
  { t:'hire', area:'beach', k:'pelicans', n:1, r:80, text:'Hire a pelican courier' },
  { t:'health', area:'beach', pct:50, r:100 },
  { t:'earn', n:500, r:120, text:'Earn 500 coins' },
  { t:'area', id:'pier', r:150, text:'Restore the Old Pier', hat:'captain' },
  { t:'sell', item:'hammock', n:8, r:120 },
  { t:'build', id:'workshop', r:150 },
  { t:'hire', area:'pier', k:'crabs', n:1, r:200, text:'Hire a crab at the pier' },
  { t:'sell', item:'birdhouse', n:10, r:220 },
  { t:'build', id:'painter', r:300 },
  { t:'health', area:'beach', pct:100, r:350, hat:'flower' },
  { t:'mlv', id:'mender', lv:1, r:300, text:'Upgrade the Net Mender' },
  { t:'hire', area:'pier', k:'pelicans', n:1, r:400, text:'Hire a pelican at the pier' },
  { t:'sell', item:'lantern', n:10, r:400 },
  { t:'health', area:'pier', pct:50, r:450 },
  { t:'area', id:'cove', r:600, text:'Restore Lighthouse Cove', hat:'snorkel' },
  { t:'sell', item:'keychain', n:15, r:700 },
  { t:'build', id:'terrarium', r:800 },
  { t:'build', id:'planter', r:1000 },
  { t:'health', area:'pier', pct:100, r:1200 },
  { t:'health', area:'cove', pct:100, r:2500, text:'Heal the whole coast' },
];
function goalText(g){
  if (g.text) return g.text;
  if (g.t === 'recycle') return `Recycle ${g.n} ${LABEL[g.item]}`;
  if (g.t === 'sell') return `Sell ${g.n} ${LABEL[g.item].toLowerCase()}`;
  if (g.t === 'build') return `Build the ${MBY[g.id].name}`;
  if (g.t === 'health') return `Heal ${AREAS.find(a => a.id === g.area).name} to ${g.pct}%`;
  return 'Keep cleaning';
}

// ================= SAVE =================
const KEY = 'tidytides-save-v2';
function freshArea(a){ return { unlocked: a.i === 0, built: a.i === 0 ? { [a.machines[0].id]: true } : {}, mlv: {}, st: {}, crabs:0, pelicans:0, display:0, umbrella:0, disp:{}, recycled:0 }; }
let save = { v:2, coins:0, bag:0, shoes:0, areas:{}, pads:{}, stats:{ rec:{}, sold:{}, earned:0 }, goal:0, goalBase:0, tutDone:false, lastSeen:0, giftDay:'', streak:0, hats:{ sun:true }, hat:'sun', muted:false };
AREAS.forEach(a => save.areas[a.id] = freshArea(a));
try {
  const s = JSON.parse(localStorage.getItem(KEY));
  if (s && s.v === 2) { save = Object.assign(save, s); AREAS.forEach(a => save.areas[a.id] = Object.assign(freshArea(a), s.areas && s.areas[a.id])); }
  else {
    const o = JSON.parse(localStorage.getItem('tidytides-save-v1'));   // bring over progress from the first prototype
    if (o && o.unlocked) {
      const b = save.areas.beach; save.coins = o.coins || 0; b.recycled = o.recycled || 0;
      ['kiln','loom','press'].forEach(id => { if (o.unlocked[id]) b.built[id] = true; });
      if (o.lv) { save.bag = o.lv.bag || 0; save.shoes = o.lv.shoes || 0; b.crabs = o.lv.crab || 0; b.umbrella = o.lv.umbrella || 0; }
      save.tutDone = (o.tut || 0) >= 4;
    }
  }
} catch(e){}
function persist(){ save.lastSeen = Date.now(); try { localStorage.setItem(KEY, JSON.stringify(save)); } catch(e){} }
const A = id => save.areas[id];

// ================= LAYOUT =================
let H = 720, scale = 1, dpr = 1, viewW = AW, camX = 0, sandTex = null, L = {};
function layout(){
  dpr = Math.min(devicePixelRatio || 1, 2);
  const sw = innerWidth, sh = innerHeight;
  scale = Math.min(sw / AW, sh / 760);
  H = sh / scale; viewW = sw / scale;
  cv.width = sw * dpr; cv.height = sh * dpr;
  const seaLow = H * .11, seaHigh = H * .25, trashMax = seaHigh + 95;
  const machY = Math.max(trashMax + 110, H * .5);

AREAS.forEach(a => { S.trash[a.id] = []; S.spawnT[a.id] = 0; S.touristT[a.id] = 1 + a.i; });
function mst(m){ const st = A(m.area.id).st; return st[m.id] || (st[m.id] = { in:0, out:0, t:0 }); }

let ac = null, waveGain = null;

// ================= HELPERS (crabs & pelicans) =================

// ================= PADS =================
function pads(){
  const list = [];

    const st = A(a.id);
    if (!st.unlocked) continue;
    a.machines.forEach((m, i) => {
      if (built(m)) return;

      const show = a.i === 0 && i === 1 ? Object.values(save.stats.sold).reduce((s, n) => s + n, 0) >= 1 : prevBuilt;
      if (show) list.push({ key: 'm:' + m.id, x: m.x, y: L.machY, cost: m.cost * (a.i === 0 ? 1 : 1), label: m.name, icon: m.output, kind: 'machine', m });
    });
  }
  const nl = nextLocked();
  if (nl) { const prev = AREAS[nl.i - 1]; if (prev.machines.filter(built).length >= 2)
    list.push({ key: 'a:' + nl.id, x: nl.x + 58, y: (L.machY + L.row0) / 2, cost: nl.cost, label: 'Restore\n' + nl.name, kind: 'area', area: nl }); }

}
function complete(pad){
  if (pad.kind === 'machine') { A(pad.m.area.id).built[pad.m.id] = true; toast(`${pad.m.name} built!`); }
  if (pad.kind === 'area') {
    const st = A(pad.area.id); st.unlocked = true; st.built[pad.area.machines[0].id] = true;
    toast(`Welcome to ${pad.area.name}!`); SFX.milestone();

}

// ================= WORLD =================
function spawnOne(a, near){
  const wl = waterline(), types = builtOutputs(a).length ? a.machines.filter(built).map(m => m.input) : [];
  if (!types.length) return;
  S.trash[a.id].push({ type: pick(types), x: a.x + rnd(20, AW - 20), y: near ? rnd(wl + 20, L.trashMax) : clamp(wl + rnd(6, 60), wl + 6, L.trashMax), rot: rnd(-1, 1), claimed: null });
}
function spawnTrash(dt){
  const wl = waterline(), receding = wl < S.lastWater; S.lastWater = wl;
  for (const a of AREAS) {
    const st = A(a.id); if (!st.unlocked) continue;
    S.spawnT[a.id] -= dt * (S.storm ? 1.8 : 1);
    const max = 10 + st.crabs * 3 + (S.storm ? 6 : 0);
    if (S.spawnT[a.id] <= 0 && S.trash[a.id].length < max) { S.spawnT[a.id] = receding ? rnd(.5, 1) : rnd(1.6, 2.6); spawnOne(a); }
  }
}

  const st = A(m.area.id); st.recycled++; save.stats.rec[m.input] = (save.stats.rec[m.input] || 0) + 1;
  sparkle(m.x, L.machY - 20, ['#8BD3A5', '#fff', m.col], 6);
  const ms = MILESTONES.find(x => x.at === st.recycled);
  if (ms) { toast(m.area.i ? `${m.area.name}: ${ms.text}` : ms.text); SFX.milestone(); }
}

function update(dt){

  if (keys['arrowup'] || keys['w']) my -= 1; if (keys['arrowdown'] || keys['s']) my += 1;
  const mm = Math.hypot(mx, my); if (mm > 1) { mx /= mm; my /= mm; }

    if (dist(p.x, p.y, tr.x, tr.y) < 20) { tr.dead = true; if (tr.claimed) tr.claimed.target = null; fly(tr.type, tr.x, tr.y, p.x, stackTopY()); p.stack.push(tr.type); SFX.pick(p.stack.length); }
  }

    if (S.dropT <= 0 && dist(p.x, p.y, m.x, L.outY) < 26 && st.out > 0 && p.stack.length < cap()) { fly(m.output, m.x, L.outY - 6, p.x, stackTopY()); st.out--; p.stack.push(m.output); S.dropT = .09; SFX.pick(p.stack.length); }

    } else st.t = 0;
  }

      else { const src = a.machines.filter(m => built(m) && mst(m).out > 0).sort((m1, m2) => mst(m2).out - mst(m1).out)[0];
        k.goal = src ? { x: src.x, y: L.outY, kind: 'take', m: src } : { x: a.x + 200 + Math.sin(S.t * .5 + k.seed) * 120, y: L.machY - 40, kind: 'idle' }; }
    }

  for (const [type, c] of shown) for (let i = 0; i < Math.min(c, 6); i++, n++) { if (n >= 18) break; drawItem(ctx, type, cx - 70 + (n % 9) * 15, cy - 9 - Math.floor(n / 9) * 7, 12); }
  const dc = dispCount(a);
  ctx.fillStyle = dc >= dispCap(a) ? '#D9544A' : 'rgba(22,50,74,.85)'; ctx.beginPath(); ctx.roundRect(cx + 44, cy + 1, 34, 14, 6); ctx.fill();
  ctx.fillStyle = '#fff'; ctx.font = '700 9px Fredoka, sans-serif'; ctx.fillText(dc + '/' + dispCap(a), cx + 61, cy + 11);
  const awn = a.i === 0 ? '#35C6D8' : a.i === 1 ? '#2FA39A' : '#FF9AC4';
  for (let i = 0; i < 8; i++) { ctx.fillStyle = i % 2 ? '#fff' : awn; ctx.fillRect(cx - 84 + i * 21, cy - 44, 21, 14); ctx.beginPath(); ctx.arc(cx - 73.5 + i * 21, cy - 30, 10.5, 0, Math.PI); ctx.fill(); }
  ctx.fillStyle = 'rgba(0,0,0,.08)'; ctx.fillRect(cx - 84, cy - 44, 168, 3);
  ctx.font = '700 10px Fredoka, sans-serif'; const sw = ctx.measureText(a.stall).width + 18;
  ctx.fillStyle = '#16324A'; ctx.beginPath(); ctx.roundRect(cx - sw / 2, cy + 1, sw, 14, 6); ctx.fill();
  ctx.fillStyle = '#FFC83D'; ctx.fillText(a.stall, cx, cy + 11.5);
}

// ================= UI: HUD =================
const hudC = {};
const today = () => new Date().toISOString().slice(0, 10);
function hud(){
  if (hudC.coins !== save.coins) { hudC.coins = save.coins; $('coins').textContent = fmt(save.coins);
    document.querySelectorAll('.sheet .buy[data-cost]').forEach(b => { b.disabled = +b.dataset.cost > save.coins; }); }
  let a = areaAt(S.player.x); if (!A(a.id).unlocked) a = AREAS[a.i - 1];
  const key = a.id + ':' + A(a.id).recycled;
  if (hudC.area !== key) { hudC.area = key; const hp = health(a);
    $('areaName').textContent = a.name + ' health'; $('hp').textContent = Math.round(hp * 100) + '%'; $('hpBar').style.width = hp * 100 + '%';
    const nx = MILESTONES.find(m => m.at > A(a.id).recycled);
    $('next').textContent = nx ? `Next: ${nx.short} (${nx.at - A(a.id).recycled} more to recycle)` : `${a.name} is fully healed!`; }
  const gift = save.giftDay !== today(); if (hudC.gift !== gift) { hudC.gift = gift; $('giftDot').hidden = !gift; }
  renderGoal();
}
function renderGoal(force){
  const show = save.tutDone || tutStep >= 6;
  $('goal').hidden = !show; if (!show) return;
  const g = goalAt(save.goal), [c, n] = goalProgress(g), key = save.goal + ':' + c;
  if (!force && key === hudC.goal) return; hudC.goal = key;
  const done = c >= n;
  $('goal').innerHTML = `<small>Goal ${save.goal + 1}</small><b>${goalText(g)}</b><span class="rw"><span class="coin sm"></span>${fmt(g.r)}</span><div class="gbar"><i style="width:${Math.min(100, c / n * 100)}%"></i></div>${done ? '<button type="button" id="claim">Claim reward</button>' : ''}`;
  if (done) $('claim').onclick = claimGoal;
}

// ================= UI: icons for sheets =================
function iconCanvas(kind, size){
  const c = document.createElement('canvas'); c.width = c.height = size * 2; const g = c.getContext('2d'); g.scale(2, 2); const m = size / 2;
  if (PRICE[kind] || LABEL[kind]) { drawItem(g, kind, m, m, size * .75); return c; }
  g.translate(m, m); g.scale(size / 44, size / 44);
  if (kind === 'crabs') { g.scale(1.6, 1.6); drawCrab(g, { x: 0, y: 2, carry: [], seed: 0, moving: false }); }
  if (kind === 'pelicans') { g.scale(1.1, 1.1); drawPelican(g, { x: 0, y: 22, carry: [], seed: 1 }); }
  if (kind === 'display') { g.fillStyle = '#C98D52'; g.fillRect(-18, 2, 36, 10); g.fillStyle = '#FFF4DE'; g.fillRect(-20, -2, 40, 5); drawItem(g, 'beads', -9, -6, 11); drawItem(g, 'boat', 3, -6, 11); drawItem(g, 'bracelet', 13, -5, 10); }
  if (kind === 'umbrella') { for (let i = 0; i < 8; i++) { g.fillStyle = i % 2 ? '#fff' : '#35C6D8'; g.beginPath(); g.moveTo(0, -4); g.arc(0, -4, 17, Math.PI + i * Math.PI / 8, Math.PI + (i + 1) * Math.PI / 8); g.closePath(); g.fill(); } g.strokeStyle = '#6B4A2E'; g.lineWidth = 2.5; g.beginPath(); g.moveTo(0, -4); g.lineTo(0, 16); g.stroke(); }
  if (kind === 'bag') { g.fillStyle = '#F2A65A'; g.beginPath(); g.roundRect(-13, -8, 26, 22, 5); g.fill(); g.strokeStyle = '#A8793F'; g.lineWidth = 3; g.beginPath(); g.arc(0, -8, 7, Math.PI, 0); g.stroke(); }
  if (kind === 'shoes') { g.fillStyle = '#FF7A6B'; g.beginPath(); g.ellipse(-7, 0, 6, 13, -.2, 0, 7); g.ellipse(7, 2, 6, 13, .2, 0, 7); g.fill(); g.strokeStyle = '#fff'; g.lineWidth = 2.4; g.beginPath(); g.moveTo(-11, -4); g.lineTo(-7, -8); g.lineTo(-3, -4); g.moveTo(3, -2); g.lineTo(7, -6); g.lineTo(11, -2); g.stroke(); }
  return c;
}

// ================= UI: Crew & Upgrades sheet =================
function openBoard(a){ S.boardOpen = a.id; renderBoard(); }
function closeBoard(){ S.boardOpen = null; const el = document.querySelector('.sheet'); if (el) el.remove(); }
function renderBoard(){
  const a = AREAS.find(x => x.id === S.boardOpen); if (!a) return;
  const st = A(a.id);
  const rows = [
    ...a.machines.filter(built).map(m => ({ icon: m.output, name: m.name, desc: 'Works faster and holds 10 more.', lv: mlv(m), max: MACH_UP.length, cost: machUpCost(m), buy: () => { st.mlv[m.id] = mlv(m) + 1; toast(`${m.name} upgraded!`); } })),
    ...AREA_UPS.map(u => ({ icon: u.k, name: u.name, desc: u.desc, lv: st[u.k], max: u.max, cost: areaUpCost(a, u), buy: () => { st[u.k]++; ensureHelpers(); toast(u.k === 'crabs' ? 'A hermit crab joined your crew!' : u.k === 'pelicans' ? 'A pelican courier joined your crew!' : `${u.name} added!`); } })),
    ...GLOBAL_UPS.map(u => ({ icon: u.k, name: u.name, desc: u.desc, lv: save[u.k], max: u.max, cost: globalCost(u), buy: () => { save[u.k]++; toast(u.k === 'bag' ? `Your bag holds ${cap()} now` : 'You walk faster!'); } })),
  ];
  let el = document.querySelector('.sheet');
  if (!el) { el = document.createElement('div'); el.className = 'sheet'; document.body.appendChild(el); }
  el.innerHTML = `<header><h3>Crew & Upgrades<small>${a.name}</small></h3><button class="closeX" style="position:static" type="button" aria-label="Close">✕</button></header><div class="list"></div>`;
  const list = el.querySelector('.list');
  rows.forEach(r => {
    const row = document.createElement('div'); row.className = 'up';
    row.appendChild(iconCanvas(r.icon, 44));
    const maxed = r.cost == null;
    row.insertAdjacentHTML('beforeend', `<b>${r.name}</b><button class="buy ${maxed ? 'max' : ''}" type="button" ${maxed ? '' : `data-cost="${r.cost}"`} ${maxed || r.cost > save.coins ? 'disabled' : ''}>${maxed ? 'Max' : `<span class="coin sm"></span>${fmt(r.cost)}`}</button><span>${r.desc}<span class="lv">${Array.from({ length: r.max }, (_, i) => `<i class="${i < r.lv ? 'on' : ''}"></i>`).join('')}</span></span>`);
    row.querySelector('.buy').onclick = () => { if (maxed || r.cost > save.coins) return; save.coins -= r.cost; r.buy(); SFX.build(); sparkle(S.player.x, S.player.y - 20, ['#FFC83D', '#4CC38A', '#fff'], 18); persist(); renderBoard(); renderGoal(true); };
    list.appendChild(row);
  });
  el.querySelector('.closeX').onclick = () => { S.boardDismissed = a.id; closeBoard(); };
}

// ================= UI: modals =================
function modal(html, onClose){
  S.modal = true; const w = document.createElement('div'); w.className = 'modalWrap'; w.innerHTML = `<div class="modal">${html}</div>`; document.body.appendChild(w);
  const close = () => { w.remove(); S.modal = document.querySelector('.modalWrap') != null; onClose && onClose(); };
  w.querySelectorAll('[data-close]').forEach(b => b.onclick = () => { SFX.tap(); close(); });
  return { el: w, close };
}
function offlineCheck(){
  if (!save.lastSeen) return;
  const secs = Math.min(3 * 3600, (Date.now() - save.lastSeen) / 1000); if (secs < 120) return;
  let rate = 0; for (const a of AREAS) { const st = A(a.id); if (!st.unlocked) continue; rate += a.mult * (st.pelicans ? st.crabs * .03 + st.pelicans * .05 : st.crabs * .01); }
  const amt = Math.floor(rate * secs); if (amt < 5) return;
  const h = Math.floor(secs / 3600), mn = Math.floor(secs % 3600 / 60);
  const m = modal(`<h2>Welcome back!</h2><p>Your crew kept working for ${h ? h + ' hr ' : ''}${mn} min${secs >= 3 * 3600 - 1 ? ' (the most they can do alone)' : ''}.</p><div class="amt"><span class="coin"></span>${fmt(amt)}</div><button class="btn green" type="button" data-close>Collect</button>`, () => { save.coins += amt; save.stats.earned += amt; SFX.claim(); persist(); });
}
function openGift(){
  SFX.tap();
  const ready = save.giftDay !== today();
  const y = new Date(Date.now() - 864e5).toISOString().slice(0, 10);
  const streak = ready ? (save.giftDay === y ? Math.min(7, save.streak + 1) : 1) : save.streak;
  const best = Math.max(...AREAS.filter(a => A(a.id).unlocked).map(a => a.mult));
  const amt = Math.round(30 * best * (1 + .25 * (streak - 1)));
  const days = Array.from({ length: 7 }, (_, i) => `<span class="${i < streak ? 'on' : ''}">${i + 1}</span>`).join('');
  modal(`<button class="closeX" type="button" data-close aria-label="Close">✕</button><h2>Daily gift</h2>
    <p>${ready ? 'Come back every day. Your gift grows the longer your streak.' : 'You already opened today\'s gift. Come back tomorrow!'}</p>
    <div class="streak">${days}</div><div class="amt"><span class="coin"></span>${fmt(amt)}</div>
    ${ready ? `<button class="btn green" type="button" id="claimGift">Open gift</button>` : ''}`);
  const b = $('claimGift'); if (b) b.onclick = () => { save.giftDay = today(); save.streak = streak; save.coins += amt; save.stats.earned += amt; SFX.claim(); persist(); document.querySelector('.modalWrap').remove(); S.modal = false; toast(`+${fmt(amt)} coins. Day ${streak} streak!`); };
}
function openWardrobe(){
  SFX.tap();
  const m = modal(`<button class="closeX" type="button" data-close aria-label="Close">✕</button><h2>Wardrobe</h2><p>Hats unlock as you restore the coast.</p><div class="hats" id="hats"></div>`);
  const box = m.el.querySelector('#hats');
  const render = () => { box.innerHTML = '';
    HATS.forEach(h => { const own = !!save.hats[h.id], b = document.createElement('button'); b.type = 'button'; b.className = 'hat' + (save.hat === h.id ? ' on' : '') + (own ? '' : ' locked');
      const c = document.createElement('canvas'); c.width = 128; c.height = 112; const g = c.getContext('2d'); g.scale(2, 2); g.translate(32, 44); g.scale(1.25, 1.25); drawOtter(g, { x: 0, y: 0, face: 1, stack: [], bob: 0 }, h.id, true); b.appendChild(c);
      b.insertAdjacentHTML('beforeend', `${h.name}<span>${own ? (save.hat === h.id ? 'Wearing' : 'Wear') : h.how === 'buy' ? `<span class="coin sm"></span>${fmt(h.cost)}` : h.note}</span>`);
      b.onclick = () => { if (own) { save.hat = h.id; } else if (h.how === 'buy' && save.coins >= h.cost) { save.coins -= h.cost; save.hats[h.id] = true; save.hat = h.id; SFX.claim(); } else return; SFX.tap(); persist(); render(); };
      box.appendChild(b); }); };
  render();
}
$('giftBtn').onclick = openGift;
$('wardBtn').onclick = openWardrobe;
$('mute').onclick = () => {
  save.muted = !save.muted; persist();
  $('mute').setAttribute('aria-label', save.muted ? 'Sound off' : 'Sound on'); $('waves').style.opacity = save.muted ? .2 : 1;
  if (save.muted && ac) { ac.close(); ac = null; } else audio();
};
$('waves').style.opacity = save.muted ? .2 : 1;

// ================= UI: first-time tutorial (spotlight + tips) =================
let tutStep = -1, tipEl = null, tipStepShown = -1;
const beach = AREAS[0], kiln = MBY.kiln;
const TUT = [
  { center: true, text: '<b>Welcome to Tidy Tides!</b> The coast is covered in trash. Clean it up, turn it into things tourists love, and bring the beach back to life.', btn: "Let's go" },
  { target: () => { const w = waterline(), tr = S.trash.beach.filter(t => t.y > w + 4).sort((p1, p2) => dist(S.player.x, S.player.y, p1.x, p1.y) - dist(S.player.x, S.player.y, p2.x, p2.y))[0]; return tr ? { x: tr.x, y: tr.y, r: 26 } : { x: 200, y: w + 40, r: 40 }; },
    text: '<b>Drag anywhere</b> to walk. Walk over trash to pick it up.', done: () => S.player.stack.filter(i => i === 'bottle').length >= 2 },
  { target: () => ({ x: kiln.x, y: L.inY, r: 32 }), text: 'Drop the bottles into the <b>Sea-Glass Kiln</b> basket.', done: () => { const st = mst(kiln); return st.in + st.out > 0 && !S.player.stack.includes('bottle'); } },
  { target: () => ({ x: kiln.x, y: L.outY, r: 32 }), text: 'The kiln turns bottles into <b>sea-glass beads</b>. Grab them!', done: () => S.player.stack.includes('beads') || dispCount(beach) > 0 },
  { target: () => ({ x: 200, y: L.sellY - 9, r: 50 }), text: 'Stand here to <b>stock your counter</b>. Tourists buy from it on their own!', done: () => dispCount(beach) > 0 || save.stats.sold.beads > 0 },
  { dom: 'coinPill', text: 'Every sale earns <b>coins</b>.', btn: 'Next' },
  { dom: 'goal', text: '<b>Goals</b> show what to do next. Finish them for bonus coins.', btn: 'Next' },
  { target: () => ({ x: 44, y: L.row0 - 8, r: 42 }), text: 'Spend coins on <b>helpers and upgrades</b> at the Crew & Upgrades board.', btn: 'Next' },
  { dom: 'healthBox', text: 'Everything you recycle <b>heals the beach</b>. Keep going and see what comes back!', btn: 'Got it' },
];
function startTutorial(){ tutStep = 0; }
function endTutorial(){ tutStep = -1; save.tutDone = true; if (tipEl) { tipEl.remove(); tipEl = null; } persist(); renderGoal(true); }
function tutTarget(step){
  if (step.center) return null;
  if (step.dom) { const r = $(step.dom).getBoundingClientRect(); return { sx: r.left + r.width / 2, sy: r.top + r.height / 2, r: Math.max(r.width, r.height) / 2 + 10 }; }
  const t = step.target(); return { sx: (t.x - camX) * scale, sy: t.y * scale, r: t.r * scale };
}
function tutorialTick(){
  if (tutStep < 0) return;
  const step = TUT[tutStep];
  if (tutStep >= 1 && tutStep <= 2 && S.trash.beach.filter(t => t.type === 'bottle').length < 3) spawnOne(beach, true);
  if (step.done && step.done()) { SFX.claim(); tutStep++; if (tutStep >= TUT.length) return endTutorial(); }
  const cur = TUT[tutStep];
  if (tipStepShown !== tutStep) {
    tipStepShown = tutStep; if (tipEl) tipEl.remove();
    tipEl = document.createElement('div'); tipEl.className = 'tip';
    tipEl.innerHTML = `<button class="skip" type="button">Skip</button><span class="step">Step ${tutStep + 1} of ${TUT.length}</span>${cur.text}${cur.btn ? `<div><button class="tnext" type="button">${cur.btn}</button></div>` : ''}`;
    document.body.appendChild(tipEl);
    tipEl.querySelector('.skip').onclick = () => { SFX.tap(); endTutorial(); };
    const nb = tipEl.querySelector('.tnext'); if (nb) nb.onclick = () => { SFX.tap(); tutStep++; if (tutStep >= TUT.length) endTutorial(); };
    if (tutStep === 6) renderGoal(true);
  }
  // keep the tip next to its target
  const t = tutTarget(cur), vw = innerWidth, vh = innerHeight, tw = tipEl.offsetWidth, th = tipEl.offsetHeight;
  let left, top;
  if (!t) { left = (vw - tw) / 2; top = vh * .42 - th / 2; }
  else { left = clamp(t.sx - tw / 2, 12, vw - tw - 12); top = t.sy > vh * .5 ? t.sy - t.r - th - 14 : t.sy + t.r + 14; top = clamp(top, 12, vh - th - 12); }
  tipEl.style.left = left + 'px'; tipEl.style.top = top + 'px';
}
function drawSpotlight(){
  if (tutStep < 0) return;
  const t = tutTarget(TUT[tutStep]), vw = innerWidth, vh = innerHeight;
  ctx.fillStyle = 'rgba(8,30,45,.55)'; ctx.beginPath(); ctx.rect(0, 0, vw, vh);
  if (t) { const pulse = reduce ? 0 : Math.sin(S.t * 4) * 3; ctx.arc(t.sx, t.sy, t.r + pulse, 0, Math.PI * 2, true); }
  ctx.fill('evenodd');
  if (t) { ctx.strokeStyle = 'rgba(255,255,255,.9)'; ctx.lineWidth = 3; ctx.setLineDash([8, 6]); ctx.lineDashOffset = -S.t * 20; ctx.beginPath(); ctx.arc(t.sx, t.sy, t.r + (reduce ? 0 : Math.sin(S.t * 4) * 3), 0, 7); ctx.stroke(); ctx.setLineDash([]); }
}

// ================= START & LOOP =================
let running = false, last = performance.now(), saveT = 0;
function start(){
  $('title').hidden = true; audio(); ensureHelpers();
  S.player.x = 200; S.player.y = L.row0 - 10; camX = 0;
  const day = new Date().getDay(); S.storm = day === 0 || day === 6;
  for (let i = 0; i < 6; i++) spawnOne(beach, true);
  AREAS.forEach(a => { if (A(a.id).unlocked && a.i) for (let i = 0; i < 4; i++) spawnOne(a, true); });
  running = true; last = performance.now();
  if (!save.tutDone) startTutorial();
  else { offlineCheck(); if (S.storm) setTimeout(() => toast('Storm weekend! Extra trash is washing up.'), 800); }
  persist();
}
function loop(now){
  const dt = Math.min(.05, (now - last) / 1000); last = now;
  if (running) { update(dt); tutorialTick(); saveT += dt; if (saveT > 3) { saveT = 0; persist(); } }
  else S.t += dt;
  draw(); if (running) hud();
  requestAnimationFrame(loop);
}
document.addEventListener('visibilitychange', () => { if (document.hidden && running) persist(); last = performance.now(); });
$('play').onclick = start;
layout(); S.player.y = L.row0 - 10;
if (location.hash === '#test') window.__tt = { S, save, AREAS, MACHINES, MBY, get L(){ return L; }, get camX(){ return camX; }, pads, waterline, mst, built, dispCount, dispCap, goalAt, goalProgress, claimGoal, areaUpCost, machUpCost, globalCost, AREA_UPS, GLOBAL_UPS, ensureHelpers, cap, get tut(){ return tutStep; }, endTutorial, start, openBoard, closeBoard };
requestAnimationFrame(loop);
})();
