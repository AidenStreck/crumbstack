<title>Tidy Tides</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap">
<style>
/* Layout: full-screen portrait play field (canvas). Top-down beach: sea and tide at the top, workshop in the middle,
   boardwalk shack at the bottom. HUD floats on top: coins, beach health, sound. Single deliberate sunny look. */
:root{
  --sea:#2FB8C9; --sea-deep:#1C7F9A; --sand:#F4D9A0; --coral:#FF7A6B; --coral-d:#D9544A;
  --ink:#16324A; --ink-2:#4F6B80; --foam:#FFFFFF; --leaf:#4CC38A; --gold:#FFC83D; --gold-d:#D99A12;
  --display:"Fredoka","Arial Rounded MT Bold","Trebuchet MS",sans-serif;
  color-scheme:light;
}
html,body{height:100%;margin:0}
body{background:#1C7F9A;font-family:var(--display);overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;color:var(--ink)}
#game{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.hud{position:fixed;left:0;right:0;top:0;padding:calc(10px + env(safe-area-inset-top,0px)) 12px 0;display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:start;pointer-events:none;z-index:2}
.pill{pointer-events:auto;display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.92);border-radius:999px;padding:5px 12px 5px 6px;font-weight:700;font-size:20px;box-shadow:0 3px 0 rgba(22,50,74,.18);font-variant-numeric:tabular-nums}
.pill .coin{width:24px;height:24px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#FFE58A,var(--gold) 55%,var(--gold-d));box-shadow:inset 0 0 0 2px rgba(150,95,0,.35)}
.health{background:rgba(255,255,255,.92);border-radius:16px;padding:6px 10px 7px;box-shadow:0 3px 0 rgba(22,50,74,.18);min-width:0;width:100%;max-width:340px;justify-self:center;box-sizing:border-box}
.health .row{display:flex;justify-content:space-between;gap:8px;font-size:12.5px;font-weight:600;color:var(--ink-2);white-space:nowrap}
.health .row b{color:var(--ink)}
.health .bar{height:9px;background:#E2EEF2;border-radius:999px;margin-top:4px;overflow:hidden}
.health .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#8BD3A5,var(--leaf));border-radius:999px;transition:width .4s}
.health .next{font-size:11.5px;color:var(--ink-2);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconBtn{pointer-events:auto;width:40px;height:40px;border-radius:50%;border:0;background:rgba(255,255,255,.92);box-shadow:0 3px 0 rgba(22,50,74,.18);display:grid;place-items:center;cursor:pointer;color:var(--ink)}
.iconBtn svg{width:22px;height:22px}
.iconBtn:focus-visible,.btn:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
.toast{position:fixed;left:50%;top:calc(96px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:3;background:var(--ink);color:#fff;font-weight:600;font-size:17px;padding:9px 18px;border-radius:999px;box-shadow:0 8px 20px rgba(0,0,0,.25);white-space:nowrap;pointer-events:none;animation:pop .35s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{from{transform:translateX(-50%) scale(.6);opacity:0}to{transform:translateX(-50%) scale(1);opacity:1}}
.overlay{position:fixed;inset:0;z-index:5;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center;padding:24px;background:linear-gradient(rgba(28,127,154,.55),rgba(22,50,74,.75))}
.logo{font-weight:700;font-size:clamp(52px,16vw,76px);line-height:.9;color:#fff;text-shadow:0 5px 0 var(--sea-deep),0 12px 30px rgba(0,0,0,.3);transform:rotate(-3deg)}
.logo span{display:block;color:var(--gold)}
.tag{color:#fff;font-size:18px;font-weight:500;max-width:28ch;line-height:1.3}
.btn{font-family:var(--display);font-weight:700;font-size:26px;border:0;border-radius:20px;padding:14px 46px;color:#fff;cursor:pointer;background:linear-gradient(#FF9A8C,var(--coral) 60%,var(--coral-d));box-shadow:0 5px 0 #A83A33,0 10px 20px rgba(0,0,0,.25)}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 #A83A33}
.how{color:#EAF8FB;font-size:15px;font-weight:500;max-width:30ch;line-height:1.4}
.proto{position:fixed;top:calc(58px + env(safe-area-inset-top,0px));left:14px;font-size:11px;font-weight:600;color:rgba(255,255,255,.75);z-index:1;pointer-events:none;letter-spacing:.5px}
@media (prefers-reduced-motion:reduce){.toast{animation:none}.health .bar i{transition:none}}
</style>

<canvas id="game" aria-label="Tidy Tides beach"></canvas>
<div class="hud">
  <div class="pill" aria-label="Coins"><span class="coin"></span><span id="coins">0</span></div>
  <div class="health"><div class="row"><span>Beach health</span><b id="hp">0%</b></div><div class="bar"><i id="hpBar"></i></div><div class="next" id="next">Next: seagulls return (5 recycled)</div></div>
  <button class="iconBtn" id="mute" aria-label="Sound on"><svg viewBox="0 0 24 24"><path d="M4 9.5h3.5L12.5 5v14l-5-4.5H4z" fill="currentColor"/><path id="waves" d="M15.5 9a4 4 0 010 6M18 6.5a7.5 7.5 0 010 11" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>
</div>
<div class="overlay" id="title">
  <div class="logo">Tidy<span>Tides</span></div>
  <div class="tag">Clean the beach. Build a business. Bring it back to life.</div>
  <button class="btn" id="play">Play</button>
  <div class="how">Drag anywhere to walk. Pick up trash at low tide, recycle it, and sell what you make at your shack.</div>
</div>
<div class="proto">PROTOTYPE</div>

<script>
(() => {
const $ = id => document.getElementById(id);
const cv = $('game'), ctx = cv.getContext('2d');
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const rnd = (a,b) => a + Math.random()*(b-a), clamp = (v,a,b) => Math.max(a, Math.min(b, v));
const pick = a => a[Math.floor(Math.random()*a.length)];
const dist = (a,b,x,y) => Math.hypot(a-x, b-y);

// ================= DATA =================
const MACHINES = [
  { id:'kiln',  name:'Sea-Glass Kiln', input:'bottle', output:'beads',    cost:0,   col:'#35C6D8', x:75 },
  { id:'loom',  name:'Rope Loom',      input:'rope',   output:'bracelet', cost:25,  col:'#F2A65A', x:200 },
  { id:'press', name:'Can Press',      input:'can',    output:'boat',     cost:100, col:'#E4606D', x:325 },
];
const PRICE = { beads:4, bracelet:7, boat:12 };
const UPGRADES = [
  // Upgrade spots sit on the far left and right, off the walking path between machines and the shack.
  { id:'bag',      label:'Bigger bag',     costs:[30,80,160],   x:44,  row:0, req: s => s.sold >= 3 },
  { id:'shoes',    label:'Flip-flops',     costs:[45,110],      x:44,  row:1, req: s => s.sold >= 6 },
  { id:'crab',     label:'Hire a crab',    costs:[50,120,240],  x:356, row:0, req: s => s.unlocked.loom },
  { id:'umbrella', label:'Umbrellas',      costs:[180],         x:356, row:1, req: s => s.unlocked.press },
];
const MILESTONES = [
  { at:5,   text:'The seagulls are back!', short:'seagulls return' },
  { at:15,  text:'A sea turtle came to nest!', short:'a sea turtle nests' },
  { at:35,  text:'The water is clearing up!', short:'the water clears' },
  { at:60,  text:'Starfish everywhere!', short:'starfish return' },
  { at:100, text:'Dolphins! The beach is healed!', short:'dolphins' },
];

// ================= SAVE =================
const KEY = 'tidytides-save-v1';
let save = { coins:0, recycled:0, sold:0, unlocked:{ kiln:true }, lv:{ bag:0, shoes:0, crab:0, umbrella:0 }, pads:{}, tut:0, muted:false };
try { const s = JSON.parse(localStorage.getItem(KEY)); if (s && s.unlocked) save = Object.assign(save, s, { lv: Object.assign(save.lv, s.lv||{}) }); } catch(e){}
function persist(){ try { localStorage.setItem(KEY, JSON.stringify(save)); } catch(e){} }

// ================= LAYOUT =================
const W = 400; let H = 700, scale = 1, dpr = 1, sandTex = null, offX = 0;
let L = {};
function layout(){
  dpr = Math.min(devicePixelRatio || 1, 2);
  const sw = innerWidth, sh = innerHeight;
  scale = Math.min(sw / W, sh / 720);               // phones: fit width; wide screens: fit height and center
  H = sh / scale; offX = (sw / scale - W) / 2;
  cv.width = sw * dpr; cv.height = sh * dpr;
  // Rows are stacked with fixed minimum gaps, then stretched on taller screens.
  const seaLow = H * .11, seaHigh = H * .25, trashMax = seaHigh + 95;
  const machY = Math.max(trashMax + 110, H * .5);
  const outY = machY + 62, row0 = outY + 74, row1 = row0 + 66;
  const sellY = Math.max(row1 + 10, H * .77);
  L = { seaLow, seaHigh, trashMax, machY, row0, row1, sellY, counterY: sellY + 40, walkY: Math.min(sellY + 110, H - 20), playerMaxY: sellY + 8 };
  MACHINES.forEach(m => { m.y = machY; m.inY = machY - 66; m.outY = outY; });
  // scenery that never sits on a walking path
  let seed = 11; const r = () => (seed = (seed * 9301 + 49297) % 233280) / 233280;
  L.shells = Array.from({ length: 14 }, () => ({ x: r() * W, y: trashMax + 10 + r() * (machY - trashMax - 60), c: ['#FFD6D0', '#FFFFFF', '#FFC8A8', '#F6B6C8'][Math.floor(r() * 4)], rot: r() * 6, k: r() < .5 }));
  L.rocks = [{ x: 22, y: seaHigh + 34, s: 1.2 }, { x: 382, y: seaHigh + 64, s: 1 }, { x: 360, y: trashMax + 26, s: .7 }];
  L.grass = []; for (let x = 6; x < W; x += 13) if (x < 118 || x > 282) L.grass.push({ x, y: sellY + 30 + r() * 6, h: 7 + r() * 6 });
  buildSand();
}
function buildSand(){
  sandTex = document.createElement('canvas'); sandTex.width = 256; sandTex.height = 256;
  const g = sandTex.getContext('2d');
  for (let i = 0; i < 420; i++) { g.fillStyle = `rgba(${Math.random()<.5?'160,120,60':'255,255,240'},${rnd(.08,.22)})`; g.beginPath(); g.arc(rnd(0,256), rnd(0,256), rnd(.6,1.8), 0, 7); g.fill(); }
}
addEventListener('resize', layout);

// ================= STATE =================
const S = {
  t:0, player:{ x:200, y:0, vx:0, vy:0, face:1, stack:[], bob:0 },
  trash:[], machines:{}, crabs:[], tourists:[], fx:[], pops:[], coinsFly:[],
  spawnT:0, touristT:1, dropT:0, sellT:0, payT:0, lastWater:0, dwell:0, dwellKey:null,
  flies:[], steps:[], smoke:[], stepT:0, stepAlt:1, lean:0,
};
MACHINES.forEach(m => S.machines[m.id] = { in:0, out:0, t:0 });
function cap(){ return 6 + save.lv.bag * 3; }
function speed(){ return 125 + save.lv.shoes * 30; }
function health(){ return Math.min(1, save.recycled / 100); }
function waterline(){ const k = (Math.sin(S.t * 2 * Math.PI / 40) + 1) / 2; return L.seaLow + (L.seaHigh - L.seaLow) * k; }

// ================= SOUND (tiny synth) =================
let ac = null, waveGain = null;
function audio(){
  if (ac || save.muted) return;
  const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
  ac = new AC();
  // soft surf: filtered noise that swells with the tide
  const buf = ac.createBuffer(1, ac.sampleRate * 2, ac.sampleRate), d = buf.getChannelData(0);
  for (let i = 0; i < d.length; i++) d[i] = Math.random()*2-1;
  const src = ac.createBufferSource(); src.buffer = buf; src.loop = true;
  const f = ac.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 520;
  waveGain = ac.createGain(); waveGain.gain.value = .0;
  src.connect(f); f.connect(waveGain); waveGain.connect(ac.destination); src.start();
}
function blip(freq, dur, type, vol, delay){
  if (!ac || save.muted) return;
  const t = ac.currentTime + (delay||0), o = ac.createOscillator(), g = ac.createGain();
  o.type = type||'triangle'; o.frequency.setValueAtTime(freq, t);
  g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(vol||.12, t+.01); g.gain.exponentialRampToValueAtTime(.0001, t+dur);
  o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t+dur+.05);
}
const SFX = {
  pick(n){ blip(700 + n*40, .08, 'triangle', .1); },
  drop(){ blip(420, .07, 'sine', .1); },
  sell(){ blip(988, .07, 'square', .06); blip(1319, .18, 'square', .06, .07); },
  build(){ [523,659,784,1047].forEach((f,i)=>blip(f,.18,'triangle',.1,i*.07)); },
  pay(){ blip(1200, .03, 'square', .03); },
  milestone(){ [659,784,988,1319].forEach((f,i)=>blip(f,.35,'sine',.12,i*.12)); },
};
$('mute').onclick = () => {
  save.muted = !save.muted; persist();
  $('mute').setAttribute('aria-label', save.muted ? 'Sound off' : 'Sound on');
  $('waves').style.opacity = save.muted ? .2 : 1;
  if (save.muted && ac) { ac.close(); ac = null; } else audio();
};
$('waves').style.opacity = save.muted ? .2 : 1;

// ================= INPUT (drag joystick + keys) =================
const joy = { on:false, ox:0, oy:0, x:0, y:0 };
const keys = {};
cv.addEventListener('pointerdown', e => { audio(); joy.on = true; joy.ox = joy.x = e.clientX; joy.oy = joy.y = e.clientY; try { cv.setPointerCapture(e.pointerId); } catch(_){} });
cv.addEventListener('pointermove', e => { if (joy.on) { joy.x = e.clientX; joy.y = e.clientY; } });
const end = () => { joy.on = false; };
cv.addEventListener('pointerup', end); cv.addEventListener('pointercancel', end);
addEventListener('keydown', e => { keys[e.key.toLowerCase()] = true; audio(); });
addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });

// ================= HELPERS =================
let toastT = 0;
function toast(msg){ let t = document.querySelector('.toast'); if (t) t.remove(); t = document.createElement('div'); t.className = 'toast'; t.textContent = msg; document.body.appendChild(t); clearTimeout(toastT); toastT = setTimeout(() => t.remove(), 2600); }
function pop(text, x, y, col){ S.pops.push({ text, x, y, col: col||'#fff', t:0 }); }
function sparkle(x, y, cols, n){ for (let i = 0; i < (reduce ? 3 : n); i++){ const a = rnd(0, 7); S.fx.push({ x, y, vx: Math.cos(a)*rnd(30,90), vy: Math.sin(a)*rnd(30,90) - 40, t:0, life: rnd(.4,.8), c: pick(cols), s: rnd(1.5,3.5) }); } }
function fly(type, x0, y0, x1, y1, dur){ S.flies.push({ type, x0, y0, x1, y1, t: 0, dur: dur || .22 }); }
function stackTopY(){ return S.player.y - 30 - S.player.stack.length * 9; }
function productTypes(){ return MACHINES.filter(m => save.unlocked[m.id]).map(m => m.output); }
function trashTypes(){ return MACHINES.filter(m => save.unlocked[m.id]).map(m => m.input); }

// ================= ART =================
function drawItem(c, type, x, y, s){
  c.save(); c.translate(x, y); c.scale(s/14, s/14); c.lineJoin = 'round'; c.lineCap = 'round';
  switch (type) {
    case 'bottle':
      c.rotate(-.5); c.fillStyle = 'rgba(70,170,110,.9)'; c.beginPath(); c.roundRect(-4,-7,8,13,3); c.fill();
      c.fillRect(-2,-10,4,4); c.fillStyle = '#8B5A2B'; c.fillRect(-2,-11,4,2);
      c.fillStyle = 'rgba(255,255,255,.5)'; c.fillRect(-2.5,-5,1.5,8); break;
    case 'rope':
      c.strokeStyle = '#A8793F'; c.lineWidth = 2.6;
      c.beginPath(); c.arc(0,0,5.5,0,6); c.stroke(); c.beginPath(); c.arc(1,1,2.5,0,5); c.stroke();
      c.beginPath(); c.moveTo(5,1); c.quadraticCurveTo(9,6,6,9); c.stroke(); break;
    case 'can':
      c.rotate(.4); c.fillStyle = '#E4606D'; c.beginPath(); c.roundRect(-4.5,-6,9,12,2); c.fill();
      c.fillStyle = '#D5DCE3'; c.fillRect(-4.5,-6,9,2.2); c.fillRect(-4.5,4,9,2);
      c.fillStyle = '#fff'; c.fillRect(-3,-1.5,6,2); break;
    case 'beads':
      [[-3.5,1,'#35C6D8'],[3.5,1,'#7FE0EA'],[0,-4,'#5AA7F0']].forEach(([bx,by,col]) => { c.fillStyle = col; c.beginPath(); c.arc(bx,by,3.6,0,7); c.fill(); c.fillStyle = 'rgba(255,255,255,.7)'; c.beginPath(); c.arc(bx-1.2,by-1.2,1.1,0,7); c.fill(); }); break;
    case 'bracelet':
      c.strokeStyle = '#F2A65A'; c.lineWidth = 3.2; c.beginPath(); c.ellipse(0,0,6.5,4.5,0,0,7); c.stroke();
      c.strokeStyle = '#FFE0B8'; c.lineWidth = 1.2; c.setLineDash([2,2]); c.beginPath(); c.ellipse(0,0,6.5,4.5,0,0,7); c.stroke(); c.setLineDash([]);
      c.fillStyle = '#35C6D8'; c.beginPath(); c.arc(0,4.5,2,0,7); c.fill(); break;
    case 'boat':
      c.fillStyle = '#E4606D'; c.beginPath(); c.moveTo(-7,1); c.lineTo(7,1); c.lineTo(4.5,5.5); c.lineTo(-4.5,5.5); c.closePath(); c.fill();
      c.fillStyle = '#fff'; c.beginPath(); c.moveTo(0,0); c.lineTo(0,-8); c.lineTo(5.5,0); c.closePath(); c.fill();
      c.fillStyle = '#FFC83D'; c.beginPath(); c.moveTo(-.8,0); c.lineTo(-.8,-6); c.lineTo(-5,0); c.closePath(); c.fill(); break;
  }
  c.restore();
}
function drawOtter(c, p){
  const bob = reduce ? 0 : Math.sin(p.bob) * 1.6;
  c.save(); c.translate(p.x, p.y);
  c.fillStyle = 'rgba(22,50,74,.18)'; c.beginPath(); c.ellipse(0, 12, 13, 5, 0, 0, 7); c.fill();
  c.translate(0, bob);
  // tail
  c.fillStyle = '#7A4A2A'; c.beginPath(); c.ellipse(-p.face*10, 9, 8, 3.5, p.face*.5, 0, 7); c.fill();
  // body
  c.fillStyle = '#9A5E35'; c.beginPath(); c.ellipse(0, 3, 11, 12, 0, 0, 7); c.fill();
  c.fillStyle = '#F2D6B0'; c.beginPath(); c.ellipse(0, 5, 6.5, 8, 0, 0, 7); c.fill();
  // head
  c.fillStyle = '#9A5E35'; c.beginPath(); c.arc(0, -10, 9.5, 0, 7); c.fill();
  c.beginPath(); c.arc(-7.5, -16, 3, 0, 7); c.arc(7.5, -16, 3, 0, 7); c.fill();
  c.fillStyle = '#F2D6B0'; c.beginPath(); c.ellipse(p.face*1.5, -7, 6, 4.5, 0, 0, 7); c.fill();
  c.fillStyle = '#16324A'; c.beginPath(); c.arc(-3.5 + p.face*1.5, -12, 1.6, 0, 7); c.arc(3.5 + p.face*1.5, -12, 1.6, 0, 7); c.fill();
  c.beginPath(); c.ellipse(p.face*1.5, -8.5, 2, 1.4, 0, 0, 7); c.fill();
  // sun hat
  c.fillStyle = '#FFC83D'; c.beginPath(); c.ellipse(0, -17, 12, 4, 0, 0, 7); c.fill();
  c.beginPath(); c.ellipse(0, -20, 6.5, 4.5, 0, Math.PI, 0); c.fill();
  c.fillStyle = '#FF7A6B'; c.fillRect(-6.5, -19.5, 13, 2);
  // carried stack
  p.stack.forEach((it, i) => drawItem(c, it, (reduce ? 0 : Math.sin(S.t*6 + i)*.6) - p.face*2 + (reduce ? 0 : S.lean * i * 1.3), -30 - i*9, 14));
  c.restore();
}
function drawCrab(c, k){
  c.save(); c.translate(k.x, k.y);
  c.fillStyle = 'rgba(22,50,74,.18)'; c.beginPath(); c.ellipse(0, 6, 10, 3.5, 0, 0, 7); c.fill();
  const w = reduce ? 0 : Math.sin(S.t*14 + k.seed) * (k.moving ? 1.5 : .3);
  c.strokeStyle = '#D9544A'; c.lineWidth = 1.8; c.lineCap = 'round';
  for (const d of [-1,1]) for (let i = 0; i < 3; i++) { c.beginPath(); c.moveTo(d*5, i*2); c.lineTo(d*(10+(i%2?w:-w)), 3+i*2.5); c.stroke(); }
  c.fillStyle = '#FF7A6B'; c.beginPath(); c.ellipse(0, 0, 8, 6, 0, 0, 7); c.fill();
  c.beginPath(); c.arc(-9, -5 + w, 3.2, 0, 7); c.arc(9, -5 - w, 3.2, 0, 7); c.fill();
  c.fillStyle = '#fff'; c.beginPath(); c.arc(-2.5, -6, 2, 0, 7); c.arc(2.5, -6, 2, 0, 7); c.fill();
  c.fillStyle = '#16324A'; c.beginPath(); c.arc(-2.5, -6, 1, 0, 7); c.arc(2.5, -6, 1, 0, 7); c.fill();
  if (k.carry.length) k.carry.forEach((it, i) => drawItem(c, it, 0, -14 - i*8, 12));
  c.restore();
}
const SHIRTS = ['#FF7A6B','#35C6D8','#FFC83D','#8E7CF0','#4CC38A','#F2A65A'], SKINS = ['#F7D2B0','#E9B48A','#C98E62','#8D5A3B'];
function drawTourist(c, t){
  c.save(); c.translate(t.x, t.y);
  c.fillStyle = 'rgba(22,50,74,.18)'; c.beginPath(); c.ellipse(0, 10, 10, 4, 0, 0, 7); c.fill();
  const b = reduce ? 0 : Math.abs(Math.sin(t.walk)) * (t.moving ? 2 : 0);
  c.translate(0, -b);
  c.fillStyle = t.shirt; c.beginPath(); c.ellipse(0, 3, 9, 9, 0, 0, 7); c.fill();
  c.fillStyle = t.skin; c.beginPath(); c.arc(0, -9, 7, 0, 7); c.fill();
  if (t.hat) { c.fillStyle = t.hat; c.beginPath(); c.ellipse(0, -13, 10, 3.2, 0, 0, 7); c.fill(); c.beginPath(); c.ellipse(0, -15, 5, 3.5, 0, Math.PI, 0); c.fill(); }
  c.fillStyle = '#16324A'; c.fillRect(-5, -10.5, 4, 2.2); c.fillRect(1, -10.5, 4, 2.2); c.fillRect(-1, -10, 2, 1);
  if (t.happy) { c.strokeStyle = '#16324A'; c.lineWidth = 1.4; c.beginPath(); c.arc(0, -6, 2.5, .2, Math.PI - .2); c.stroke(); }

    c.beginPath(); c.moveTo(-4, 11); c.lineTo(0, 17); c.lineTo(4, 11); c.fill();

// ================= GAME LOGIC =================
function start(){
  $('title').hidden = true; audio();
  S.player.y = L.row0 - 10;
  for (let i = 0; i < save.lv.crab; i++) addCrab();
  last = performance.now();
  running = true;
}
function addCrab(){ S.crabs.push({ x: rnd(60, 340), y: L.machY - 90, carry: [], target: null, seed: Math.random()*9, moving: false, home: { x: rnd(40, 360), y: L.machY - 80 } }); }

function spawnTrash(dt){
  const wl = waterline(), receding = wl < S.lastWater; S.lastWater = wl;
  S.spawnT -= dt;
  const max = 10 + save.lv.crab * 3;
  if (S.spawnT <= 0 && S.trash.length < max) {
    S.spawnT = receding ? rnd(.5, 1) : rnd(1.6, 2.6);
    const types = trashTypes();
    S.trash.push({ type: pick(types), x: rnd(20, 380), y: clamp(wl + rnd(6, 60), wl + 6, L.trashMax), rot: rnd(-1, 1), claimed: null, born: S.t });
  }
}
function takeTopOf(stack, type){ for (let i = stack.length - 1; i >= 0; i--) if (stack[i] === type) { stack.splice(i, 1); return true; } return false; }

let payPad = null;
function pads(){
  // Which unlock pads are showing right now
  const list = [];
  for (const m of MACHINES) if (!save.unlocked[m.id] && (m.id === 'loom' ? save.sold >= 1 : save.unlocked.loom))
    list.push({ key: 'm:' + m.id, x: m.x, y: m.y, cost: m.cost, label: m.name, icon: m.output, kind: 'machine', id: m.id });
  for (const u of UPGRADES) { const lv = save.lv[u.id]; if (lv < u.costs.length && u.req(save))
    list.push({ key: 'u:' + u.id + lv, x: u.x, y: u.row ? L.row1 : L.row0, cost: u.costs[lv], label: u.label + (u.costs.length > 1 ? ' ' + (lv + 1) : ''), kind: 'upgrade', id: u.id }); }
  return list;
}
function complete(pad){
  if (pad.kind === 'machine') { save.unlocked[pad.id] = true; toast(`${pad.label} built!`); }
  else {
    save.lv[pad.id]++;
    if (pad.id === 'crab') { addCrab(); toast('A hermit crab joined your crew!'); }
    if (pad.id === 'bag') toast(`Bag holds ${cap()} now`);
    if (pad.id === 'shoes') toast('You walk faster!');
    if (pad.id === 'umbrella') toast('More tourists are coming!');
  }
  delete save.pads[pad.key];
  SFX.build(); sparkle(pad.x, pad.y, ['#FFC83D','#FF7A6B','#35C6D8','#fff'], 24); persist();
}

function update(dt){
  S.t += dt;
  const p = S.player, wl = waterline();
  // movement
  let mx = 0, my = 0;
  if (joy.on) { const dx = joy.x - joy.ox, dy = joy.y - joy.oy, m = Math.hypot(dx, dy); if (m > 6) { mx = dx / Math.max(m, 40); my = dy / Math.max(m, 40); } }
  if (keys['arrowleft'] || keys['a']) mx -= 1; if (keys['arrowright'] || keys['d']) mx += 1;
  if (keys['arrowup'] || keys['w']) my -= 1; if (keys['arrowdown'] || keys['s']) my += 1;
  const mm = Math.hypot(mx, my); if (mm > 1) { mx /= mm; my /= mm; }
  p.x = clamp(p.x + mx * speed() * dt, 14, W - 14);
  p.y = clamp(p.y + my * speed() * dt, wl + 12, L.playerMaxY);
  if (mm > .1) { p.bob += dt * 14; if (Math.abs(mx) > .2) p.face = mx > 0 ? 1 : -1;
    S.stepT -= dt; if (S.stepT <= 0 && p.y < L.sellY - 20) { S.stepT = .16; S.stepAlt *= -1; S.steps.push({ x: p.x + S.stepAlt * 4, y: p.y + 10, t: 0, a: Math.atan2(my, mx) }); if (S.steps.length > 70) S.steps.shift(); } }
  S.lean += ((-mx * speed() / 125) - S.lean) * Math.min(1, dt * 6);

  spawnTrash(dt);
  // pick up trash
  for (const tr of S.trash) {
    if (tr.dead || p.stack.length >= cap() || tr.y < wl + 4) continue;
    if (dist(p.x, p.y, tr.x, tr.y) < 20) { tr.dead = true; if (tr.claimed) tr.claimed.target = null; fly(tr.type, tr.x, tr.y, p.x, stackTopY()); p.stack.push(tr.type); SFX.pick(p.stack.length); }
  }
  S.trash = S.trash.filter(t => !t.dead);

  // machines: drop inputs, process, pick up outputs
  S.dropT -= dt;
  for (const m of MACHINES) {
    if (!save.unlocked[m.id]) continue;
    const st = S.machines[m.id];
    if (S.dropT <= 0 && dist(p.x, p.y, m.x, m.inY) < 26 && st.in < 20 && takeTopOf(p.stack, m.input)) { fly(m.input, p.x, stackTopY(), m.x, m.inY - 4); st.in++; S.dropT = .1; SFX.drop(); }
    if (S.dropT <= 0 && dist(p.x, p.y, m.x, m.outY) < 26 && st.out > 0 && p.stack.length < cap()) { fly(m.output, m.x, m.outY - 6, p.x, stackTopY()); st.out--; p.stack.push(m.output); S.dropT = .1; SFX.pick(p.stack.length); }
    if (st.in > 0 && st.out < 20) {
      st.t += dt;
      if (st.t >= 1.1) { st.t = 0; st.in--; st.out++; fly(m.output, m.x, m.y + 8, m.x, m.outY - 4, .3); recycle(m); }
      st.smokeT = (st.smokeT || 0) - dt; if (st.smokeT <= 0) { st.smokeT = .32; S.smoke.push({ x: m.x + (m.id === 'kiln' ? 17 : m.id === 'press' ? 0 : -14), y: m.y - (m.id === 'kiln' ? 50 : 34), t: 0, id: m.id }); }
    } else st.t = 0;
  }

  // selling at the shack
  S.sellT -= dt;
  // Serve whoever in line wants something you're carrying (front of the line first).
  const line = S.tourists.filter(t => t.arrived && !t.leaving).sort((a, b) => a.slot - b.slot);
  for (const t of line) { t.wait = (t.wait || 0) + dt;
    // after a long wait, a customer settles for something you have
    if (t.wait > 14 && !p.stack.includes(t.want)) { const have = p.stack.find(i => PRICE[i]); if (have) { t.want = have; t.wait = 0; } } }
  if (S.sellT <= 0 && Math.abs(p.x - 200) < 56 && p.y > L.sellY - 18) {
    const buyer = line.find(t => p.stack.includes(t.want));
    if (buyer && takeTopOf(p.stack, buyer.want)) {
      fly(buyer.want, p.x, stackTopY(), buyer.x, buyer.y - 12, .25);
      buyer.left--; buyer.wait = 0; S.sellT = .22; const v = PRICE[buyer.want];
      save.coins += v; save.sold++; SFX.sell(); pop('+' + v, buyer.x, buyer.y - 40, '#FFC83D');
      S.coinsFly.push({ x: buyer.x, y: buyer.y - 20, t: 0 });
      if (buyer.left <= 0) { buyer.leaving = true; buyer.happy = true; const k = buyer.slot; S.tourists.forEach(t => { if (!t.leaving && t.slot > k) t.slot--; }); }
    }
  }

  // unlock pads: stand on one to pay into it
  S.payT -= dt;
  payPad = null;
  for (const pad of pads()) {
    if (Math.abs(p.x - pad.x) < 28 && Math.abs(p.y - pad.y) < 26) { payPad = pad;
      if (S.dwellKey !== pad.key) { S.dwellKey = pad.key; S.dwell = 0; }
      S.dwell += dt;
      const paid = save.pads[pad.key] || 0;
      if (S.dwell > .35 && S.payT <= 0 && save.coins > 0 && paid < pad.cost) {
        const step = Math.min(save.coins, pad.cost - paid, Math.max(1, Math.ceil(pad.cost / 30)));
        save.coins -= step; save.pads[pad.key] = paid + step; S.payT = .05; SFX.pay();
        if (save.pads[pad.key] >= pad.cost) complete(pad);
      }
    }
  }
  if (!payPad) S.dwellKey = null;

  // tourists
  const maxQ = save.lv.umbrella ? 5 : 3;
  S.touristT -= dt;
  const waiting = S.tourists.filter(t => !t.leaving);
  if (S.touristT <= 0 && waiting.length < maxQ && save.tut >= 2) {
    S.touristT = save.lv.umbrella ? rnd(1.5, 3) : rnd(2.8, 4.5);
    const types = productTypes();
    const want = Math.random() < .5 ? types[types.length - 1] : pick(types);
    S.tourists.push({ x: -20, y: L.walkY, slot: waiting.length, want, left: Math.random() < .45 ? 1 : 2 + (save.unlocked.loom ? Math.floor(Math.random()*2) : 0), shirt: pick(SHIRTS), skin: pick(SKINS), hat: Math.random() < .5 ? pick(['#FFC83D','#fff','#35C6D8']) : null, walk: 0 });
  }
  for (const t of S.tourists) {
    const tx = t.leaving ? W + 40 : 200 - t.slot * 42;
    const d = tx - t.x; t.moving = Math.abs(d) > 1;
    if (t.moving) { t.x += Math.sign(d) * Math.min(Math.abs(d), 80 * dt); t.walk += dt * 10; }
    t.arrived = !t.moving || t.arrived;
    if (t.leaving && t.x > W + 30) t.gone = true;
  }
  S.tourists = S.tourists.filter(t => !t.gone);

  // crab helpers: fetch trash for built machines
  for (const k of S.crabs) {
    const sp = 58 * dt;
    let goal = null;
    if (k.carry.length >= 2 || (k.carry.length && !S.trash.some(tr => tr.type === k.carry[0] && tr.y > wl + 4 && (!tr.claimed || tr.claimed === k)))) {
      const m = MACHINES.find(mm => mm.input === k.carry[0]);
      goal = { x: m.x + (k.seed % 1 - .5) * 16, y: m.inY };
      if (dist(k.x, k.y, goal.x, goal.y) < 8) { const st = S.machines[m.id]; while (k.carry.length && st.in < 20) { k.carry.pop(); st.in++; } if (k.carry.length) k.carry = []; }
    } else {
      if (!k.target || k.target.dead || k.target.y < wl + 4) {
        k.target = null;
        const opts = S.trash.filter(tr => !tr.claimed && tr.y > wl + 4 && (!k.carry.length || tr.type === k.carry[0]));
        opts.sort((a, b) => dist(k.x, k.y, a.x, a.y) - dist(k.x, k.y, b.x, b.y));
        if (opts[0]) { k.target = opts[0]; opts[0].claimed = k; }
      }
      if (k.target) { goal = k.target; if (dist(k.x, k.y, goal.x, goal.y) < 7) { k.target.dead = true; k.carry.push(k.target.type); k.target = null; } }
      else goal = k.home;
    }
    const dx = goal.x - k.x, dy = goal.y - k.y, dd = Math.hypot(dx, dy);
    k.moving = dd > 2;
    if (k.moving) { k.x += dx / dd * Math.min(dd, sp); k.y += dy / dd * Math.min(dd, sp); k.y = Math.max(k.y, wl + 8); }
  }

  // tutorial progress
  if (save.tut === 0 && p.stack.includes('bottle')) save.tut = 1;
  if (save.tut === 1 && S.machines.kiln.in + S.machines.kiln.out > 0) save.tut = 2;
  if (save.tut === 2 && p.stack.includes('beads')) save.tut = 3;
  if (save.tut === 3 && save.sold > 0) { save.tut = 4; toast('First sale! Keep it up'); }
  if (save.tut === 4 && save.unlocked.loom) save.tut = 5;

  // effects
  for (const f of S.fx) { f.t += dt; f.vy += 160 * dt; f.x += f.vx * dt; f.y += f.vy * dt; }
  for (const f of S.flies) f.t += dt; S.flies = S.flies.filter(f => f.t < f.dur);
  for (const st of S.steps) st.t += dt; S.steps = S.steps.filter(st => st.t < 5);
  for (const sm of S.smoke) sm.t += dt; S.smoke = S.smoke.filter(sm => sm.t < 1.6);
  S.fx = S.fx.filter(f => f.t < f.life);
  for (const q of S.pops) q.t += dt; S.pops = S.pops.filter(q => q.t < 1);
  for (const cf of S.coinsFly) cf.t += dt * 1.6; S.coinsFly = S.coinsFly.filter(cf => cf.t < 1);
  if (waveGain && ac) waveGain.gain.setTargetAtTime(.02 + .03 * ((Math.sin(S.t * 2 * Math.PI / 40) + 1) / 2), ac.currentTime, .5);
}
function recycle(m){
  save.recycled++;
  sparkle(m.x, m.y - 20, ['#8BD3A5', '#fff', m.col], 6);
  const ms = MILESTONES.find(x => x.at === save.recycled);
  if (ms) { toast(ms.text); SFX.milestone(); }

// ================= DRAW =================
function lerpC(a, b, k){ const pa = a.match(/\w\w/g).map(h => parseInt(h, 16)), pb = b.match(/\w\w/g).map(h => parseInt(h, 16)); return 'rgb(' + pa.map((v, i) => Math.round(v + (pb[i] - v) * k)).join(',') + ')'; }
function draw(){
  const hp = health(), wl = waterline(), t = S.t;
  ctx.setTransform(scale * dpr, 0, 0, scale * dpr, offX * scale * dpr, 0);
  const viewH = cv.height / (scale * dpr), X0 = -offX, XW = W + 2 * offX;

  if (sandTex) { ctx.globalAlpha = .7; ctx.fillStyle = ctx.createPattern(sandTex, 'repeat'); ctx.fillRect(X0, 0, XW, viewH); ctx.globalAlpha = 1; }

  ctx.fillStyle = light; ctx.fillRect(X0, 0, XW, viewH);

  const wg = ctx.createLinearGradient(0, wl, 0, wl + 70); wg.addColorStop(0, 'rgba(140,100,55,.32)'); wg.addColorStop(1, 'rgba(140,100,55,0)');
  ctx.fillStyle = wg; ctx.fillRect(X0, wl, XW, 70);

  // trash, with little shadows (faint under water)
  for (const tr of S.trash) { ctx.save(); ctx.globalAlpha = tr.y < wl ? .35 : 1; ctx.fillStyle = 'rgba(60,40,20,.2)'; ctx.beginPath(); ctx.ellipse(tr.x + 2, tr.y + 6, 8, 3, 0, 0, 7); ctx.fill();
    ctx.translate(tr.x, tr.y - (tr.y > wl && !reduce ? Math.abs(Math.sin(t * 2 + tr.x)) * 1.2 : 0)); ctx.rotate(tr.rot); drawItem(ctx, tr.type, 0, 0, 16); ctx.restore(); }

  const sea = ctx.createLinearGradient(0, 0, 0, wl);
  sea.addColorStop(0, lerpC('#3F5F63', '#1C7F9A', hp)); sea.addColorStop(1, lerpC('#6E8F86', '#46CFDD', hp));
  ctx.fillStyle = sea; ctx.beginPath(); ctx.moveTo(X0, 0); ctx.lineTo(X0 + XW, 0);

  ctx.closePath(); ctx.fill();
  // shallow-water band just above the shoreline
  const sh2 = ctx.createLinearGradient(0, wl - 26, 0, wl); sh2.addColorStop(0, 'rgba(255,255,255,0)'); sh2.addColorStop(1, 'rgba(210,250,245,.45)');
  ctx.fillStyle = sh2; ctx.fillRect(X0, wl - 26, XW, 26);
  ctx.strokeStyle = 'rgba(255,255,255,.95)'; ctx.lineWidth = 3.2; ctx.beginPath();
  for (let x = X0; x <= X0 + XW + 10; x += 10) { const y = wl + Math.sin(x * .05 + t * 2) * 3; x > X0 ? ctx.lineTo(x, y) : ctx.moveTo(x, y); } ctx.stroke();
  ctx.fillStyle = 'rgba(255,255,255,.8)';
  for (let x = X0 + 6; x < X0 + XW; x += 23) { const y = wl + Math.sin(x * .05 + t * 2) * 3 - 5 - Math.abs(Math.sin(x + t)) * 3; ctx.beginPath(); ctx.arc(x, y, 1.6, 0, 7); ctx.fill(); }
  ctx.strokeStyle = 'rgba(255,255,255,.3)'; ctx.lineWidth = 2;
  for (let r = 0; r < 4; r++) { ctx.beginPath(); const yy = wl * (.22 + r * .18); for (let x = X0; x <= X0 + XW + 12; x += 12) { const y = yy + Math.sin(x * .04 + t * 1.3 + r) * 3; x > X0 ? ctx.lineTo(x, y) : ctx.moveTo(x, y); } ctx.stroke(); }
  // sparkles on the water
  for (let i = 0; i < 14; i++) { const sx = X0 + ((i * 97.3) % XW), sy = ((i * 53.7) % Math.max(20, wl - 30)) + 8, k = Math.sin(t * 2.5 + i * 1.7);

  drawBoardwalk(viewH, X0, XW);
  for (const tt of S.tourists) drawTourist(ctx, tt);

  ctx.font = '700 12px Fredoka, sans-serif'; ctx.fillStyle = '#8A5A00'; ctx.textAlign = 'left'; ctx.fillText(pad.cost - paid, pad.x - 4, pad.y + 21.5); ctx.textAlign = 'center';
}
function drawUpgradeIcon(id, x, y){
  ctx.save(); ctx.translate(x, y);
  if (id === 'bag') { ctx.fillStyle = '#F2A65A'; ctx.beginPath(); ctx.roundRect(-7, -5, 14, 12, 3); ctx.fill(); ctx.strokeStyle = '#A8793F'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(0, -5, 4, Math.PI, 0); ctx.stroke(); }
  if (id === 'shoes') { ctx.fillStyle = '#FF7A6B'; ctx.beginPath(); ctx.ellipse(-4, 0, 3.5, 7, -.2, 0, 7); ctx.ellipse(4, 1, 3.5, 7, .2, 0, 7); ctx.fill(); ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(-6, -2); ctx.lineTo(-4, -4); ctx.lineTo(-2, -2); ctx.moveTo(2, -1); ctx.lineTo(4, -3); ctx.lineTo(6, -1); ctx.stroke(); }
  if (id === 'crab') { ctx.scale(.8, .8); drawCrab(ctx, { x: 0, y: 2, carry: [], seed: 0, moving: false }); }
  if (id === 'umbrella') { ctx.fillStyle = '#35C6D8'; ctx.beginPath(); ctx.arc(0, 0, 9, Math.PI, 0); ctx.fill(); ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.moveTo(0, -9); ctx.lineTo(-3, 0); ctx.lineTo(3, 0); ctx.fill(); ctx.strokeStyle = '#16324A'; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(0, 9); ctx.stroke(); }
  ctx.restore();
}
function tutorialTarget(){
  const p = S.player, wl = waterline();
  if (save.tut === 0) { const tr = S.trash.filter(t => t.y > wl + 4).sort((a, b) => dist(p.x, p.y, a.x, a.y) - dist(p.x, p.y, b.x, b.y))[0]; return tr ? { x: tr.x, y: tr.y - 12, text: 'Pick up trash' } : { x: 200, y: wl + 30, text: 'Trash washes up at low tide' }; }
  const kiln = MACHINES[0];
  if (save.tut === 1) return { x: kiln.x, y: kiln.inY - 16, text: 'Drop bottles here' };
  if (save.tut === 2) return S.machines.kiln.out ? { x: kiln.x, y: kiln.outY - 16, text: 'Grab the beads' } : null;
  if (save.tut === 3) return { x: 200, y: L.sellY - 30, text: 'Sell to tourists' };
  if (save.tut === 4 && save.coins >= 10) return { x: MACHINES[1].x, y: MACHINES[1].y - 34, text: 'Build a Rope Loom' };
  return null;
}
function drawArrow(x, y, text){
  const b = reduce ? 0 : Math.sin(S.t * 6) * 5;
  ctx.save(); ctx.translate(x, y - 14 + b);
  ctx.fillStyle = '#FF7A6B'; ctx.strokeStyle = '#fff'; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(0, 12); ctx.lineTo(-11, -2); ctx.lineTo(-4, -2); ctx.lineTo(-4, -14); ctx.lineTo(4, -14); ctx.lineTo(4, -2); ctx.lineTo(11, -2); ctx.closePath(); ctx.stroke(); ctx.fill();
  ctx.font = '700 13px Fredoka, sans-serif'; ctx.textAlign = 'center';
  const w = ctx.measureText(text).width + 16; const tx = clamp(0, -x + w / 2 + 6, W - x - w / 2 - 6);
  ctx.fillStyle = '#16324A'; ctx.beginPath(); ctx.roundRect(tx - w / 2, -38, w, 20, 10); ctx.fill();
  ctx.fillStyle = '#fff'; ctx.fillText(text, tx, -24);
  ctx.restore();
}

// ================= HUD =================
let hudCoins = -1, hudRec = -1;
function hud(){
  if (hudCoins !== save.coins) { hudCoins = save.coins; $('coins').textContent = save.coins; }
  if (hudRec !== save.recycled) {
    hudRec = save.recycled; const hp = health();
    $('hp').textContent = Math.round(hp * 100) + '%'; $('hpBar').style.width = hp * 100 + '%';
    const nx = MILESTONES.find(m => m.at > save.recycled);
    $('next').textContent = nx ? `Next: ${nx.short} (${nx.at - save.recycled} more to recycle)` : 'The beach is fully healed!';
  }
}

// ================= LOOP =================
let last = performance.now(), running = false, saveT = 0;
function loop(now){
  const dt = Math.min(.05, (now - last) / 1000); last = now;
  if (running) { update(dt); saveT += dt; if (saveT > 3) { saveT = 0; persist(); } }
  else S.t += dt;
  draw(); hud();
  requestAnimationFrame(loop);
}
document.addEventListener('visibilitychange', () => { if (document.hidden) persist(); last = performance.now(); });
$('play').onclick = start;
layout();
S.player.y = L.row0 - 10;
// a few pieces of trash on the beach from the start
for (let i = 0; i < 6; i++) S.trash.push({ type: 'bottle', x: rnd(40, 360), y: rnd(L.seaHigh + 12, L.trashMax), rot: rnd(-1, 1), claimed: null });
if (location.hash === '#test') window.__tt = { S, save, MACHINES, get L(){ return L; }, start, waterline, pads };
requestAnimationFrame(loop);
})();
</script>
