<title>Hatchwild</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap">
<style>
/* Hatchwild: island base-builder. Screens: home island (build, collect, hatch, merge), sea map (regions,
   rival islands), battle (plan a landing, steer with a flare, use powers). One canvas; HTML panels on top. */
:root{
  --sea:#27A9C4; --sea-d:#16708C; --grass:#7ACB5A; --grass-d:#4E9E3C; --sand:#F2D59A; --wood:#9A6337; --wood-d:#6E421F;
  --ink:#1E2D3A; --ink-2:#556676; --paper:#FFF9EE; --line:#EADFC8; --gold:#FFC83D; --gold-d:#D99A12; --berry:#E2517A;
  --gem:#6FD3F2; --gem-d:#2E8FB8; --go:#4CC38A; --go-d:#2F8F5E; --warn:#FF7A5C; --plum:#6B4BB8;
  --display:"Fredoka","Arial Rounded MT Bold","Trebuchet MS",sans-serif;
  color-scheme:light;
}
html,body{height:100%;margin:0}
body{background:var(--sea-d);font-family:var(--display);overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;color:var(--ink)}
button{font-family:inherit;color:inherit;cursor:pointer;border:0}
button:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
[hidden]{display:none!important}

/* top bar */
.hud{position:fixed;left:0;right:0;top:0;padding:calc(8px + env(safe-area-inset-top,0px)) 8px 0;display:flex;gap:6px;align-items:flex-start;z-index:3;max-width:560px;margin:0 auto;pointer-events:none}
.lvl{pointer-events:auto;position:relative;flex:none;width:46px;height:46px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#8E7CF0,var(--plum));color:#fff;display:grid;place-items:center;font-weight:700;font-size:19px;box-shadow:0 3px 0 rgba(30,45,58,.25),inset 0 0 0 3px rgba(255,255,255,.35)}
.lvl svg{position:absolute;inset:-3px;width:52px;height:52px;transform:rotate(-90deg)}
.res{display:flex;gap:5px;flex-wrap:wrap;flex:1;min-width:0}
.pill{pointer-events:auto;display:flex;align-items:center;gap:4px;background:rgba(255,255,255,.95);border-radius:999px;padding:3px 9px 3px 3px;font-weight:700;font-size:15px;box-shadow:0 3px 0 rgba(30,45,58,.18);min-width:0}
.pill small{font-size:10px;color:var(--ink-2);font-weight:600}
.ic{width:22px;height:22px;flex:none;display:inline-block;border-radius:50%}
.ic.coin{background:radial-gradient(circle at 35% 30%,#FFE58A,var(--gold) 55%,var(--gold-d));box-shadow:inset 0 0 0 2px rgba(150,95,0,.35)}
.ic.food{background:radial-gradient(circle at 35% 30%,#FF9DB8,var(--berry) 60%,#A8284F);box-shadow:inset 0 0 0 2px rgba(120,20,50,.25)}
.ic.gem{border-radius:5px;transform:rotate(45deg) scale(.8);background:linear-gradient(135deg,#C8F3FF,var(--gem) 50%,var(--gem-d))}
.ic.sm{width:15px;height:15px;vertical-align:-2px}
.ic.gem.sm{width:12px;height:12px;margin:0 2px}
.builders{pointer-events:auto;display:flex;align-items:center;gap:4px;background:rgba(255,255,255,.95);border-radius:999px;padding:3px 9px 3px 5px;font-weight:700;font-size:14px;box-shadow:0 3px 0 rgba(30,45,58,.18)}
.builders i{font-style:normal;font-size:16px}

/* quest card */
.quest{position:fixed;left:8px;top:calc(var(--hudb,64px) + 6px);z-index:3;max-width:250px;background:rgba(255,255,255,.95);border-radius:13px;padding:6px 10px 7px;box-shadow:0 3px 0 rgba(30,45,58,.18);font-size:13px;font-weight:600;line-height:1.2}
.quest small{display:block;font-size:10px;font-weight:700;color:var(--plum);letter-spacing:.6px;text-transform:uppercase}
.quest .qbar{height:6px;background:#EEE6F7;border-radius:999px;margin-top:4px;overflow:hidden}
.quest .qbar i{display:block;height:100%;background:linear-gradient(90deg,#B7A6FF,var(--plum));border-radius:999px}
.quest button{margin-top:5px;background:var(--go);color:#fff;border-radius:999px;padding:4px 12px;font-weight:700;font-size:13px;box-shadow:0 3px 0 var(--go-d)}

/* bottom bar */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:3;display:flex;justify-content:center;gap:8px;padding:0 8px calc(10px + env(safe-area-inset-bottom,0px));pointer-events:none}
.dock button{pointer-events:auto;position:relative;width:72px;height:66px;border-radius:18px;background:var(--paper);box-shadow:0 4px 0 var(--line),0 8px 16px rgba(0,0,0,.2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-weight:700;font-size:12.5px;color:var(--ink)}
.dock button canvas{width:34px;height:34px}
.dock button .dot,.dotB{position:absolute;top:-4px;right:-4px;min-width:18px;height:18px;border-radius:999px;background:var(--warn);color:#fff;font-size:11px;display:grid;place-items:center;padding:0 4px;box-shadow:0 2px 0 rgba(0,0,0,.2)}
.dock button.go{background:linear-gradient(#FFB347,#FF7A3C);color:#fff;box-shadow:0 4px 0 #C4521E,0 8px 16px rgba(0,0,0,.2)}

/* sheets & modals */
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:8;max-height:72vh;background:var(--paper);border-radius:22px 22px 0 0;box-shadow:0 -10px 30px rgba(0,0,0,.25);padding:12px 14px calc(14px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;max-width:560px;margin:0 auto;animation:up .25s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.sheet header{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.sheet header h3{margin:0;font-size:21px;flex:1;line-height:1.1}
.sheet header h3 small{display:block;font-size:12.5px;color:var(--ink-2);font-weight:600}
.sheet .list{overflow:auto;min-height:0;display:flex;flex-direction:column;gap:8px;padding:2px 2px 6px;-webkit-overflow-scrolling:touch}
.closeX{width:36px;height:36px;border-radius:50%;background:#fff;box-shadow:0 2px 0 var(--line);font-size:17px;font-weight:700;flex:none}
.row{display:grid;grid-template-columns:52px 1fr auto;gap:2px 10px;align-items:center;background:#fff;border-radius:14px;padding:8px 10px;box-shadow:0 3px 0 var(--line)}
.row canvas{grid-row:span 2;width:52px;height:52px}
.row b{font-size:15.5px;line-height:1.1}
.row span{font-size:12.5px;color:var(--ink-2);grid-column:2;line-height:1.25}
.row.off{opacity:.55}
.row.hl{box-shadow:0 0 0 3px var(--plum),0 3px 0 var(--line)}
.buy{grid-row:span 2;grid-column:3;min-width:74px;border-radius:12px;padding:8px 10px;font-weight:700;font-size:14px;background:var(--go);color:#fff;box-shadow:0 3px 0 var(--go-d);display:flex;align-items:center;justify-content:center;gap:4px;line-height:1.1;text-align:center}
.buy:disabled{background:#D9D2C4;box-shadow:0 3px 0 #BDB5A6;color:#fff}
.buy.gemb{background:linear-gradient(#8FE3FF,var(--gem-d));box-shadow:0 3px 0 #1F6E90}
.btn{display:block;width:100%;border-radius:16px;padding:12px 16px;font-weight:700;font-size:19px;color:#fff;background:linear-gradient(#6EE0A6,var(--go) 60%,var(--go-d));box-shadow:0 5px 0 #226B46;margin-top:8px}
.btn.alt{background:#fff;color:var(--ink);box-shadow:0 4px 0 var(--line)}
.btn.orange{background:linear-gradient(#FFC174,#FF8A3C 60%,#D9621E);box-shadow:0 5px 0 #A8471A}
.btn.gemb{background:linear-gradient(#A9ECFF,#4DB8E0 60%,var(--gem-d));box-shadow:0 5px 0 #1F6E90}
.btn:disabled{filter:grayscale(.7);opacity:.6}
.btns{display:flex;gap:8px}.btns .btn{flex:1}
.modalWrap{position:fixed;inset:0;z-index:20;background:rgba(20,30,40,.55);display:grid;place-items:center;padding:16px;animation:fade .2s}
@keyframes fade{from{opacity:0}}
.modal{position:relative;background:var(--paper);border-radius:24px;padding:18px 18px 16px;width:min(360px,100%);max-height:86vh;overflow:auto;box-shadow:0 20px 50px rgba(0,0,0,.35);text-align:center;animation:pop .28s cubic-bezier(.2,1.4,.5,1)}
@keyframes pop{from{transform:scale(.85);opacity:0}}
.modal h2{margin:4px 0 6px;font-size:26px}
.modal p{margin:6px 0;color:var(--ink-2);font-size:15px;line-height:1.35}
.modal .closeX{position:absolute;top:10px;right:10px}
.loot{display:flex;justify-content:center;gap:14px;margin:10px 0;font-size:22px;font-weight:700}
.loot span{display:flex;align-items:center;gap:5px}
.toast{position:fixed;left:50%;top:calc(var(--hudb,64px) + 54px);transform:translateX(-50%);z-index:30;background:var(--ink);color:#fff;font-weight:600;font-size:16px;padding:9px 18px;border-radius:999px;box-shadow:0 8px 20px rgba(0,0,0,.25);white-space:nowrap;pointer-events:none;animation:pop .3s}
.tip{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:7;background:var(--ink);color:#fff;border-radius:16px;padding:10px 14px;font-size:15px;font-weight:500;width:min(330px,88vw);box-shadow:0 10px 24px rgba(0,0,0,.3);text-align:center;animation:pop .3s}
.tip b{color:var(--gold)}
.tip button{margin-top:6px;background:var(--gold);color:var(--ink);border-radius:999px;padding:5px 14px;font-weight:700}

/* creature cards */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(86px,1fr));gap:8px;overflow:auto;padding:2px 2px 8px}
.card{position:relative;background:#fff;border-radius:14px;box-shadow:0 3px 0 var(--line);padding:4px 4px 6px;text-align:center;font-size:12px;font-weight:600;line-height:1.1}
.card canvas{width:64px;height:64px;display:block;margin:0 auto}
.card .st{display:block;color:var(--gold-d);font-size:11px;letter-spacing:1px}
.card .rest{position:absolute;inset:0;border-radius:14px;background:rgba(255,255,255,.72);display:grid;place-items:center;font-size:12px;color:var(--ink-2);font-weight:700}
.card.sel{box-shadow:0 0 0 3px var(--go),0 3px 0 var(--line);background:#EFFFF6}
.card.pick{box-shadow:0 0 0 3px var(--plum),0 3px 0 var(--line);background:#F4F0FF}
.card .n{position:absolute;top:3px;right:5px;background:var(--plum);color:#fff;border-radius:999px;padding:1px 6px;font-size:11px}
.tabs{display:flex;gap:6px;margin-bottom:8px;overflow:auto;flex:none;scrollbar-width:none}
.tabs button{border-radius:999px;padding:6px 12px;font-weight:700;font-size:14px;background:#fff;box-shadow:0 2px 0 var(--line);white-space:nowrap}
.tabs button[aria-selected="true"]{background:var(--ink);color:#fff;box-shadow:none}
.note{font-size:13px;color:var(--ink-2);margin:2px 2px 8px;line-height:1.3}
.slot{border:2px dashed #CFC4AE;border-radius:14px;min-height:76px;display:grid;place-items:center;color:#A99E88;font-size:12px;font-weight:600;background:#fff}
.slots{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:8px}
.slots.two{grid-template-columns:1fr 1fr}

/* battle UI */
.bbar{position:fixed;left:0;right:0;bottom:0;z-index:4;padding:0 8px calc(10px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;justify-content:center;align-items:flex-end;pointer-events:none}
.pw{pointer-events:auto;position:relative;width:74px;height:74px;border-radius:18px;background:var(--paper);box-shadow:0 4px 0 var(--line),0 8px 16px rgba(0,0,0,.25);display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:700;font-size:12px;gap:2px}
.pw canvas{width:36px;height:36px}
.pw .cost{position:absolute;top:-6px;left:-6px;width:24px;height:24px;border-radius:50%;background:var(--gold);display:grid;place-items:center;font-size:13px;box-shadow:0 2px 0 var(--gold-d)}
.pw.on{background:#FFF1C7;box-shadow:0 0 0 3px var(--gold),0 4px 0 var(--gold-d)}
.pw:disabled{opacity:.45}
.energy{pointer-events:auto;align-self:center;background:rgba(255,255,255,.95);border-radius:14px;padding:6px 10px;font-weight:700;font-size:15px;box-shadow:0 3px 0 rgba(0,0,0,.2);text-align:center;line-height:1}
.energy small{display:block;font-size:10px;color:var(--ink-2);margin-top:2px}
.bhud{position:fixed;left:0;right:0;top:0;z-index:4;padding:calc(8px + env(safe-area-inset-top,0px)) 8px 0;display:flex;gap:6px;align-items:center;justify-content:space-between;pointer-events:none;max-width:560px;margin:0 auto}
.bhud .pill{font-size:14px;padding:5px 10px}
.bhud button{pointer-events:auto;background:#fff;border-radius:999px;padding:6px 12px;font-weight:700;box-shadow:0 3px 0 rgba(0,0,0,.2)}
.prep{position:fixed;left:0;right:0;bottom:0;z-index:8;background:var(--paper);border-radius:22px 22px 0 0;box-shadow:0 -10px 30px rgba(0,0,0,.25);padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));max-width:560px;margin:0 auto;height:44vh;display:flex;flex-direction:column}
.prep .cards{flex:1;min-height:0}
.prep h3{margin:0 0 2px;font-size:20px}
.vs{display:flex;justify-content:space-between;font-weight:700;font-size:14px;margin:4px 0 8px}
.vs .us{color:var(--go-d)}.vs .them{color:#C7462E}
.proto{position:fixed;bottom:calc(84px + env(safe-area-inset-bottom,0px));right:10px;font-size:10px;font-weight:600;color:rgba(255,255,255,.75);z-index:1;pointer-events:none;letter-spacing:.5px}
@media (prefers-reduced-motion:reduce){.sheet,.modal,.modalWrap,.toast,.tip{animation:none}}
</style>

<canvas id="cv" aria-label="Your island"></canvas>
<div class="hud" id="hud">
  <div class="lvl" id="lvl" aria-label="Level"><svg viewBox="0 0 52 52"><circle cx="26" cy="26" r="24" fill="none" stroke="rgba(255,255,255,.25)" stroke-width="4"/><circle id="xpRing" cx="26" cy="26" r="24" fill="none" stroke="#FFC83D" stroke-width="4" stroke-linecap="round" stroke-dasharray="150.8" stroke-dashoffset="150.8"/></svg><span id="lvlN">1</span></div>
  <div class="res">
    <div class="pill" aria-label="Coins"><span class="ic coin"></span><span id="rCoins">0</span></div>
    <div class="pill" aria-label="Berries"><span class="ic food"></span><span id="rFood">0</span></div>
    <div class="pill" aria-label="Gems"><span class="ic gem"></span><span id="rGems">0</span></div>
    <div class="builders" aria-label="Free builders"><i>🔨</i><span id="rBuild">2/2</span></div>
  </div>
</div>
<div class="quest" id="quest" hidden></div>
<div class="dock" id="dock">
  <button type="button" id="bBuild"><canvas width="68" height="68" data-icon="build"></canvas>Build</button>
  <button type="button" id="bCritters"><canvas width="68" height="68" data-icon="critters"></canvas>Critters<span class="dot" id="critDot" hidden></span></button>
  <button type="button" id="bNest"><canvas width="68" height="68" data-icon="nest"></canvas>Nest<span class="dot" id="nestDot" hidden></span></button>
  <button type="button" class="go" id="bMap"><canvas width="68" height="68" data-icon="map"></canvas>Sail</button>
</div>
<div class="proto">PROTOTYPE</div>

<script>
// ================= BASICS =================
const $ = id => document.getElementById(id);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const rnd = (a, b) => a + Math.random() * (b - a);
const dist = (x1, y1, x2, y2) => Math.hypot(x2 - x1, y2 - y1);
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
// #fast in the link runs every timer 60x quicker (for testing)
const SPEED = location.hash.includes('fast') ? 60 : 1;
const secs = s => s * 1000 / SPEED;
const fmt = n => { n = Math.floor(n); return n >= 1e6 ? (n / 1e6).toFixed(n >= 1e7 ? 0 : 1).replace(/\.0$/, '') + 'M' : n >= 1e4 ? (n / 1e3).toFixed(n >= 1e5 ? 0 : 1).replace(/\.0$/, '') + 'k' : String(n); };
const fmtT = ms => { let s = Math.max(0, Math.ceil(ms * SPEED / 1000)); const d = Math.floor(s / 86400), h = Math.floor(s % 86400 / 3600), m = Math.floor(s % 3600 / 60); s %= 60;
  return d ? `${d}d ${h}h` : h ? `${h}h ${m}m` : m ? `${m}m ${s}s` : `${s}s`; };
function hashStr(s){ let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
function rng(seed){ let a = seed >>> 0; return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

// ================= REGIONS =================
// Each region unlocks after weeks of play: it needs a player level, a Chief's Hut level and an Airship Dock level.
const REGIONS = [
  { id: 'tropic', name: 'Tropic Isles', crew: 'Raccoon Rascals', crewCol: '#7A6A5E', sea: ['#39C2D6', '#1D86A6'], land: '#7ACB5A', land2: '#5DB346', sand: '#F2D59A', need: { lv: 1, hq: 1, dock: 1 } },
  { id: 'sky', name: 'Sky Islands', crew: 'Storm Gulls', crewCol: '#8C9AAE', sea: ['#BDE6FF', '#6FB2EC'], land: '#9EDB86', land2: '#7CC468', sand: '#F7F3FF', need: { lv: 8, hq: 4, dock: 3 } },
  { id: 'deep', name: 'Undersea Domes', crew: 'Pike Pirates', crewCol: '#4F7F6E', sea: ['#2B78B8', '#123E6B'], land: '#63C9B4', land2: '#46A895', sand: '#E6D9B8', need: { lv: 16, hq: 7, dock: 6 } },
  { id: 'cog', name: 'Clockwork Cove', crew: 'Rust Rats', crewCol: '#8A5A3C', sea: ['#7FB0B5', '#40707A'], land: '#C9B67E', land2: '#AE9A62', sand: '#EAD9A8', need: { lv: 26, hq: 10, dock: 9 } },
];
const ISLANDS_PER_REGION = 12;

// ================= CRITTERS =================
// role: tank (soaks hits, goes for defenses), fast (quick melee), ranged, splash (ranged area damage)
const SPECIES = {
  pebblet:   { name: 'Pebblet',    region: 0, role: 'tank',   hp: 130, dmg: 8,  rng: .7, spd: .85, cd: 1,   col: '#9AA0A6', col2: '#6F7A7F', desc: 'A rock turtle that soaks up hits.' },
  zippy:     { name: 'Zippy',      region: 0, role: 'fast',   hp: 60,  dmg: 12, rng: .7, spd: 1.8, cd: .7,  col: '#FF6B4A', col2: '#FFC83D', desc: 'A speedy parrot that pecks fast.' },
  coconeer:  { name: 'Coconeer',   region: 0, role: 'ranged', hp: 50,  dmg: 10, rng: 2.6, spd: 1.1, cd: 1.1, col: '#B07A4A', col2: '#F2D59A', desc: 'A monkey that lobs coconuts from afar.' },
  puffling:  { name: 'Puffling',   region: 1, role: 'tank',   hp: 230, dmg: 11, rng: .7, spd: .8, cd: 1,    col: '#F4F6FF', col2: '#B9C4E8', desc: 'A cloud sheep: fluffy and very tough.' },
  gustling:  { name: 'Gustling',   region: 1, role: 'fast',   hp: 95,  dmg: 20, rng: .7, spd: 2.1, cd: .7,  col: '#7FA8E0', col2: '#E8F1FF', desc: 'A wind hawk that dives in first.' },
  sparkfinch:{ name: 'Sparkfinch', region: 1, role: 'ranged', hp: 80,  dmg: 17, rng: 3,  spd: 1.2, cd: 1.1, col: '#FFD84A', col2: '#8E7CF0', desc: 'A little bird that zaps lightning.' },
  bubbleclam:{ name: 'Bubbleclam', region: 2, role: 'tank',   hp: 380, dmg: 16, rng: .7, spd: .75, cd: 1,   col: '#FF9DB8', col2: '#FFF1F5', desc: 'A clam in a bubble shield.' },
  squidlet:  { name: 'Squidlet',   region: 2, role: 'splash', hp: 130, dmg: 18, rng: 2.4, spd: 1.1, cd: 1.3, splash: .9, col: '#8E7CF0', col2: '#C9BDFF', desc: 'Squirts ink blobs that splash.' },
  eelectra:  { name: 'Eelectra',   region: 2, role: 'fast',   hp: 150, dmg: 32, rng: .7, spd: 2, cd: .7,    col: '#35C6D8', col2: '#FFE66B', desc: 'A zippy eel with a shocking bite.' },
  cogbot:    { name: 'Cogbot',     region: 3, role: 'tank',   hp: 600, dmg: 22, rng: .7, spd: .7, cd: 1,    col: '#C98A4A', col2: '#6B4A2E', desc: 'A wind-up robot that won\'t quit.' },
  steamcrab: { name: 'Steamcrab',  region: 3, role: 'splash', hp: 200, dmg: 34, rng: 3,  spd: 1, cd: 1.4, splash: 1, col: '#D9544A', col2: '#F2D59A', desc: 'A crab with a steam cannon.' },
  sprocket:  { name: 'Sprocket',   region: 3, role: 'fast',   hp: 230, dmg: 48, rng: .7, spd: 2, cd: .7,    col: '#E8A13A', col2: '#5A4636', desc: 'A clockwork fox, all gears and zoom.' },
  // hybrids only come from pairing two different critters at the Nest
  shellnut:  { name: 'Shellnut',   region: 0, hybrid: 1, role: 'ranged', hp: 150, dmg: 14, rng: 2.4, spd: .95, cd: 1.1, col: '#8C7A62', col2: '#F2D59A', desc: 'Hybrid: a turtle that throws coconuts.' },
  flingo:    { name: 'Flingo',     region: 0, hybrid: 1, role: 'fast',   hp: 90,  dmg: 17, rng: .7, spd: 2,  cd: .65, col: '#FF8A3C', col2: '#B07A4A', desc: 'Hybrid: a monkey-parrot blur.' },

function islandSpec(r, i){
  const s = r * ISLANDS_PER_REGION + i, R = rng(hashStr('hatchwild-' + r + '-' + i)), boss = i === ISLANDS_PER_REGION - 1;
  const L = clamp(1 + Math.floor(s / 4.5) + (boss ? 1 : 0), 1, 10);
  const blds = [{ k: 'hq', x: 4, y: 1, lv: clamp(L, 1, 10) }];
  const nT = Math.min(6, 1 + Math.floor(s / 5) + (boss ? 1 : 0)), nC = Math.min(4, Math.max(0, Math.floor((s - 1) / 6)) + (boss ? 1 : 0));
  const used = new Set(), key = (x, y) => x + ',' + y;
  const mark = (x, y, sz) => { for (let a = 0; a < sz; a++) for (let b = 0; b < sz; b++) used.add(key(x + a, y + b)); };
  const free = (x, y, sz) => { if (x < 0 || y < 0 || x + sz > GRID_W || y + sz > GRID_H - 3) return false; for (let a = -1; a <= sz; a++) for (let b = -1; b <= sz; b++) if (used.has(key(x + a, y + b)) && a >= 0 && b >= 0 && a < sz && b < sz) return false; return true; };
  mark(4, 1, 2);
  const place = (k, sz, yMax) => { for (let tries = 0; tries < 200; tries++) { const x = Math.floor(R() * (GRID_W - sz + 1)), y = Math.floor(R() * Math.min(GRID_H - 3 - sz + 1, yMax)); if (free(x, y, sz)) { mark(x, y, sz); return { x, y }; } } return null; };
  for (let n = 0; n < nT; n++) { const p = place('tower', 1, 7); if (p) blds.push({ k: 'tower', ...p, lv: clamp(L - (R() < .4 ? 1 : 0), 1, 10) }); }
  for (let n = 0; n < nC; n++) { const p = place('cannon', 1, 6); if (p) blds.push({ k: 'cannon', ...p, lv: clamp(L - 1, 1, 10) }); }
  for (const k of ['farm', 'mill', R() < .5 ? 'farm' : 'mill']) { const p = place(k, 2, 8); if (p) blds.push({ k, ...p, lv: clamp(L - 1, 1, 10) }); }
  for (let n = 0; n < 2 + Math.floor(R() * 3); n++) { const p = place('hut', 1, 9); if (p) blds.push({ k: 'hut', ...p, lv: clamp(L - 1, 1, 10) }); }
  const reward = { coins: Math.round(140 * Math.pow(1.33, s) / 10) * 10, food: Math.round(90 * Math.pow(1.33, s) / 10) * 10, gems: 2 + r * 2 + (boss ? 10 : 0) };
  let pw = 0; for (const b of blds) pw += bhp(b.k, b.lv) / 25 + (DEF[b.k] ? defDmg(b.k, b.lv) / DEF[b.k].cd * 4 : 0);
  return { r, i, s, boss, blds, reward, power: Math.round(pw), name: boss ? `${REGIONS[r].crew} Fortress` : `${REGIONS[r].crew} Isle ${i + 1}` };
}

  document.body.appendChild(sheetEl); sheetEl.querySelector('.closeX').onclick = () => { SFX.tap(); closeSheet(); }; return sheetEl; }
function closeSheet(){ if (sheetEl) { sheetEl.remove(); sheetEl = null; } }
const coinH = n => `<span class="ic coin sm"></span>${fmt(n)}`, foodH = n => `<span class="ic food sm"></span>${fmt(n)}`, gemH = n => `<span class="ic gem sm"></span>${fmt(n)}`;
function critCanvas(sp, tier, size, t0){ const c = document.createElement('canvas'); c.width = c.height = size * 2; const g = c.getContext('2d'); g.scale(2, 2); drawCritter(g, sp, tier, size / 2, size * .92, size * .95, t0 || 0, { still: true }); return c; }
function bldCanvas(k, lv, size){ const c = document.createElement('canvas'); c.width = c.height = size * 2; const g = c.getContext('2d'); g.scale(2, 2); const s1 = BLD[k] ? BLD[k].size : 1; drawBuilding(g, k, size / 2, size * .55, size * .78 / s1, lv, { badge: false }); return c; }
function eggCanvas(sp, size){ const c = document.createElement('canvas'); c.width = c.height = size * 2; const g = c.getContext('2d'); g.scale(2, 2); drawEgg(g, size / 2, size / 2, size * .8, sp, 0); return c; }
document.querySelectorAll('[data-icon]').forEach(c => drawIcon(c.getContext('2d'), c.dataset.icon, c.width));

// ================= HUD =================
const hudCache = {};
function setText(id, v){ if (hudCache[id] !== v) { hudCache[id] = v; $(id).textContent = v; } }
function updateHud(){
  setText('rCoins', fmt(save.coins)); setText('rFood', fmt(save.food)); setText('rGems', fmt(save.gems)); setText('lvlN', String(save.lvl)); setText('rBuild', `${BUILDERS - busy()}/${BUILDERS}`);
  const f = save.xp / xpNeed(save.lvl), off = (150.8 * (1 - f)).toFixed(1); if (hudCache.xp !== off) { hudCache.xp = off; $('xpRing').setAttribute('stroke-dashoffset', off); }
  const eggReady = save.eggs.length > 0 || (save.nest && Date.now() >= save.nest.end); if (hudCache.egg !== eggReady) { hudCache.egg = eggReady; $('nestDot').hidden = !eggReady; $('nestDot').textContent = '!'; }
}

// ================= BUILDINGS: timers, production =================
const stored = b => (b.k === 'farm' || b.k === 'mill') && b.lv ? Math.min(storeCap(b.k, b.lv), (Date.now() - b.last) * SPEED / 3.6e6 * prodRate(b.k, b.lv)) : 0;
const fx = [];
function floatText(x, y, text, col){ fx.push({ x, y, text, col, t: 0 }); }
function collect(b, quiet){
  const n = Math.floor(stored(b)); if (n < 1) return 0; const k = b.k === 'farm' ? 'food' : 'coins';
  b.last = Date.now(); save[k] += n; save.stats.collect++; if (!quiet) { SFX.coin(); const [x, y] = bCenter(b); floatText(x, y - ts, `+${fmt(n)}`, k === 'food' ? '#E2517A' : '#D99A12'); }
  persist(); return n;
}
function tickBuildings(){
  const now = Date.now();
  for (const b of save.bld) if (b.build && now >= b.build.end) finishBuild(b);
  if (save.nest && now >= save.nest.end && !save.nest.done) { save.nest.done = true; persist(); }
  for (const c of save.crit) if (c.rest && now >= c.rest) c.rest = 0;
}
function finishBuild(b){
  const was = b.lv; b.lv = b.build.to; b.build = null; if (b.k === 'farm' || b.k === 'mill') { if (!was) b.last = Date.now(); }
  save.stats.builds++; addXp(5 + 6 * b.lv); SFX.done(); const [x, y] = bCenter(b); floatText(x, y - ts, was ? `Level ${b.lv}!` : 'Built!', '#6B4BB8');
  persist(); if (b.k === 'hq' || b.k === 'dock') setTimeout(checkRegions, 600); if (sheetEl && sheetEl.dataset.bid == b.id) openBuilding(b);
}
function startUpgrade(b){
  const to = b.lv + 1, c = cost(b.k, to);
  if (busy() >= BUILDERS) return toast('Both builders are busy. Wait, or speed one up with gems.');
  if (save.coins < c) return toast(`You need ${fmt(c - save.coins)} more coins`);
  if (b.k === 'farm' || b.k === 'mill') collect(b, true);
  save.coins -= c; b.build = { to, start: Date.now(), end: Date.now() + secs(btime(b.k, to)) }; SFX.build(); persist();
}
function speedUp(b){ const g = gemsFor(b.build.end - Date.now()); if (save.gems < g) return toast(`You need ${g} gems`); save.gems -= g; b.build.end = Date.now(); tickBuildings(); }
const bCenter = b => { const s = BLD[b.k].size; return [ox + (b.x + s / 2) * ts, oy + (b.y + s / 2) * ts]; };

// ================= BASE: drawing =================
let placing = null;   // { k, x, y, id? }
function drawBase(){
  const reg = REGIONS[0]; drawSea(ctx, W, H, t, reg); drawIsland(ctx, ox, oy, ts, reg, t, 11);
  if (placing) { ctx.strokeStyle = 'rgba(255,255,255,.35)'; ctx.lineWidth = 1; for (let i = 0; i <= GRID_W; i++) { ctx.beginPath(); ctx.moveTo(ox + i * ts, oy); ctx.lineTo(ox + i * ts, oy + GRID_H * ts); ctx.stroke(); } for (let j = 0; j <= GRID_H; j++) { ctx.beginPath(); ctx.moveTo(ox, oy + j * ts); ctx.lineTo(ox + GRID_W * ts, oy + j * ts); ctx.stroke(); } }
  const list = save.bld.filter(b => !placing || b.id !== placing.id).slice().sort((a, b) => (a.y + BLD[a.k].size) - (b.y + BLD[b.k].size));
  const nestEgg = save.nest ? save.nest.s : save.eggs[0];
  for (const b of list) { const [x, y] = bCenter(b), s = BLD[b.k].size;
    if (b.lv) drawBuilding(ctx, b.k, x, y, ts, b.lv, { t, egg: nestEgg || 'zippy', egg2: save.eggs[1] || 'pebblet' });
    if (b.build) drawScaffold(ctx, x, y, ts, s, clamp((Date.now() - b.build.start) / (b.build.end - b.build.start), 0, 1), t);
    const n = stored(b); if (n >= Math.max(5, storeCap(b.k, b.lv) * .08)) { const bob = reduce ? 0 : Math.sin(t * 3 + b.id) * 3, full = n >= storeCap(b.k, b.lv) * .98;
      ctx.fillStyle = '#fff'; rr(ctx, x - ts * .42, y - ts * s * .62 - ts * .5 + bob, ts * .84, ts * .5, ts * .25); ctx.fill(); ctx.fillStyle = full ? '#FF7A5C' : '#fff';
      if (b.k === 'farm') { circ(ctx, x - ts * .15, y - ts * s * .62 - ts * .25 + bob, ts * .12, '#E2517A'); } else circ(ctx, x - ts * .15, y - ts * s * .62 - ts * .25 + bob, ts * .12, '#FFC83D');
      ctx.fillStyle = '#1E2D3A'; ctx.font = `700 ${ts * .22}px Fredoka, sans-serif`; ctx.textAlign = 'left'; ctx.textBaseline = 'middle'; ctx.fillText(fmt(n), x - ts * .0, y - ts * s * .62 - ts * .24 + bob); }
    if (b.k === 'nest' && (save.eggs.length || (save.nest && Date.now() >= save.nest.end))) { const bob = reduce ? 0 : Math.sin(t * 4) * 3; ctx.fillStyle = '#FF7A5C'; circ(ctx, x + ts * .6, y - ts * .9 + bob, ts * .22, '#FF7A5C'); ctx.fillStyle = '#fff'; ctx.font = `700 ${ts * .3}px Fredoka, sans-serif`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('!', x + ts * .6, y - ts * .9 + bob + 1); }
  }
  // a few critters wander near the den
  const den = B('den')[0]; if (den) save.crit.slice(0, 6).forEach((c, i) => { const [x, y] = bCenter(den), a = t * .25 + i * 1.05, rx = ts * 1.6, ry = ts * .8;
    drawCritter(ctx, c.s, c.t, x + Math.cos(a) * rx, y + ts * .9 + Math.sin(a) * ry, ts * .75, t + i, { moving: true, face: Math.sin(a) > 0 ? -1 : 1, stars: false }); });
  if (placing) { const s = BLD[placing.k].size, ok = placeOk(placing); ctx.fillStyle = ok ? 'rgba(76,195,138,.45)' : 'rgba(255,90,70,.45)'; rr(ctx, ox + placing.x * ts, oy + placing.y * ts, s * ts, s * ts, 6); ctx.fill();
    ctx.globalAlpha = .85; drawBuilding(ctx, placing.k, ox + (placing.x + s / 2) * ts, oy + (placing.y + s / 2) * ts, ts, placing.lv || 1, { t }); ctx.globalAlpha = 1; }
  for (let i = fx.length - 1; i >= 0; i--) { const f = fx[i]; f.t += 1 / 60; ctx.globalAlpha = Math.max(0, 1 - f.t / 1.2); ctx.fillStyle = f.col; ctx.strokeStyle = '#fff'; ctx.lineWidth = 3; ctx.font = `700 ${ts * .5}px Fredoka, sans-serif`; ctx.textAlign = 'center'; ctx.strokeText(f.text, f.x, f.y - f.t * 40); ctx.fillText(f.text, f.x, f.y - f.t * 40); ctx.globalAlpha = 1; if (f.t > 1.2) fx.splice(i, 1); }
}
function placeOk(p){ const s = BLD[p.k].size; if (p.x < 0 || p.y < 0 || p.x + s > GRID_W || p.y + s > GRID_H) return false;
  return !save.bld.some(b => b.id !== p.id && p.x < b.x + BLD[b.k].size && b.x < p.x + s && p.y < b.y + BLD[b.k].size && b.y < p.y + s); }
function freeSpot(k){ const s = BLD[k].size; for (let y = 0; y <= GRID_H - s; y++) for (let x = 0; x <= GRID_W - s; x++) if (placeOk({ k, x, y })) return { x, y }; return null; }

// ================= BASE: input =================
let down = null;
cv.addEventListener('pointerdown', e => { audio(); down = { x: e.clientX, y: e.clientY, t: performance.now() }; if (screen === 'map') mapDown(e); });
cv.addEventListener('pointermove', e => { if (screen === 'map' && down) mapMove(e); if (placing && down && screen === 'base') movePlacing(e.clientX, e.clientY); });
cv.addEventListener('pointerup', e => { if (!down) return; const moved = Math.hypot(e.clientX - down.x, e.clientY - down.y) > 10; const d = down; down = null;
  if (screen === 'map') return mapUp(e, moved);
  if (screen === 'battle') return battleTap(e.clientX, e.clientY);
  if (!moved) baseTap(e.clientX, e.clientY); });
function movePlacing(px, py){ const s = BLD[placing.k].size; placing.x = Math.round((px - ox) / ts - s / 2); placing.y = Math.round((py - oy) / ts - s / 2); }
function baseTap(px, py){
  if (placing) { movePlacing(px, py); placing.drag = true; return; }
  const gx = (px - ox) / ts, gy = (py - oy) / ts;
  const hit = save.bld.filter(b => gx >= b.x - .15 && gx < b.x + BLD[b.k].size + .15 && gy >= b.y - .6 && gy < b.y + BLD[b.k].size + .1).sort((a, b) => b.y - a.y)[0];
  if (!hit) { closeSheet(); return; }
  SFX.tap(); if (!hit.build && collect(hit)) return;
  if (hit.k === 'nest' && !hit.build && (save.eggs.length || (save.nest && Date.now() >= save.nest.end))) return openNest();
  openBuilding(hit);
}

// ================= BASE: sheets =================
function openBuilding(b){
  const D = BLD[b.k], hq = hqLv(), max = maxLevel(b.k, hq), next = b.lv + 1;
  let info = '';
  if (b.k === 'farm' || b.k === 'mill') info = `Makes ${fmt(prodRate(b.k, b.lv))} ${b.k === 'farm' ? 'berries' : 'coins'} an hour, holds ${fmt(storeCap(b.k, b.lv))}.`;
  if (b.k === 'den') info = `Room for ${denCap(b.lv)} critters or eggs.`;
  if (b.k === 'dock') info = `Squads of ${squadSize(b.lv)} critters, ${5 + b.lv} battle energy, stronger fireworks.`;
  if (b.k === 'pond') info = `Can merge up to ${'★'.repeat(pondTier(b.lv))} critters.`;
  if (b.k === 'nest') info = `Hatches eggs from ${REGIONS.slice(0, nestRegion(b.lv) + 1).map(r => r.name).join(', ')}.`;
  if (b.k === 'hq') info = `Buildings can reach level ${hq}. Upgrade for more buildings and higher levels.`;
  if (DEF[b.k]) info = `Hits for ${Math.round(defDmg(b.k, b.lv))} when raiders come.`;
  const el = sheet(D.name, `Level ${b.lv}${b.build ? ' · upgrading' : ''}`, `<p class="note">${D.desc} ${info}</p><div class="list" id="bList"></div>`); el.dataset.bid = b.id;
  const list = el.querySelector('#bList'), add = html => list.insertAdjacentHTML('beforeend', html);
  if (b.build) { const left = b.build.end - Date.now(); add(`<div class="row"><canvas></canvas><b>Upgrading to level ${b.build.to}</b><button class="buy gemb" type="button" id="bSpeed">${gemH(gemsFor(left))}<br>Finish</button><span id="bLeft">${fmtT(left)} left</span></div>`);
    list.querySelector('canvas').replaceWith(bldCanvas(b.k, b.build.to, 52)); list.querySelector('#bSpeed').onclick = () => { speedUp(b); }; }
  else if (b.lv < max) { const c = cost(b.k, next);
    add(`<div class="row"><canvas></canvas><b>Upgrade to level ${next}</b><button class="buy" type="button" id="bUp" ${save.coins < c || busy() >= BUILDERS ? 'disabled' : ''}>${coinH(c)}</button><span>Takes ${fmtT(secs(btime(b.k, next)))}${busy() >= BUILDERS ? ' · builders busy' : ''}</span></div>`);
    list.querySelector('canvas').replaceWith(bldCanvas(b.k, next, 52)); list.querySelector('#bUp').onclick = () => { startUpgrade(b); openBuilding(b); }; }
  else add(`<p class="note">${b.lv >= 10 ? 'Fully upgraded!' : `Upgrade your Chief's Hut to raise this higher.`}</p>`);
  const acts = [];
  if (b.k === 'nest') acts.push(['Open nest', openNest]); if (b.k === 'pond' && b.lv) acts.push(['Merge critters', openMerge]);
  if (b.k === 'dock') acts.push(['Set sail', openMap]); if (b.k === 'den') acts.push(['See critters', openCritters]);
  acts.push(['Move', () => { closeSheet(); placing = { k: b.k, x: b.x, y: b.y, id: b.id, lv: b.lv }; showPlaceBar(); }]);
  list.insertAdjacentHTML('beforeend', `<div class="btns">${acts.map((a, i) => `<button class="btn ${i < acts.length - 1 ? '' : 'alt'}" type="button" data-a="${i}">${a[0]}</button>`).join('')}</div>`);
  list.querySelectorAll('[data-a]').forEach(bt => bt.onclick = () => { SFX.tap(); acts[+bt.dataset.a][1](); });
}
function openBuildMenu(){
  const hq = hqLv(), el = sheet('Build', `${BUILDERS - busy()} of ${BUILDERS} builders free`, '<div class="list" id="mList"></div>'), list = el.querySelector('#mList');
  for (const k of BLD_ORDER) { if (k === 'hq' || k === 'nest' || k === 'dock') continue;
    const have = B(k).length, max = maxCount(k, hq), c = cost(k, 1), can = have < max && save.coins >= c && busy() < BUILDERS, hl = QUESTS[save.quest] && QUESTS[save.quest].build === k && have < max;
    const why = have >= max ? (max ? `${have}/${max} built · upgrade Chief's Hut for more` : `Unlocks at Chief's Hut level ${k === 'pond' ? 2 : 3}`) : `${have}/${max} built · ${fmtT(secs(btime(k, 1)))}`;
    const row = document.createElement('div'); row.className = 'row' + (have >= max ? ' off' : '') + (hl ? ' hl' : ''); row.appendChild(bldCanvas(k, 1, 52));
    row.insertAdjacentHTML('beforeend', `<b>${BLD[k].name}</b><button class="buy" type="button" ${can ? '' : 'disabled'}>${coinH(c)}</button><span>${BLD[k].desc}<br>${why}</span>`);
    row.querySelector('.buy').onclick = () => { if (!can) return; const p = freeSpot(k); if (!p) return toast('No free space. Move something first.'); closeSheet(); placing = { k, ...p, lv: 1, isNew: true }; showPlaceBar(); tipOnce('place', 'Tap where you want it, then press <b>Place</b>.'); };
    list.appendChild(row); }
}
let placeBar = null;
function showPlaceBar(){ $('dock').hidden = true; placeBar = document.createElement('div'); placeBar.className = 'dock';
  placeBar.innerHTML = `<button type="button" id="pCancel" style="width:110px">✕ Cancel</button><button type="button" class="go" id="pOk" style="width:130px">✓ Place</button>`; document.body.appendChild(placeBar);
  $('pCancel').onclick = () => { SFX.tap(); endPlacing(); };
  $('pOk').onclick = () => { if (!placeOk(placing)) return toast("It doesn't fit there"); SFX.build();
    if (placing.isNew) { const c = cost(placing.k, 1); if (save.coins < c || busy() >= BUILDERS) { endPlacing(); return; } save.coins -= c;
      save.bld.push({ id: save.nextId++, k: placing.k, x: placing.x, y: placing.y, lv: 0, last: Date.now(), build: { to: 1, start: Date.now(), end: Date.now() + secs(btime(placing.k, 1)) } }); }
    else { const b = save.bld.find(bb => bb.id === placing.id); b.x = placing.x; b.y = placing.y; }
    persist(); endPlacing(); }; }
function endPlacing(){ placing = null; if (placeBar) placeBar.remove(); placeBar = null; $('dock').hidden = false; }

function openCritters(){
  const room = B('den').reduce((s, b) => s + denCap(b.lv), 0);
  const el = sheet('Critters', `${save.crit.length + save.eggs.length + (save.nest ? 1 : 0)} of ${room} spaces used`, '<div class="cards" id="cList"></div>'), list = el.querySelector('#cList');
  const sorted = save.crit.slice().sort((a, b) => power(b) - power(a));
  if (!sorted.length) list.innerHTML = '<p class="note">No critters yet. Hatch some at the Nest!</p>';
  for (const c of sorted) { const d = document.createElement('button'); d.type = 'button'; d.className = 'card'; d.appendChild(critCanvas(c.s, c.t, 64));
    d.insertAdjacentHTML('beforeend', `${SPECIES[c.s].name}<span class="st">${'★'.repeat(c.t)}</span><span style="font-size:11px;color:var(--ink-2)">Power ${power(c)}</span>${c.rest ? `<span class="rest">Resting<br>${fmtT(c.rest - Date.now())}</span>` : ''}`);
    d.onclick = () => critDetail(c); list.appendChild(d); }
}
function critDetail(c){
  const S = SPECIES[c.s], m = modal(`<button class="closeX" type="button" data-close aria-label="Close">✕</button><div id="cdArt"></div><h2>${S.name} ${'★'.repeat(c.t)}</h2><p>${S.desc}</p>
    <p><b>Health</b> ${Math.round(stat(c, 'hp'))} · <b>Attack</b> ${Math.round(stat(c, 'dmg'))} · <b>${S.role === 'tank' ? 'Tank' : S.role === 'fast' ? 'Fast' : S.role === 'splash' ? 'Splash' : 'Ranged'}</b></p>
    <p style="font-size:13px">${c.t < MAX_TIER ? `Merge 3 of these at the Merge Pond for a ${'★'.repeat(c.t + 1)} ${S.name}.` : 'Fully grown!'}</p>
    <button class="btn alt" type="button" id="cdFree">Let it go (+${fmt(20 * c.t * (S.region + 1))} berries)</button>`);
  m.el.querySelector('#cdArt').appendChild(critCanvas(c.s, c.t, 110));
  m.el.querySelector('#cdFree').onclick = () => { if (save.crit.length <= 1) return toast('Keep at least one critter!'); save.crit = save.crit.filter(x => x !== c); save.food += 20 * c.t * (S.region + 1); persist(); m.close(); if (sheetEl) openCritters(); toast(`${S.name} waddled off happily`); };
}

// ================= NEST: hatch & pair =================
let nestTab = 'hatch', pairPick = [];
function openNest(){
  const nest = B('nest')[0], NL = nest ? nest.lv : 0;
  const el = sheet('Hatchery Nest', `Level ${NL} · ${Math.max(0, roomLeft())} den spaces free`, `<div id="nTop" style="flex:none"></div><div class="tabs" role="tablist"><button type="button" data-t="hatch" aria-selected="${nestTab === 'hatch'}">Hatch an egg</button><button type="button" data-t="pair" aria-selected="${nestTab === 'pair'}">Pair for a hybrid</button></div><div class="list" id="nList"></div>`);
  el.querySelectorAll('[data-t]').forEach(b => b.onclick = () => { SFX.tap(); nestTab = b.dataset.t; pairPick = []; openNest(); });
  const top = el.querySelector('#nTop'), list = el.querySelector('#nList');

  if (save.eggs.length) { const row = document.createElement('div'); row.className = 'row hl'; row.appendChild(eggCanvas(save.eggs[0], 52));
    row.insertAdjacentHTML('beforeend', `<b>${save.eggs.length > 1 ? save.eggs.length + ' eggs are' : 'An egg is'} ready!</b><button class="buy" type="button">Hatch</button><span>${roomLeft() < 0 ? 'Your den is full. Build or upgrade a Critter Den.' : 'Tap Hatch to meet your new critter.'}</span>`);
    row.querySelector('.buy').onclick = () => hatchEgg(); top.appendChild(row); }
  if (save.nest) { const n = save.nest, left = n.end - Date.now(), row = document.createElement('div'); row.className = 'row'; row.style.marginBottom = '8px'; row.appendChild(eggCanvas(n.s, 52));
    row.insertAdjacentHTML('beforeend', left > 0 ? `<b>${n.pair ? 'Pairing' : 'Warming an egg'}…</b><button class="buy gemb" type="button">${gemH(gemsFor(left))}<br>Finish</button><span>${fmtT(left)} left</span>` : `<b>The egg is ready!</b><button class="buy" type="button">Collect</button><span>${n.pair ? 'What came out of the pairing?' : ''}</span>`);
    row.querySelector('.buy').onclick = () => { if (left > 0) { const g = gemsFor(left); if (save.gems < g) return toast(`You need ${g} gems`); save.gems -= g; n.end = Date.now(); } nestCollect(); };
    top.appendChild(row); }
  if (nestTab === 'hatch') {
    for (const sp of BASIC) { const S = SPECIES[sp], R = S.region, open = regionOpen(R) && nestRegion(NL) >= R, cf = EGG_FOOD[R], can = open && !save.nest && save.food >= cf && roomLeft() > 0;
      const row = document.createElement('div'); row.className = 'row' + (open ? '' : ' off'); row.appendChild(open ? critCanvas(sp, 1, 52) : eggCanvas(sp, 52));
      row.insertAdjacentHTML('beforeend', `<b>${open ? S.name : '???'}</b><button class="buy" type="button" ${can ? '' : 'disabled'}>${foodH(cf)}</button><span>${open ? `${S.desc} ${fmtT(secs(EGG_TIME[R]))}` : !regionOpen(R) ? `From the ${REGIONS[R].name}` : `Needs Nest level ${[0, 3, 6, 9][R]}`}</span>`);
      row.querySelector('.buy').onclick = () => { if (!can) return toast(save.nest ? 'The nest is busy' : roomLeft() <= 0 ? 'Your den is full' : 'Not enough berries'); save.food -= cf; save.nest = { s: sp, start: Date.now(), end: Date.now() + secs(EGG_TIME[R] * (1 - .05 * (NL - 1))) }; SFX.hatch(); persist(); openNest(); };
      list.appendChild(row); }
  } else {
    list.insertAdjacentHTML('beforeend', `<p class="note">Pick two <b>different</b> critters. They come back after, and sometimes you get a rare <b>hybrid</b> egg! Try different pairs to discover them all (${Object.values(HYBRIDS).filter(h => save.tips['found-' + h]).length}/${Object.keys(HYBRIDS).length} found).</p><div class="slots two" id="pSlots"></div><div class="cards" id="pCards"></div><div id="pGo"></div>`);
