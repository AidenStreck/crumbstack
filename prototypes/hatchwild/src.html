<title>Hatchwild</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap">
<style>
/* Hatchwild: island base-builder. Screens: home island (build, collect, hatch, merge), sea map (regions,
   rival islands), battle (plan a landing, steer with a flare, use powers). One canvas; HTML panels on top. */
:root{
  --sea:#27A9C4; --sea-d:#16708C; --grass:#7ACB5A; --grass-d:#4E9E3C; --sand:#F2D59A; --wood:#9A6337; --wood-d:#6E421F;
  --ink:#1E2D3A; --ink-2:#556676; --paper:#FFF9EE; --line:#EADFC8; --gold:#FFC83D; --gold-d:#D99A12; --berry:#E2517A;
  --gem:#6FD3F2; --gem-d:#2E8FB8; --go:#4CC38A; --go-d:#2F8F5E; --warn:#FF7A5C; --plum:#6B4BB8;
  --display:"Fredoka","Arial Rounded MT Bold","Trebuchet MS",sans-serif;
  color-scheme:light;
}
html,body{height:100%;margin:0}
body{background:var(--sea-d);font-family:var(--display);overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;color:var(--ink)}
button{font-family:inherit;color:inherit;cursor:pointer;border:0}
button:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
[hidden]{display:none!important}

/* top bar */
.hud{position:fixed;left:0;right:0;top:0;padding:calc(8px + env(safe-area-inset-top,0px)) 8px 0;display:flex;gap:6px;align-items:flex-start;z-index:3;max-width:560px;margin:0 auto;pointer-events:none}
.lvl{pointer-events:auto;position:relative;flex:none;width:46px;height:46px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#8E7CF0,var(--plum));color:#fff;display:grid;place-items:center;font-weight:700;font-size:19px;box-shadow:0 3px 0 rgba(30,45,58,.25),inset 0 0 0 3px rgba(255,255,255,.35)}
.lvl svg{position:absolute;inset:-3px;width:52px;height:52px;transform:rotate(-90deg)}
.res{display:flex;gap:5px;flex-wrap:wrap;flex:1;min-width:0}
.pill{pointer-events:auto;display:flex;align-items:center;gap:4px;background:rgba(255,255,255,.95);border-radius:999px;padding:3px 9px 3px 3px;font-weight:700;font-size:15px;box-shadow:0 3px 0 rgba(30,45,58,.18);min-width:0}
.pill small{font-size:10px;color:var(--ink-2);font-weight:600}
.ic{width:22px;height:22px;flex:none;display:inline-block;border-radius:50%}
.ic.coin{background:radial-gradient(circle at 35% 30%,#FFE58A,var(--gold) 55%,var(--gold-d));box-shadow:inset 0 0 0 2px rgba(150,95,0,.35)}
.ic.food{background:radial-gradient(circle at 35% 30%,#FF9DB8,var(--berry) 60%,#A8284F);box-shadow:inset 0 0 0 2px rgba(120,20,50,.25)}
.ic.gem{border-radius:5px;transform:rotate(45deg) scale(.8);background:linear-gradient(135deg,#C8F3FF,var(--gem) 50%,var(--gem-d))}
.ic.sm{width:15px;height:15px;vertical-align:-2px}
.ic.gem.sm{width:12px;height:12px;margin:0 2px}
.builders{pointer-events:auto;display:flex;align-items:center;gap:4px;background:rgba(255,255,255,.95);border-radius:999px;padding:3px 9px 3px 5px;font-weight:700;font-size:14px;box-shadow:0 3px 0 rgba(30,45,58,.18)}
.builders i{font-style:normal;font-size:16px}

/* quest card */
.quest{position:fixed;left:8px;top:calc(var(--hudb,64px) + 6px);z-index:3;max-width:250px;background:rgba(255,255,255,.95);border-radius:13px;padding:6px 10px 7px;box-shadow:0 3px 0 rgba(30,45,58,.18);font-size:13px;font-weight:600;line-height:1.2}
.quest small{display:block;font-size:10px;font-weight:700;color:var(--plum);letter-spacing:.6px;text-transform:uppercase}
.quest .qbar{height:6px;background:#EEE6F7;border-radius:999px;margin-top:4px;overflow:hidden}
.quest .qbar i{display:block;height:100%;background:linear-gradient(90deg,#B7A6FF,var(--plum));border-radius:999px}
.quest button{margin-top:5px;background:var(--go);color:#fff;border-radius:999px;padding:4px 12px;font-weight:700;font-size:13px;box-shadow:0 3px 0 var(--go-d)}

/* bottom bar */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:3;display:flex;justify-content:center;gap:8px;padding:0 8px calc(10px + env(safe-area-inset-bottom,0px));pointer-events:none}
.dock button{pointer-events:auto;position:relative;width:72px;height:66px;border-radius:18px;background:var(--paper);box-shadow:0 4px 0 var(--line),0 8px 16px rgba(0,0,0,.2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-weight:700;font-size:12.5px;color:var(--ink)}
.dock button canvas{width:34px;height:34px}
.dock button .dot,.dotB{position:absolute;top:-4px;right:-4px;min-width:18px;height:18px;border-radius:999px;background:var(--warn);color:#fff;font-size:11px;display:grid;place-items:center;padding:0 4px;box-shadow:0 2px 0 rgba(0,0,0,.2)}
.dock button.go{background:linear-gradient(#FFB347,#FF7A3C);color:#fff;box-shadow:0 4px 0 #C4521E,0 8px 16px rgba(0,0,0,.2)}

/* sheets & modals */
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:8;max-height:72vh;background:var(--paper);border-radius:22px 22px 0 0;box-shadow:0 -10px 30px rgba(0,0,0,.25);padding:12px 14px calc(14px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;max-width:560px;margin:0 auto;animation:up .25s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.sheet header{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.sheet header h3{margin:0;font-size:21px;flex:1;line-height:1.1}
.sheet header h3 small{display:block;font-size:12.5px;color:var(--ink-2);font-weight:600}
.sheet .list{overflow:auto;min-height:0;display:flex;flex-direction:column;gap:8px;padding:2px 2px 6px;-webkit-overflow-scrolling:touch}
.closeX{width:36px;height:36px;border-radius:50%;background:#fff;box-shadow:0 2px 0 var(--line);font-size:17px;font-weight:700;flex:none}
.row{display:grid;grid-template-columns:52px 1fr auto;gap:2px 10px;align-items:center;background:#fff;border-radius:14px;padding:8px 10px;box-shadow:0 3px 0 var(--line)}
.row canvas{grid-row:span 2;width:52px;height:52px}
.row b{font-size:15.5px;line-height:1.1}
.row span{font-size:12.5px;color:var(--ink-2);grid-column:2;line-height:1.25}
.row.off{opacity:.55}
.row.hl{box-shadow:0 0 0 3px var(--plum),0 3px 0 var(--line)}
.buy{grid-row:span 2;grid-column:3;min-width:74px;border-radius:12px;padding:8px 10px;font-weight:700;font-size:14px;background:var(--go);color:#fff;box-shadow:0 3px 0 var(--go-d);display:flex;align-items:center;justify-content:center;gap:4px;line-height:1.1;text-align:center}
.buy:disabled{background:#D9D2C4;box-shadow:0 3px 0 #BDB5A6;color:#fff}
.buy.gemb{background:linear-gradient(#8FE3FF,var(--gem-d));box-shadow:0 3px 0 #1F6E90}
.btn{display:block;width:100%;border-radius:16px;padding:12px 16px;font-weight:700;font-size:19px;color:#fff;background:linear-gradient(#6EE0A6,var(--go) 60%,var(--go-d));box-shadow:0 5px 0 #226B46;margin-top:8px}
.btn.alt{background:#fff;color:var(--ink);box-shadow:0 4px 0 var(--line)}
.btn.orange{background:linear-gradient(#FFC174,#FF8A3C 60%,#D9621E);box-shadow:0 5px 0 #A8471A}
.btn.gemb{background:linear-gradient(#A9ECFF,#4DB8E0 60%,var(--gem-d));box-shadow:0 5px 0 #1F6E90}
.btn:disabled{filter:grayscale(.7);opacity:.6}
.btns{display:flex;gap:8px}.btns .btn{flex:1}
.modalWrap{position:fixed;inset:0;z-index:20;background:rgba(20,30,40,.55);display:grid;place-items:center;padding:16px;animation:fade .2s}
@keyframes fade{from{opacity:0}}
.modal{position:relative;background:var(--paper);border-radius:24px;padding:18px 18px 16px;width:min(360px,100%);max-height:86vh;overflow:auto;box-shadow:0 20px 50px rgba(0,0,0,.35);text-align:center;animation:pop .28s cubic-bezier(.2,1.4,.5,1)}
@keyframes pop{from{transform:scale(.85);opacity:0}}
.modal h2{margin:4px 0 6px;font-size:26px}
.modal p{margin:6px 0;color:var(--ink-2);font-size:15px;line-height:1.35}
.modal .closeX{position:absolute;top:10px;right:10px}
.loot{display:flex;justify-content:center;gap:14px;margin:10px 0;font-size:22px;font-weight:700}
.loot span{display:flex;align-items:center;gap:5px}
.toast{position:fixed;left:50%;top:calc(var(--hudb,64px) + 54px);transform:translateX(-50%);z-index:30;background:var(--ink);color:#fff;font-weight:600;font-size:16px;padding:9px 18px;border-radius:999px;box-shadow:0 8px 20px rgba(0,0,0,.25);white-space:nowrap;pointer-events:none;animation:pop .3s}
.tip{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:7;background:var(--ink);color:#fff;border-radius:16px;padding:10px 14px;font-size:15px;font-weight:500;width:min(330px,88vw);box-shadow:0 10px 24px rgba(0,0,0,.3);text-align:center;animation:pop .3s}
.tip b{color:var(--gold)}
.tip button{margin-top:6px;background:var(--gold);color:var(--ink);border-radius:999px;padding:5px 14px;font-weight:700}

/* creature cards */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(86px,1fr));gap:8px;overflow:auto;padding:2px 2px 8px}
.card{position:relative;background:#fff;border-radius:14px;box-shadow:0 3px 0 var(--line);padding:4px 4px 6px;text-align:center;font-size:12px;font-weight:600;line-height:1.1}
.card canvas{width:64px;height:64px;display:block;margin:0 auto}
.card .st{display:block;color:var(--gold-d);font-size:11px;letter-spacing:1px}
.card .rest{position:absolute;inset:0;border-radius:14px;background:rgba(255,255,255,.72);display:grid;place-items:center;font-size:12px;color:var(--ink-2);font-weight:700}
.card.sel{box-shadow:0 0 0 3px var(--go),0 3px 0 var(--line);background:#EFFFF6}
.card.pick{box-shadow:0 0 0 3px var(--plum),0 3px 0 var(--line);background:#F4F0FF}
.card .n{position:absolute;top:3px;right:5px;background:var(--plum);color:#fff;border-radius:999px;padding:1px 6px;font-size:11px}
.tabs{display:flex;gap:6px;margin-bottom:8px;overflow:auto;flex:none;scrollbar-width:none}
.tabs button{border-radius:999px;padding:6px 12px;font-weight:700;font-size:14px;background:#fff;box-shadow:0 2px 0 var(--line);white-space:nowrap}
.tabs button[aria-selected="true"]{background:var(--ink);color:#fff;box-shadow:none}
.note{font-size:13px;color:var(--ink-2);margin:2px 2px 8px;line-height:1.3}
.slot{border:2px dashed #CFC4AE;border-radius:14px;min-height:76px;display:grid;place-items:center;color:#A99E88;font-size:12px;font-weight:600;background:#fff}
.slots{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:8px}
.slots.two{grid-template-columns:1fr 1fr}

/* battle UI */
.bbar{position:fixed;left:0;right:0;bottom:0;z-index:4;padding:0 8px calc(10px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;justify-content:center;align-items:flex-end;pointer-events:none}
.pw{pointer-events:auto;position:relative;width:74px;height:74px;border-radius:18px;background:var(--paper);box-shadow:0 4px 0 var(--line),0 8px 16px rgba(0,0,0,.25);display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:700;font-size:12px;gap:2px}
.pw canvas{width:36px;height:36px}
.pw .cost{position:absolute;top:-6px;left:-6px;width:24px;height:24px;border-radius:50%;background:var(--gold);display:grid;place-items:center;font-size:13px;box-shadow:0 2px 0 var(--gold-d)}
.pw.on{background:#FFF1C7;box-shadow:0 0 0 3px var(--gold),0 4px 0 var(--gold-d)}
.pw:disabled{opacity:.45}
.energy{pointer-events:auto;align-self:center;background:rgba(255,255,255,.95);border-radius:14px;padding:6px 10px;font-weight:700;font-size:15px;box-shadow:0 3px 0 rgba(0,0,0,.2);text-align:center;line-height:1}
.energy small{display:block;font-size:10px;color:var(--ink-2);margin-top:2px}
.bhud{position:fixed;left:0;right:0;top:0;z-index:4;padding:calc(8px + env(safe-area-inset-top,0px)) 8px 0;display:flex;gap:6px;align-items:center;justify-content:space-between;pointer-events:none;max-width:560px;margin:0 auto}
.bhud .pill{font-size:14px;padding:5px 10px}
.bhud button{pointer-events:auto;background:#fff;border-radius:999px;padding:6px 12px;font-weight:700;box-shadow:0 3px 0 rgba(0,0,0,.2)}
.prep{position:fixed;left:0;right:0;bottom:0;z-index:8;background:var(--paper);border-radius:22px 22px 0 0;box-shadow:0 -10px 30px rgba(0,0,0,.25);padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));max-width:560px;margin:0 auto;height:44vh;display:flex;flex-direction:column}
.prep .cards{flex:1;min-height:0}
.prep h3{margin:0 0 2px;font-size:20px}
.vs{display:flex;justify-content:space-between;font-weight:700;font-size:14px;margin:4px 0 8px}
.vs .us{color:var(--go-d)}.vs .them{color:#C7462E}
.proto{position:fixed;bottom:calc(84px + env(safe-area-inset-bottom,0px));right:10px;font-size:10px;font-weight:600;color:rgba(255,255,255,.75);z-index:1;pointer-events:none;letter-spacing:.5px}

/* ---- Nestkeeper theme: parchment, carved wood, brass ---- */
.pill,.builders{background:linear-gradient(#4A3322,#2E1F14);color:#FFF1D6;box-shadow:0 3px 0 rgba(0,0,0,.35),inset 0 1px 0 rgba(255,220,160,.25);border:1.5px solid #8A6238}
.lvl{background:radial-gradient(circle at 35% 30%,#3FC7B4,#1E7D72);box-shadow:0 3px 0 rgba(0,0,0,.3),inset 0 0 0 3px #D9B25A}
.quest{background:linear-gradient(#FFF6E2,#F3E0B8);border:1.5px solid #C9A56A;box-shadow:0 4px 0 rgba(90,60,30,.35);color:#3A2A1A}
.quest small{color:#1E7D72}.quest .qbar{background:#E3CFA4}.quest .qbar i{background:linear-gradient(90deg,#6FD6C4,#1E9A8A)}
.dock button{background:linear-gradient(#C68B55,#95602F 70%,#7A4B24);color:#FFF1D6;border:2px solid #5A3818;box-shadow:0 4px 0 #4A2E14,0 8px 18px rgba(0,0,0,.35),inset 0 2px 0 rgba(255,220,170,.35);text-shadow:0 1px 0 rgba(0,0,0,.4)}
.dock button.go{background:linear-gradient(#3FC7B4,#1E8F80 70%,#15695E);border-color:#0E4A42;box-shadow:0 4px 0 #0B3A34,0 8px 18px rgba(0,0,0,.35),inset 0 2px 0 rgba(200,255,245,.35)}
.sheet,.prep{background:linear-gradient(#FFF7E6,#F4E4C2);border-top:3px solid #C9A56A;box-shadow:0 -10px 30px rgba(0,0,0,.35),inset 0 1px 0 #fff}
.sheet header h3,.prep h3{color:#3A2410;letter-spacing:.2px}
.sheet header{border-bottom:1.5px dashed rgba(150,110,60,.35);padding-bottom:8px}
.closeX{background:linear-gradient(#FFF7E6,#EAD5A8);border:1.5px solid #C9A56A;color:#5A3818;box-shadow:0 2px 0 rgba(90,60,30,.35)}
.row,.card,.slot{background:linear-gradient(#FFFDF7,#FBF1DC);box-shadow:0 3px 0 rgba(150,110,60,.28);border:1px solid rgba(201,165,106,.45)}
.buy{background:linear-gradient(#63D69B,#2F9E66);box-shadow:0 3px 0 #1F6E46,inset 0 1px 0 rgba(255,255,255,.35)}
.btn{box-shadow:0 5px 0 #226B46,inset 0 2px 0 rgba(255,255,255,.35);text-shadow:0 1px 0 rgba(0,0,0,.25)}
.btn.alt{background:linear-gradient(#FFF7E6,#EAD5A8);color:#5A3818;border:1.5px solid #C9A56A;box-shadow:0 4px 0 rgba(90,60,30,.35);text-shadow:none}
.modal{background:linear-gradient(#FFF8EA,#F3E1BA);border:3px solid #C9A56A;box-shadow:0 0 0 5px rgba(90,60,30,.25),0 24px 50px rgba(0,0,0,.45);color:#3A2410}
.modal h2{color:#3A2410}.modal p{color:#6A5438}
.tabs button{background:#FFF7E6;border:1px solid #D9BE88;color:#5A3818}.tabs button[aria-selected="true"]{background:#1E7D72;border-color:#0E4A42;color:#fff}
.toast{background:linear-gradient(#4A3322,#2E1F14);border:1.5px solid #8A6238;color:#FFF1D6}
.tip{background:linear-gradient(#3A2A1C,#24180F);border:1.5px solid #8A6238}
.pw{background:linear-gradient(#FFF7E6,#EAD5A8);border:2px solid #C9A56A}
.energy{background:linear-gradient(#4A3322,#2E1F14);color:#FFE58A;border:1.5px solid #8A6238}.energy small{color:#E8D3AE}
.bhud .pill{color:#FFF1D6}.bhud button{background:linear-gradient(#FFF7E6,#EAD5A8);border:1.5px solid #C9A56A;color:#5A3818}
.note{color:#6A5438}
@media (prefers-reduced-motion:reduce){.sheet,.modal,.modalWrap,.toast,.tip{animation:none}}

/* building panel */
.bSheet header{border:0;padding:0;margin:0;position:absolute;right:12px;top:10px}
.bSheet header h3{display:none}
.bHero{display:flex;gap:12px;align-items:center;padding:4px 40px 10px 2px;border-bottom:1.5px dashed rgba(150,110,60,.35);margin-bottom:8px}
.bArt{flex:none;width:96px;height:96px;border-radius:20px;background:radial-gradient(circle at 50% 60%,#FFF3CF,#E9CD92 70%,#D7B06A);box-shadow:inset 0 2px 0 #fff,inset 0 -3px 0 rgba(120,80,30,.25),0 3px 8px rgba(80,50,20,.2);display:grid;place-items:center}
.bArt canvas{width:96px;height:96px}
.bInfo{min-width:0}
.bInfo h3{margin:0;font-size:22px;color:#3A2410;line-height:1.05}
.bLv{display:flex;align-items:center;gap:8px;margin:5px 0 4px}
.bLv b{font-size:12px;background:#5B3FA8;color:#fff;border-radius:999px;padding:2px 9px;box-shadow:0 2px 0 #3B2574}
.pips{display:flex;gap:3px}
.pips i{width:9px;height:9px;border-radius:3px;background:#E3D2AE;box-shadow:inset 0 1px 1px rgba(0,0,0,.15)}
.pips i.on{background:linear-gradient(#FFD865,#E9A21A);box-shadow:0 0 0 1px #B7780B}
.pips i.lock{background:transparent;box-shadow:inset 0 0 0 1.5px #E3D2AE}
.pips i.up{background:#8FD9B0;animation:pipPulse 1s ease-in-out infinite alternate}
@keyframes pipPulse{to{background:#2F9E66}}
.bInfo p{margin:0;font-size:12.5px;color:#6E5236;line-height:1.3}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.stat{display:flex;align-items:center;gap:8px;background:#FFFDF6;border:1.5px solid #E6D2A8;border-radius:14px;padding:8px 10px}
.stat .ic{width:26px;height:26px;flex:none;margin:0}
.stat .si{font-style:normal;font-size:20px;width:26px;text-align:center;color:#C0741A;flex:none}
.stat b{display:block;font-size:16px;color:#3A2410;font-variant-numeric:tabular-nums}
.stat b em{font-style:normal;font-size:12px;color:#2F9E66;margin-left:5px}
.stat small{display:block;font-size:11px;color:#8A6B45;font-weight:600}
.upCard{background:linear-gradient(#FFFDF6,#F7EACB);border:1.5px solid #D9BD86;border-radius:16px;padding:10px 12px}
.upCard .upTop{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.upCard .upTop b{font-size:16px;color:#3A2410}
.upCard .upTop span{font-size:12.5px;color:#7A5A2E;font-weight:600;white-space:nowrap}
.upCard .btn{display:flex;align-items:center;justify-content:center;gap:6px;margin-top:8px;font-size:18px}
.upCard .btn .ic{width:22px;height:22px;margin:0 0 0 4px}
.upCard .warn{margin:6px 0 0;font-size:12.5px;color:#B5451B;font-weight:600}
.upCard.done b{display:block;font-size:16px;color:#3A2410}.upCard.done span{font-size:12.5px;color:#7A5A2E}
.bar{height:10px;border-radius:999px;background:#E3D2AE;margin-top:8px;overflow:hidden;box-shadow:inset 0 1px 2px rgba(0,0,0,.15)}
.bar i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,#63D69B,#2F9E66)}
</style>

<canvas id="cv" aria-label="Your island"></canvas>
<div class="hud" id="hud">
  <div class="lvl" id="lvl" aria-label="Level"><svg viewBox="0 0 52 52"><circle cx="26" cy="26" r="24" fill="none" stroke="rgba(255,255,255,.25)" stroke-width="4"/><circle id="xpRing" cx="26" cy="26" r="24" fill="none" stroke="#FFC83D" stroke-width="4" stroke-linecap="round" stroke-dasharray="150.8" stroke-dashoffset="150.8"/></svg><span id="lvlN">1</span></div>
  <div class="res">
    <div class="pill" aria-label="Coins"><span class="ic coin"></span><span id="rCoins">0</span></div>
    <div class="pill" aria-label="Berries"><span class="ic food"></span><span id="rFood">0</span></div>
    <div class="pill" aria-label="Gems"><span class="ic gem"></span><span id="rGems">0</span></div>
    <div class="builders" aria-label="Free builders"><i>🔨</i><span id="rBuild">2/2</span></div>
  </div>
</div>
<div class="quest" id="quest" hidden></div>
<div class="dock" id="dock">

<script>
// ================= BASICS =================
const $ = id => document.getElementById(id);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const rnd = (a, b) => a + Math.random() * (b - a);
const dist = (x1, y1, x2, y2) => Math.hypot(x2 - x1, y2 - y1);
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
// #fast in the link runs every timer 60x quicker (for testing)
const SPEED = location.hash.includes('fast') ? 60 : 1;
const secs = s => s * 1000 / SPEED;
const fmt = n => { n = Math.floor(n); return n >= 1e6 ? (n / 1e6).toFixed(n >= 1e7 ? 0 : 1).replace(/\.0$/, '') + 'M' : n >= 1e4 ? (n / 1e3).toFixed(n >= 1e5 ? 0 : 1).replace(/\.0$/, '') + 'k' : String(n); };
const fmtT = ms => { let s = Math.max(0, Math.ceil(ms * SPEED / 1000)); const d = Math.floor(s / 86400), h = Math.floor(s % 86400 / 3600), m = Math.floor(s % 3600 / 60); s %= 60;
  return d ? `${d}d ${h}h` : h ? `${h}h ${m}m` : m ? `${m}m ${s}s` : `${s}s`; };
function hashStr(s){ let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
function rng(seed){ let a = seed >>> 0; return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

// ================= REGIONS =================
// Each region unlocks after weeks of play: it needs a player level, a Keeper's Lodge level and an Airship Dock level.
const REGIONS = [
  { id: 'tropic', name: 'Tropic Isles', crew: 'Raccoon Rascals', crewCol: '#7A6A5E', sea: ['#39C2D6', '#1D86A6'], land: '#7ACB5A', land2: '#5DB346', sand: '#F2D59A', need: { lv: 1, hq: 1, dock: 1 } },
  { id: 'sky', name: 'Sky Islands', crew: 'Storm Gulls', crewCol: '#8C9AAE', sea: ['#BDE6FF', '#6FB2EC'], land: '#9EDB86', land2: '#7CC468', sand: '#F7F3FF', need: { lv: 8, hq: 4, dock: 3 } },
  { id: 'deep', name: 'Undersea Domes', crew: 'Pike Pirates', crewCol: '#4F7F6E', sea: ['#2B78B8', '#123E6B'], land: '#63C9B4', land2: '#46A895', sand: '#E6D9B8', need: { lv: 16, hq: 7, dock: 6 } },
  { id: 'cog', name: 'Clockwork Cove', crew: 'Rust Rats', crewCol: '#8A5A3C', sea: ['#7FB0B5', '#40707A'], land: '#C9B67E', land2: '#AE9A62', sand: '#EAD9A8', need: { lv: 26, hq: 10, dock: 9 } },
];
const ISLANDS_PER_REGION = 12;

// ================= CRITTERS =================
// role: tank (soaks hits, goes for defenses), fast (quick melee), ranged, splash (ranged area damage)
const SPECIES = {
  pebblet:   { name: 'Pebblet',    region: 0, role: 'tank',   hp: 130, dmg: 8,  rng: .7, spd: .85, cd: 1,   col: '#9AA0A6', col2: '#6F7A7F', desc: 'A rock turtle that soaks up hits.' },
  zippy:     { name: 'Zippy',      region: 0, role: 'fast',   hp: 60,  dmg: 12, rng: .7, spd: 1.8, cd: .7,  col: '#FF6B4A', col2: '#FFC83D', desc: 'A speedy parrot that pecks fast.' },
  coconeer:  { name: 'Coconeer',   region: 0, role: 'ranged', hp: 50,  dmg: 10, rng: 2.6, spd: 1.1, cd: 1.1, col: '#B07A4A', col2: '#F2D59A', desc: 'A monkey that lobs coconuts from afar.' },
  puffling:  { name: 'Puffling',   region: 1, role: 'tank',   hp: 230, dmg: 11, rng: .7, spd: .8, cd: 1,    col: '#F4F6FF', col2: '#B9C4E8', desc: 'A cloud sheep: fluffy and very tough.' },
  gustling:  { name: 'Gustling',   region: 1, role: 'fast',   hp: 95,  dmg: 20, rng: .7, spd: 2.1, cd: .7,  col: '#7FA8E0', col2: '#E8F1FF', desc: 'A wind hawk that dives in first.' },
  sparkfinch:{ name: 'Sparkfinch', region: 1, role: 'ranged', hp: 80,  dmg: 17, rng: 3,  spd: 1.2, cd: 1.1, col: '#FFD84A', col2: '#8E7CF0', desc: 'A little bird that zaps lightning.' },
  bubbleclam:{ name: 'Bubbleclam', region: 2, role: 'tank',   hp: 380, dmg: 16, rng: .7, spd: .75, cd: 1,   col: '#FF9DB8', col2: '#FFF1F5', desc: 'A clam in a bubble shield.' },
  squidlet:  { name: 'Squidlet',   region: 2, role: 'splash', hp: 130, dmg: 18, rng: 2.4, spd: 1.1, cd: 1.3, splash: .9, col: '#8E7CF0', col2: '#C9BDFF', desc: 'Squirts ink blobs that splash.' },
  eelectra:  { name: 'Eelectra',   region: 2, role: 'fast',   hp: 150, dmg: 32, rng: .7, spd: 2, cd: .7,    col: '#35C6D8', col2: '#FFE66B', desc: 'A zippy eel with a shocking bite.' },
  cogbot:    { name: 'Cogbot',     region: 3, role: 'tank',   hp: 600, dmg: 22, rng: .7, spd: .7, cd: 1,    col: '#C98A4A', col2: '#6B4A2E', desc: 'A wind-up robot that won\'t quit.' },
  steamcrab: { name: 'Steamcrab',  region: 3, role: 'splash', hp: 200, dmg: 34, rng: 3,  spd: 1, cd: 1.4, splash: 1, col: '#D9544A', col2: '#F2D59A', desc: 'A crab with a steam cannon.' },
  sprocket:  { name: 'Sprocket',   region: 3, role: 'fast',   hp: 230, dmg: 48, rng: .7, spd: 2, cd: .7,    col: '#E8A13A', col2: '#5A4636', desc: 'A clockwork fox, all gears and zoom.' },
  // hybrids only come from pairing two different critters at the Nest
  shellnut:  { name: 'Shellnut',   region: 0, hybrid: 1, role: 'ranged', hp: 150, dmg: 14, rng: 2.4, spd: .95, cd: 1.1, col: '#8C7A62', col2: '#F2D59A', desc: 'Hybrid: a turtle that throws coconuts.' },
  flingo:    { name: 'Flingo',     region: 0, hybrid: 1, role: 'fast',   hp: 90,  dmg: 17, rng: .7, spd: 2,  cd: .65, col: '#FF8A3C', col2: '#B07A4A', desc: 'Hybrid: a monkey-parrot blur.' },
  boulderpuff:{name: 'Boulderpuff',region: 1, hybrid: 1, role: 'tank',   hp: 420, dmg: 16, rng: .7, spd: .8, cd: 1,   col: '#C4CAD6', col2: '#F4F6FF', desc: 'Hybrid: a flying rock sheep.' },
  zipzap:    { name: 'Zipzap',     region: 2, hybrid: 1, role: 'fast',   hp: 210, dmg: 46, rng: .7, spd: 2.2, cd: .65, col: '#35C6D8', col2: '#FF6B4A', desc: 'Hybrid: a parrot eel made of sparks.' },
  stormnut:  { name: 'Stormnut',   region: 1, hybrid: 1, role: 'ranged', hp: 120, dmg: 26, rng: 3.2, spd: 1.2, cd: 1, col: '#FFD84A', col2: '#B07A4A', desc: 'Hybrid: coconuts full of lightning.' },
  tidecog:   { name: 'Tidecog',    region: 3, hybrid: 1, role: 'tank',   hp: 900, dmg: 28, rng: .7, spd: .7, cd: 1,   col: '#FF9DB8', col2: '#C98A4A', desc: 'Hybrid: a clockwork clam fortress.' },
};
const BASIC = Object.keys(SPECIES).filter(k => !SPECIES[k].hybrid);
const HYBRIDS = { 'coconeer+pebblet': 'shellnut', 'coconeer+zippy': 'flingo', 'pebblet+puffling': 'boulderpuff', 'eelectra+zippy': 'zipzap', 'coconeer+sparkfinch': 'stormnut', 'bubbleclam+cogbot': 'tidecog' };
const hybridOf = (a, b) => HYBRIDS[[a, b].sort().join('+')] || null;
const TIER_MULT = t => Math.pow(1.7, t - 1);
const MAX_TIER = 6;
const EGG_FOOD = [150, 4000, 25000, 120000], EGG_TIME = [90, 1200, 5400, 14400];   // berries and seconds, by region
const stat = (c, k) => SPECIES[c.s][k] * (k === 'hp' || k === 'dmg' ? TIER_MULT(c.t) : 1);
const power = c => Math.round(stat(c, 'hp') / 8 + stat(c, 'dmg') / SPECIES[c.s].cd * 2.2);
const restTime = c => secs(60 * 15 * c.t);
// berries can hurry things along: warm an egg, or give a napping critter a snack
const warmCost = (sp, ms) => Math.max(10, Math.ceil(ms * SPEED / 60000) * Math.round(25 * Math.pow(SPECIES[sp].region + 1, 1.6)));
const snackCost = (c, ms) => Math.max(10, Math.ceil(ms * SPEED / 60000) * 12 * c.t * (SPECIES[c.s].region + 1));   // knocked-out critters nap before they can fight again

// ================= BUILDINGS =================
// Costs are coins. Build times grow ~2.3x per level (capped at 4 days), so the late game takes weeks.
const BLD = {
  hq:     { name: "Keeper's Lodge",     size: 2, cost: 250, time: 90, desc: 'Raises every other building\'s level cap and unlocks more buildings.' },
  farm:   { name: 'Berry Farm',      size: 2, cost: 60,  time: 10, desc: 'Grows berries for eggs and merging.' },
  mill:   { name: 'Coin Mill',       size: 2, cost: 80,  time: 12, desc: 'Makes coins for building.' },
  nest:   { name: 'Hatchery Nest',   size: 2, cost: 120, time: 20, desc: 'Hatch eggs and pair critters for hybrids.' },
  den:    { name: 'Critter Den',     size: 2, cost: 100, time: 15, desc: 'Room for more critters.' },
  pond:   { name: 'Merge Pond',      size: 2, cost: 200, time: 30, desc: 'Merge 3 matching critters into a stronger one.' },
  dock:   { name: 'Airship Dock',    size: 2, cost: 150, time: 30, desc: 'Bigger squads, more battle energy, and new regions.' },
  tower:  { name: 'Slingshot Tower', size: 1, cost: 150, time: 20, desc: 'Defends your island from raids.' },
  cannon: { name: 'Coconut Cannon',  size: 1, cost: 320, time: 40, desc: 'Slow but hits a whole group.' },
};
const BLD_ORDER = ['farm', 'mill', 'tower', 'den', 'cannon', 'pond', 'nest', 'dock', 'hq'];
const cost = (k, L) => Math.round(BLD[k].cost * Math.pow(2.4, L - 1) / 10) * 10;   // grows faster than income, so coins stay precious
const btime = (k, L) => Math.min(4 * 86400, BLD[k].time * Math.pow(2.75, L - 1));   // L2 ~minutes, L5 ~hours, L8+ ~days
const prodRate = (k, L) => k === 'farm' ? 120 * Math.pow(1.3, L - 1) : k === 'mill' ? 90 * Math.pow(1.45, L - 1) : 0;   // per hour
const storeCap = (k, L) => Math.round(prodRate(k, L) * (6 + L * .8));   // enough to cover a night's sleep
const denCap = L => 4 + 2 * (L - 1);
const squadSize = L => 3 + L;
const pondTier = L => Math.min(MAX_TIER, 1 + L);
const nestRegion = L => L >= 9 ? 3 : L >= 6 ? 2 : L >= 3 ? 1 : 0;   // which regions' eggs the nest can hatch
const bhp = (k, L) => ({ hq: 900, tower: 320, cannon: 420, farm: 300, mill: 300, den: 260, nest: 280, pond: 240, dock: 320, hut: 160 })[k] * Math.pow(1.45, L - 1);
const DEF = { tower: { rng: 3.6, dmg: 13, cd: .9 }, cannon: { rng: 4.2, dmg: 34, cd: 2.4, splash: 1 } };
const defDmg = (k, L) => DEF[k].dmg * Math.pow(1.42, L - 1);
const maxCount = (k, hq) => ({ hq: 1, nest: 1, pond: hq >= 2 ? 1 : 0, dock: 1, farm: Math.min(3, 1 + Math.ceil(hq / 4)), mill: Math.min(4, 1 + Math.ceil(hq / 3)),
  den: Math.min(3, 1 + Math.floor(hq / 4)), tower: Math.min(6, 1 + Math.ceil(hq / 2)), cannon: hq >= 3 ? Math.min(4, Math.floor((hq - 1) / 2)) : 0 })[k];
const maxLevel = (k, hq) => k === 'hq' ? 10 : k === 'pond' ? Math.min(5, hq) : hq;
// the build grid: rival islands are always 10x12; your home plot starts at 16x16 and can be expanded
const EN_W = 10, EN_H = 12;
let GRID_W = 10, GRID_H = 12;
const useGrid = (w, h) => { GRID_W = w; GRID_H = h; };
const PLOT_MAX = 26, expandCost = n => Math.round(800 * Math.pow(2.1, n) / 50) * 50, expandHq = n => Math.min(10, n + 2);

// ================= PLAYER LEVEL =================
const xpNeed = L => Math.round(70 * Math.pow(L, 1.9));
const gemsFor = ms => Math.max(1, Math.ceil(ms * SPEED / 60000 / 6));   // 1 gem per 6 minutes left

// ================= RIVAL ISLANDS =================
function islandSpec(r, i){
  const s = r * ISLANDS_PER_REGION + i, R = rng(hashStr('hatchwild-' + r + '-' + i)), boss = i === ISLANDS_PER_REGION - 1;
  const L = clamp(1 + s / 4.5 + (boss ? .4 : 0), 1, 10.5);   // strength rises smoothly island by island
  const blds = [{ k: 'hq', x: 4, y: 1, lv: clamp(L, 1, 10) }];
  const nT = Math.min(6, 1 + Math.floor(s / 5) + (boss ? 1 : 0)), nC = Math.min(4, Math.max(0, Math.floor((s - 1) / 6)));
  const used = new Set(), key = (x, y) => x + ',' + y;
  const mark = (x, y, sz) => { for (let a = 0; a < sz; a++) for (let b = 0; b < sz; b++) used.add(key(x + a, y + b)); };
  const free = (x, y, sz) => { if (x < 0 || y < 0 || x + sz > EN_W || y + sz > EN_H - 3) return false; for (let a = -1; a <= sz; a++) for (let b = -1; b <= sz; b++) if (used.has(key(x + a, y + b)) && a >= 0 && b >= 0 && a < sz && b < sz) return false; return true; };
  mark(4, 1, 2);
  const place = (k, sz, yMax) => { for (let tries = 0; tries < 200; tries++) { const x = Math.floor(R() * (EN_W - sz + 1)), y = Math.floor(R() * Math.min(EN_H - 3 - sz + 1, yMax)); if (free(x, y, sz)) { mark(x, y, sz); return { x, y }; } } return null; };
  for (let n = 0; n < nT; n++) { const p = place('tower', 1, 7); if (p) blds.push({ k: 'tower', ...p, lv: clamp(L - (R() < .4 ? 1 : 0), 1, 10) }); }
  for (let n = 0; n < nC; n++) { const p = place('cannon', 1, 6); if (p) blds.push({ k: 'cannon', ...p, lv: clamp(L - 1, 1, 10) }); }
  for (const k of ['farm', 'mill', R() < .5 ? 'farm' : 'mill']) { const p = place(k, 2, 8); if (p) blds.push({ k, ...p, lv: clamp(L - 1, 1, 10) }); }
  for (let n = 0; n < 2 + Math.floor(R() * 3); n++) { const p = place('hut', 1, 9); if (p) blds.push({ k: 'hut', ...p, lv: clamp(L - 1, 1, 10) }); }
  const reward = { coins: Math.round(180 * Math.pow(1.2, s) / 10) * 10, food: Math.round(120 * Math.pow(1.2, s) / 10) * 10, gems: 2 + r * 2 + (boss ? 10 : 0) };
  let pw = 0; for (const b of blds) pw += bhp(b.k, b.lv) / 25 + (DEF[b.k] ? defDmg(b.k, b.lv) / DEF[b.k].cd * 4 : 0);
  return { r, i, s, boss, blds, reward, power: Math.round(pw), name: boss ? `${REGIONS[r].crew} Fortress` : `${REGIONS[r].crew} Isle ${i + 1}` };
}

// ================= SAVE =================
const KEY = 'hatchwild-save-v1';
function freshSave(){
  const t = Date.now();
  return { v: 1, coins: 350, food: 250, gems: 30, xp: 0, lvl: 1, nextId: 20, made: t, lastSeen: t, raidAt: t, muted: false, tips: {}, quest: 0,
    stats: { collect: 0, hatch: 0, pair: 0, merge: 0, wins: 0, builds: 0 }, cleared: [0, 0, 0, 0], region: 0,
    bld: [
      { id: 1, k: 'hq',   x: 7, y: 6, lv: 1, last: t },
      { id: 2, k: 'farm', x: 3, y: 3, lv: 1, last: t - 3600e3 / 3 },
      { id: 3, k: 'mill', x: 11, y: 4, lv: 1, last: t - 3600e3 / 3 },
      { id: 4, k: 'nest', x: 3, y: 9, lv: 1, last: t },
      { id: 5, k: 'den',  x: 11, y: 9, lv: 1, last: t },
      { id: 6, k: 'dock', x: 7, y: 12, lv: 1, last: t },
      { id: 7, k: 'tower', x: 7, y: 2, lv: 1, last: t },
    ],
    crit: [{ id: 10, s: 'pebblet', t: 1, rest: 0 }, { id: 11, s: 'zippy', t: 1, rest: 0 }, { id: 12, s: 'coconeer', t: 1, rest: 0 }],
    nest: null, eggs: [], plot: { w: 16, h: 16, n: 0 } };
}
let save = freshSave();
try { const s = JSON.parse(localStorage.getItem(KEY)); if (s && s.v === 1) { const hadPlot = !!s.plot; save = Object.assign(freshSave(), s); if (!hadPlot) save.bld.forEach(b => { b.x += 3; b.y += 2; }); } } catch (e) {}

const persist = () => { save.lastSeen = Date.now(); try { localStorage.setItem(KEY, JSON.stringify(save)); } catch (e) {} };
const B = k => save.bld.filter(b => b.k === k);
const lvOf = k => Math.max(0, ...B(k).map(b => b.lv));
const hqLv = () => lvOf('hq');
const busy = () => save.bld.filter(b => b.build).length;
const BUILDERS = 2;
const roomLeft = () => B('den').reduce((s, b) => s + denCap(b.lv), 0) - save.crit.length - save.eggs.length - (save.nest ? 1 : 0);
// a region opens once the previous region's fortress falls and your Lodge and Dock are high enough
const regionOpen = r => { const n = REGIONS[r].need; return (r === 0 || save.cleared[r - 1] >= ISLANDS_PER_REGION) && hqLv() >= n.hq && lvOf('dock') >= n.dock; };
function addXp(n){
  save.xp += n; let up = false;
  while (save.xp >= xpNeed(save.lvl)) { save.xp -= xpNeed(save.lvl); save.lvl++; save.gems += 5; up = true; }
  if (up) setTimeout(() => { SFX.level(); toast(`Level ${save.lvl}! +5 gems`); setTimeout(checkRegions, 900); }, 300);
}
function checkRegions(){
  REGIONS.forEach((R, r) => { if (r && regionOpen(r) && !save.tips['region' + r]) { save.tips['region' + r] = 1; persist(); SFX.level();
    modal(`<h2>${R.name} unlocked!</h2><p>New critters to hatch, the ${R.crew} to beat, and ${ISLANDS_PER_REGION} new islands. Set sail from the map!</p><button class="btn" type="button" data-close>Let's go!</button>`); } });
}

// ================= ART =================
function rr(c, x, y, w, h, r){ r = Math.min(r, w / 2, h / 2); c.beginPath(); c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r); c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath(); }
const circ = (c, x, y, r, col) => { c.fillStyle = col; c.beginPath(); c.arc(x, y, r, 0, 7); c.fill(); };
const ell = (c, x, y, rx, ry, col, rot) => { c.fillStyle = col; c.beginPath(); c.ellipse(x, y, rx, ry, rot || 0, 0, 7); c.fill(); };
function shade(hex, k){ const n = parseInt(hex.slice(1), 16); let r = n >> 16, g = n >> 8 & 255, b = n & 255;
  if (k < 0) { r *= 1 + k; g *= 1 + k; b *= 1 + k; } else { r += (255 - r) * k; g += (255 - g) * k; b += (255 - b) * k; }
  return `rgb(${r | 0},${g | 0},${b | 0})`; }

function drawSea(c, W, H, t, reg){
  const g = c.createLinearGradient(0, 0, 0, H); g.addColorStop(0, reg.sea[0]); g.addColorStop(1, reg.sea[1]); c.fillStyle = g; c.fillRect(0, 0, W, H);
  c.strokeStyle = 'rgba(255,255,255,.22)'; c.lineWidth = 2; c.lineCap = 'round';
  for (let i = 0; i < 26; i++) { const x = ((i * 137) % W) + Math.sin(t * .6 + i) * 10, y = ((i * 89) % H) + (reduce ? 0 : Math.sin(t * .4 + i * 2) * 4);
    c.beginPath(); c.moveTo(x - 10, y); c.quadraticCurveTo(x - 5, y - 4, x, y); c.quadraticCurveTo(x + 5, y + 4, x + 10, y); c.stroke(); }
}
function drawIsland(c, ox, oy, ts, reg, t, seed){
  const w = GRID_W * ts, h = GRID_H * ts, R = rng(seed || 7);
  // foam and sand shore
  c.fillStyle = 'rgba(255,255,255,.35)'; rr(c, ox - ts * .9 + Math.sin(t) * 2, oy - ts * .9, w + ts * 1.8, h + ts * 1.8, ts * 2.2); c.fill();
  c.fillStyle = reg.sand; rr(c, ox - ts * .6, oy - ts * .6, w + ts * 1.2, h + ts * 1.2, ts * 1.8); c.fill();
  c.fillStyle = reg.land2; rr(c, ox - ts * .15, oy - ts * .1, w + ts * .3, h + ts * .3, ts * 1.2); c.fill();
  c.fillStyle = reg.land; rr(c, ox - ts * .15, oy - ts * .2, w + ts * .3, h + ts * .3, ts * 1.2); c.fill();
  // grass tufts and flowers
  for (let i = 0; i < 60; i++) { const x = ox + R() * w, y = oy + R() * h; c.fillStyle = i % 7 === 0 ? '#FFF1A8' : i % 11 === 0 ? '#FF9DB8' : shade(reg.land, -.12);
    if (i % 7 === 0 || i % 11 === 0) { circ(c, x, y, ts * .05, c.fillStyle); } else { c.fillRect(x, y, ts * .04, ts * .12); c.fillRect(x + ts * .06, y + ts * .03, ts * .04, ts * .09); } }
  // palms on the shore
  for (let i = 0; i < 9; i++) { const side = i % 4, f = R(); let x, y;
    if (side === 0) { x = ox + f * w; y = oy - ts * .45; } else if (side === 1) { x = ox + w + ts * .35; y = oy + f * h; } else if (side === 2) { x = ox + f * w; y = oy + h + ts * .5; } else { x = ox - ts * .35; y = oy + f * h; }
    if (side === 2 && x > ox + w * .35 && x < ox + w * .65) continue;
    drawPalm(c, x, y, ts * .9, t + i); }

// ================= RAIDS (while you were away) =================
function raidCheck(){
  const now = Date.now(), total = save.cleared.reduce((a, b) => a + b, 0);

  save.raidAt = now;

}
